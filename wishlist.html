<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
  <title>やりたいことリスト | Notre Endroit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const _sb = window.supabase.createClient(
      'https://qivnfiqyjfajlzbdqodd.supabase.co',
      'sb_publishable_PR_chyGmNVRJJ24eVqlqYg_CGAOjfpx'
    )
    _sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) window.location.href = '/login.html'
    })
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #0a1628 0%, #0d2044 40%, #112a5e 100%) fixed;
      background-attachment: fixed;
      color: #e8f0fc;
      min-height: 100vh;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      gap: 8px;
      background: linear-gradient(180deg, rgba(26,48,96,0.85) 0%, transparent 100%);
      backdrop-filter: blur(4px);
    }

    .top-bar a {
      color: #98bedd;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .top-bar h1 {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.1rem;
      color: #e8f4fd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      text-align: center;
    }

    .logout-btn {
      background: #fff;
      border: 2px solid #e8ddd5;
      color: #8d6e63;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .top-right { display: flex; align-items: center; gap: 8px; }

    .user-badge {
      display: none;
      align-items: center;
      gap: 4px;
      background: #fff;
      border: 2px solid #e8ddd5;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.85rem;
      color: #5d4037;
    }

    @media (max-width: 480px) {
      .user-badge .user-name { display: none; }
      .add-form input { font-size: 16px; }
    }

    /* タブ */
    .tabs {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 16px 20px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      white-space: nowrap;
      padding: 8px 18px;
      border-radius: 24px;
      border: 2px solid #e8ddd5;
      background: #fff;
      color: #8d6e63;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .tab.active {
      background: #81c784;
      border-color: #81c784;
      color: #fff;
    }

    /* メインコンテンツ */
    .content {
      max-width: 640px;
      margin: 0 auto;
      padding: 8px 20px 40px;
    }

    /* 追加フォーム */
    .add-form {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
      margin-bottom: 24px;
      display: flex;
      gap: 10px;
    }

    .add-form input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e8ddd5;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #4a3f35;
      outline: none;
    }

    .add-form input:focus { border-color: #a5d6a7; }

    .add-form button {
      padding: 10px 20px;
      background: #81c784;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .add-form button:hover { background: #66bb6a; }

    /* リスト */
    .wish-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .wish-item {
      background: #fff;
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: opacity 0.2s;
    }

    .wish-item.done {
      opacity: 0.5;
    }

    .wish-item.done .wish-title {
      text-decoration: line-through;
    }

    .check-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      border: 2px solid #a5d6a7;
      background: none;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .check-btn.checked {
      background: #a5d6a7;
      border-color: #a5d6a7;
    }

    .wish-title {
      flex: 1;
      font-size: 0.95rem;
      color: #4a3f35;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #d7ccc8;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .delete-btn:hover { color: #ef9a9a; }

    .empty {
      text-align: center;
      color: #bcaaa4;
      padding: 40px 0;
      font-size: 0.95rem;
    }
  </style>
  <style>.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}</style>
</head>
<body style="visibility:hidden" onload="document.body.style.visibility='visible'">
  <div class="clouds"></div>
  <script src="assets/js/stars.js?v=3"></script>
  <script src="assets/js/push.js"></script>

  <script src="assets/js/header.js"></script>
  <script src="assets/js/nav.js"></script>
  <div class="top-bar">
    <a href="/">← もどる</a>
    <h1>やりたいことリスト</h1>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="content">
    <div class="add-form">
      <input type="text" id="new-title" placeholder="追加する..." maxlength="100">
      <button onclick="addWish()">追加</button>
    </div>
    <div class="wish-list" id="wish-list"></div>
  </div>

  <script>
    const categories = [
      { id: '行きたい場所', icon: '📍' },
      { id: '食べたいもの', icon: '🍽️' },
      { id: '見たいもの',   icon: '🎬' },
      { id: 'ほしいもの',   icon: '🎁' },
      { id: '達成済み',     icon: '✅' },
    ]

    let currentCategory = categories[0].id
    let wishes = []

    // タブ描画
    const tabsEl = document.getElementById('tabs')
    categories.forEach(cat => {
      const btn = document.createElement('button')
      btn.className = 'tab' + (cat.id === currentCategory ? ' active' : '')
      btn.textContent = cat.icon + ' ' + cat.id
      btn.onclick = () => switchCategory(cat.id)
      tabsEl.appendChild(btn)
    })

    function switchCategory(id) {
      currentCategory = id
      document.querySelectorAll('.tab').forEach((btn, i) => {
        btn.classList.toggle('active', categories[i].id === id)
      })
      document.querySelector('.add-form').style.display = id === '達成済み' ? 'none' : 'flex'
      loadWishes()
    }

    async function loadWishes() {
      let query = _sb.from('wishes').select('*').order('created_at', { ascending: true })
      if (currentCategory === '達成済み') {
        query = query.eq('done', true)
      } else {
        query = query.eq('category', currentCategory).eq('done', false)
      }
      const { data } = await query
      wishes = data || []
      renderList()
    }

    function renderList() {
      const list = document.getElementById('wish-list')
      if (wishes.length === 0) {
        const msg = currentCategory === '達成済み'
          ? 'まだ達成したことがありません 🌱'
          : 'まだ何も追加されていません 🌱'
        list.innerHTML = `<div class="empty">${msg}</div>`
        return
      }
      list.innerHTML = wishes.map(w => `
        <div class="wish-item ${w.done ? 'done' : ''}" data-id="${w.id}" data-done="${w.done}">
          <button class="check-btn ${w.done ? 'checked' : ''}" data-action="check" data-id="${w.id}" data-done="${w.done}">
            ${w.done ? '✓' : ''}
          </button>
          <span class="wish-title">${escHtml(w.title)}</span>
          <button class="delete-btn" data-action="delete" data-id="${w.id}">✕</button>
        </div>
      `).join('')
    }

    document.getElementById('wish-list').addEventListener('click', async e => {
      const btn = e.target.closest('[data-action]')
      if (!btn) return
      const id = btn.dataset.id
      if (btn.dataset.action === 'check') {
        const done = btn.dataset.done === 'true'
        wishes = wishes.map(w => String(w.id) === id ? { ...w, done: !done } : w)
        renderList()
        const { error } = await _sb.from('wishes').update({ done: !done }).eq('id', id)
        if (error) console.error('update error:', JSON.stringify(error))
        if (currentCategory === '達成済み' || !done) await loadWishes()
      }
      if (btn.dataset.action === 'delete') {
        wishes = wishes.filter(w => String(w.id) !== id)
        renderList()
        const { error } = await _sb.from('wishes').delete().eq('id', id)
        if (error) console.error('delete error:', JSON.stringify(error))
      }
    })

    async function addWish() {
      const input = document.getElementById('new-title')
      const title = input.value.trim()
      if (!title) return
      const { data } = await _sb.from('wishes').insert({
        title,
        category: currentCategory,
        done: false
      }).select().single()
      if (data) {
        wishes.push(data)
        renderList()
        input.value = ''
      }
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    }

    document.getElementById('new-title').addEventListener('keydown', e => {
      if (e.key === 'Enter') addWish()
    })

    loadWishes()
  </script>
</body>
</html>
