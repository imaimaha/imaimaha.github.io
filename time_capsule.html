<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイムカプセル | Notre Endroit</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const _sb = window.supabase.createClient(
      'https://qivnfiqyjfajlzbdqodd.supabase.co',
      'sb_publishable_PR_chyGmNVRJJ24eVqlqYg_CGAOjfpx'
    )
    _sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) window.location.href = '/login.html'
    })
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #0a1628 0%, #0d2044 40%, #112a5e 100%) fixed;
      background-attachment: fixed;
      color: #e8f0fc;
      min-height: 100vh;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: linear-gradient(180deg, rgba(26,48,96,0.9) 0%, transparent 100%);
      backdrop-filter: blur(4px);
      position: sticky; top: 0; z-index: 10;
    }

    .top-bar a { color: #98bedd; text-decoration: none; font-size: 0.9rem; }
    .top-bar h1 { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.2rem; color: #e8f4fd; flex: 1; text-align: center; }
    .user-badge {
      display: flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.1); border: 1.5px solid rgba(150,200,255,0.3);
      border-radius: 20px; padding: 4px 10px; font-size: 0.85rem; color: #e8f4fd;
    }

    .content { max-width: 600px; margin: 0 auto; padding: 24px 16px 80px; }

    /* タブ */
    .tabs {
      display: flex; gap: 0;
      background: rgba(255,255,255,0.06);
      border-radius: 12px; padding: 4px;
      margin-bottom: 24px;
    }
    .tab-btn {
      flex: 1; padding: 10px 8px;
      background: none; border: none; color: #98bedd;
      font-size: 0.9rem; font-family: inherit;
      border-radius: 9px; cursor: pointer; transition: all 0.2s;
    }
    .tab-btn.active {
      background: rgba(100,160,255,0.25);
      color: #e8f4fd; font-weight: bold;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* フォーム */
    .compose-card {
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(100,180,255,0.2);
      border-radius: 20px; padding: 24px;
      margin-bottom: 24px;
      backdrop-filter: blur(4px);
    }

    .compose-card h2 {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.1rem; color: #c5ddf5;
      margin-bottom: 16px;
    }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.8rem; color: #7aadcc; margin-bottom: 6px; }

    .field textarea {
      width: 100%; padding: 14px;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(100,180,255,0.25);
      border-radius: 12px; color: #e8f4fd;
      font-size: 16px; font-family: inherit;
      resize: vertical; min-height: 100px;
      transition: border-color 0.2s;
    }
    .field textarea:focus { outline: none; border-color: rgba(100,200,255,0.6); }
    .field textarea::placeholder { color: #4a6a8a; }

    .field input[type="datetime-local"] {
      width: 100%; padding: 12px 14px;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(100,180,255,0.25);
      border-radius: 12px; color: #e8f4fd;
      font-size: 16px; font-family: inherit;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .field input[type="datetime-local"]:focus { outline: none; border-color: rgba(100,200,255,0.6); }
    .field input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(0.7); }

    .date-hint { font-size: 0.75rem; color: #5a7fa8; margin-top: 4px; }

    /* 開封タイミング モード切替 */
    .timing-mode {
      display: flex; gap: 0;
      background: rgba(255,255,255,0.05);
      border-radius: 10px; padding: 3px;
      margin-bottom: 12px;
    }
    .timing-btn {
      flex: 1; padding: 8px 4px;
      background: none; border: none; color: #7aadcc;
      font-size: 0.82rem; font-family: inherit;
      border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .timing-btn.active {
      background: rgba(100,160,255,0.28);
      color: #e8f4fd;
    }

    .range-row {
      display: flex; align-items: center; gap: 8px;
    }
    .range-row input { flex: 1; min-width: 0; }
    .range-sep { color: #5a7fa8; font-size: 0.9rem; white-space: nowrap; flex-shrink: 0; }

    .send-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #2a5298, #3a7bd5);
      border: none; border-radius: 14px;
      color: #fff; font-size: 1rem; font-family: inherit;
      cursor: pointer; transition: opacity 0.2s, transform 0.1s;
      font-weight: bold;
    }
    .send-btn:active { transform: scale(0.98); opacity: 0.9; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* カプセルカード */
    .capsule-list { display: flex; flex-direction: column; gap: 14px; }

    .capsule-card {
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(100,180,255,0.15);
      border-radius: 16px; padding: 20px;
      backdrop-filter: blur(4px);
      transition: transform 0.2s;
    }

    /* 未開封・届いたカプセル */
    .capsule-card.pending {
      border-color: rgba(255,215,100,0.5);
      background: rgba(255,215,100,0.06);
      animation: pulse-glow 2.5s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 12px rgba(255,215,100,0.15); }
      50% { box-shadow: 0 0 24px rgba(255,215,100,0.35); }
    }

    .capsule-card.opened {
      opacity: 0.7;
    }

    .capsule-meta {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 8px; margin-bottom: 10px;
    }

    .capsule-from {
      font-size: 0.8rem; color: #7aadcc;
    }

    .capsule-status {
      font-size: 0.75rem; padding: 3px 10px;
      border-radius: 20px; white-space: nowrap;
    }
    .status-pending { background: rgba(255,215,100,0.2); color: #ffd764; }
    .status-opened  { background: rgba(100,220,180,0.2); color: #64ddb4; }
    .status-waiting { background: rgba(150,180,255,0.15); color: #98bedd; }

    .capsule-message {
      font-size: 0.95rem; line-height: 1.6; color: #c8dff0;
      white-space: pre-wrap; word-break: break-word;
    }

    .capsule-date {
      font-size: 0.75rem; color: #5a7fa8; margin-top: 8px;
    }

    .open-btn {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #b8860b, #daa520);
      border: none; border-radius: 12px;
      color: #fff; font-size: 0.95rem; font-family: inherit;
      cursor: pointer; transition: opacity 0.2s;
      margin-top: 12px; font-weight: bold;
    }
    .open-btn:active { opacity: 0.85; }

    .empty-state {
      text-align: center; padding: 48px 20px;
      color: #4a6a8a;
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }

    /* 開封アニメーション overlay */
    #open-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(5,15,40,0.92);
      justify-content: center; align-items: center;
      backdrop-filter: blur(8px);
    }
    #open-overlay.show { display: flex; }

    .open-modal {
      background: linear-gradient(160deg, rgba(20,40,90,0.95), rgba(10,20,60,0.95));
      border: 1.5px solid rgba(255,215,100,0.4);
      border-radius: 24px; padding: 36px 28px;
      max-width: 380px; width: 90%;
      text-align: center;
      box-shadow: 0 0 60px rgba(255,215,100,0.15);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.92) translateY(16px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .open-modal .capsule-icon { font-size: 3.5rem; margin-bottom: 12px; }
    .open-modal .open-from { font-size: 0.85rem; color: #ffd764; margin-bottom: 16px; }
    .open-modal .open-message {
      font-size: 1rem; line-height: 1.7; color: #e8f4fd;
      background: rgba(255,255,255,0.06); border-radius: 12px;
      padding: 16px; text-align: left; white-space: pre-wrap;
      word-break: break-word; margin-bottom: 16px;
    }
    .open-modal .open-dates { font-size: 0.78rem; color: #5a7fa8; margin-bottom: 20px; }
    .open-modal .close-btn {
      padding: 12px 32px;
      background: linear-gradient(135deg, #2a5298, #3a7bd5);
      border: none; border-radius: 12px;
      color: #fff; font-size: 0.95rem; font-family: inherit;
      cursor: pointer;
    }

    /* トースト */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(30,60,120,0.95); color: #e8f4fd;
      padding: 12px 20px; border-radius: 12px;
      font-size: 0.85rem; z-index: 300;
      opacity: 0; transition: opacity 0.3s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body style="visibility:hidden" onload="document.body.style.visibility='visible'">

  <script src="assets/js/header.js"></script>
  <div class="top-bar">
    <a href="/index.html">← ホーム</a>
    <h1>🎁 タイムカプセル</h1>
  </div>

  <div class="content">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('received')">届いた</button>
      <button class="tab-btn" onclick="switchTab('sent')">送った</button>
      <button class="tab-btn" onclick="switchTab('compose')">作る ✏️</button>
    </div>

    <!-- 届いたカプセル -->
    <div id="tab-received" class="tab-panel active">
      <div id="received-list" class="capsule-list">
        <div class="empty-state"><div class="empty-icon">📭</div><div>読み込み中...</div></div>
      </div>
    </div>

    <!-- 送ったカプセル -->
    <div id="tab-sent" class="tab-panel">
      <div id="sent-list" class="capsule-list">
        <div class="empty-state"><div class="empty-icon">📭</div><div>読み込み中...</div></div>
      </div>
    </div>

    <!-- 作る -->
    <div id="tab-compose" class="tab-panel">
      <div class="compose-card">
        <h2>✉️ パートナーへ送る</h2>
        <div class="field">
          <label>メッセージ</label>
          <textarea id="msg-input" placeholder="未来の相手へ伝えたいこと..."></textarea>
        </div>
        <div class="field">
          <label>開封タイミング</label>
          <div class="timing-mode">
            <button class="timing-btn active" id="tmode-exact" onclick="setTimingMode('exact')">日時指定</button>
            <button class="timing-btn"        id="tmode-range" onclick="setTimingMode('range')">範囲ランダム</button>
            <button class="timing-btn"        id="tmode-auto"  onclick="setTimingMode('auto')">おまかせ</button>
          </div>
          <!-- 日時指定 -->
          <div id="timing-exact">
            <input type="datetime-local" id="open-date-input">
            <div class="date-hint">届けたい日時をピンポイントで指定</div>
          </div>
          <!-- 範囲ランダム -->
          <div id="timing-range" style="display:none">
            <div class="range-row">
              <input type="datetime-local" id="range-from-input">
              <span class="range-sep">〜</span>
              <input type="datetime-local" id="range-to-input">
            </div>
            <div class="date-hint">この期間の中でランダムに届きます 🎲</div>
          </div>
          <!-- おまかせ -->
          <div id="timing-auto" style="display:none">
            <div class="date-hint" style="padding:10px 2px;font-size:0.85rem;color:#7aadcc">3日〜3か月後のどこかに自動設定されます 🎲</div>
          </div>
        </div>
        <button class="send-btn" id="send-btn" onclick="sendCapsule()">🎁 カプセルを送る</button>
      </div>
    </div>
  </div>

  <!-- 開封モーダル -->
  <div id="open-overlay">
    <div class="open-modal">
      <div class="capsule-icon">🎁</div>
      <div id="open-from" class="open-from"></div>
      <div id="open-message" class="open-message"></div>
      <div id="open-dates" class="open-dates"></div>
      <button class="close-btn" onclick="closeOpenModal()">閉じる</button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let myId = null, partnerId = null, myProfile = null, partnerProfile = null

    async function init() {
      const { data: { session } } = await _sb.auth.getSession()
      if (!session) return
      myId = session.user.id

      const { data: profiles } = await _sb.from('profiles').select('*')
      if (profiles) {
        myProfile = profiles.find(p => p.id === myId)
        partnerProfile = profiles.find(p => p.id !== myId)
        partnerId = partnerProfile?.id
      }

      // datetime-local の最小値を「今から1時間後」に設定
      const minDt = new Date(Date.now() + 60 * 60 * 1000)
      const pad = n => String(n).padStart(2, '0')
      const minStr = `${minDt.getFullYear()}-${pad(minDt.getMonth()+1)}-${pad(minDt.getDate())}T${pad(minDt.getHours())}:${pad(minDt.getMinutes())}`
      document.getElementById('open-date-input').min = minStr
      document.getElementById('range-from-input').min = minStr
      document.getElementById('range-to-input').min = minStr

      // URLパラメータで届いたタブを開く
      if (location.hash === '#received') switchTab('received')

      await loadReceived()
      await loadSent()
    }

    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        const names = ['received', 'sent', 'compose']
        btn.classList.toggle('active', names[i] === name)
      })
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'))
      document.getElementById('tab-' + name).classList.add('active')
    }

    async function loadReceived() {
      if (!myId) return
      // 2人分の全カプセルを取得（RLSで自分に関係するもののみ返る）
      // 開封済み or open_atが過去のものだけ = 「届いた」判定
      const nowIso = new Date().toISOString()
      const { data } = await _sb
        .from('time_capsules')
        .select('*')
        .or(`is_opened.eq.true,open_at.lte.${nowIso}`)
        .order('open_at', { ascending: false })

      const el = document.getElementById('received-list')
      if (!data || data.length === 0) {
        el.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div>まだカプセルは届いていません</div></div>'
        return
      }

      el.innerHTML = data.map(c => renderReceived(c)).join('')
    }

    function profileFor(userId) {
      if (userId === myId) return myProfile
      if (userId === partnerId) return partnerProfile
      return null
    }

    function renderReceived(c) {
      const sender    = profileFor(c.sender_id)
      const recipient = profileFor(c.recipient_id)
      const senderLabel    = sender    ? `${sender.emoji} ${sender.name}`       : '?'
      const recipientLabel = recipient ? `${recipient.emoji} ${recipient.name}` : '?'
      const createdDate = new Date(c.created_at).toLocaleString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      const openDate = new Date(c.open_at).toLocaleString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      const isMyOutgoing = c.sender_id === myId
      const canOpen = !c.is_opened && c.recipient_id === myId

      if (c.is_opened) {
        // 自分が受け取ったカプセルにだけ返信ボタン
        const replyBtn = c.recipient_id === myId
          ? `<button class="open-btn" style="margin-top:12px" onclick="replyTo('${c.sender_id}', '${escAttr(c.message.slice(0,50))}')">↩️ 返信</button>`
          : ''
        return `
          <div class="capsule-card opened">
            <div class="capsule-meta">
              <div class="capsule-from">${senderLabel} → ${recipientLabel}</div>
              <span class="capsule-status status-opened">開封済み ✓</span>
            </div>
            <div class="capsule-message">${escHtml(c.message)}</div>
            <div class="capsule-date">📅 送られた日: ${createdDate}　|　開封日: ${openDate}</div>
            ${replyBtn}
          </div>
        `
      }

      // 未開封（open_at 過ぎている）
      if (canOpen) {
        return `
          <div class="capsule-card pending" id="capsule-${c.id}">
            <div class="capsule-meta">
              <div class="capsule-from">${senderLabel} → ${recipientLabel}</div>
              <span class="capsule-status status-pending">未開封 ✨</span>
            </div>
            <div class="capsule-message" style="color:#5a7fa8;font-style:italic">（開封するとメッセージが見られます）</div>
            <div class="capsule-date">届いた日: ${openDate}</div>
            <button class="open-btn" onclick="openCapsule('${c.id}', '${escAttr(c.message)}', '${createdDate}', '${openDate}', '${sender?.emoji ?? '?'}', '${sender?.name ?? '?'}')">
              🎁 開ける
            </button>
          </div>
        `
      }

      // 相手宛の未開封カプセル: 開けられないが「相手に届いてる」表示
      return `
        <div class="capsule-card pending">
          <div class="capsule-meta">
            <div class="capsule-from">${senderLabel} → ${recipientLabel}</div>
            <span class="capsule-status status-pending">${recipientLabel} が未開封</span>
          </div>
          <div class="capsule-message" style="color:#5a7fa8;font-style:italic">（${recipient?.name ?? '相手'} が開けるまで内容は見えません）</div>
          <div class="capsule-date">届いた日: ${openDate}</div>
        </div>
      `
    }

    // 返信: 作成タブへ遷移して相手を対象にプレフィル
    function replyTo(originalSenderId, quotedPreview) {
      // originalSenderIdは私が「受信した」時の相手→この人に返信を送る
      const input = document.getElementById('msg-input')
      const prefix = quotedPreview ? `↩️ 「${decodeURIComponent(quotedPreview)}」への返信\n\n` : '↩️ 返信\n\n'
      input.value = prefix
      switchTab('compose')
      input.focus()
      // カーソルを末尾に
      input.setSelectionRange(input.value.length, input.value.length)
    }

    async function openCapsule(id, message, createdDate, openDate, senderEmoji, senderName) {
      // DB更新
      await _sb.from('time_capsules').update({
        is_opened: true,
        opened_at: new Date().toISOString()
      }).eq('id', id)

      // モーダル表示
      document.getElementById('open-from').textContent = `${senderEmoji} ${senderName} より`
      document.getElementById('open-message').textContent = decodeURIComponent(message)
      document.getElementById('open-dates').textContent = `送られた日: ${createdDate}　|　届いた日: ${openDate}`
      document.getElementById('open-overlay').classList.add('show')

      // カードを更新
      const card = document.getElementById('capsule-' + id)
      if (card) {
        card.classList.remove('pending')
        card.classList.add('opened')
        card.innerHTML = `
          <div class="capsule-meta">
            <div class="capsule-from">${senderEmoji} ${senderName} より</div>
            <span class="capsule-status status-opened">開封済み ✓</span>
          </div>
          <div class="capsule-message">${escHtml(decodeURIComponent(message))}</div>
          <div class="capsule-date">📅 送られた日: ${createdDate}　|　届いた日: ${openDate}</div>
        `
      }
    }

    function closeOpenModal() {
      document.getElementById('open-overlay').classList.remove('show')
    }

    async function loadSent() {
      if (!myId) return
      const { data } = await _sb
        .from('time_capsules')
        .select('*')
        .eq('sender_id', myId)
        .order('created_at', { ascending: false })

      const el = document.getElementById('sent-list')
      if (!data || data.length === 0) {
        el.innerHTML = '<div class="empty-state"><div class="empty-icon">📤</div><div>まだカプセルを送っていません</div></div>'
        return
      }

      el.innerHTML = data.map(c => {
        const recipientEmoji = (c.recipient_id === myId ? myProfile?.emoji : partnerProfile?.emoji) || '?'
        const recipientName = (c.recipient_id === myId ? myProfile?.name : partnerProfile?.name) || '?'
        const createdDate = new Date(c.created_at).toLocaleString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        const openDate = new Date(c.open_at).toLocaleString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        const now = new Date()
        const isDelivered = new Date(c.open_at) <= now

        let statusHtml
        if (c.is_opened) {
          statusHtml = '<span class="capsule-status status-opened">開封済み ✓</span>'
        } else if (isDelivered) {
          statusHtml = '<span class="capsule-status status-pending">未開封 ✨</span>'
        } else {
          statusHtml = '<span class="capsule-status status-waiting">配達待ち ⏳</span>'
        }

        const previewMsg = c.message.length > 30 ? c.message.slice(0, 30) + '…' : c.message

        return `
          <div class="capsule-card${c.is_opened ? ' opened' : ''}">
            <div class="capsule-meta">
              <div class="capsule-from">→ ${recipientEmoji} ${recipientName} へ</div>
              ${statusHtml}
            </div>
            <div class="capsule-message" style="font-size:0.88rem">${escHtml(previewMsg)}</div>
            <div class="capsule-date">📅 送った日: ${createdDate}　|　開封予定: ${openDate}</div>
          </div>
        `
      }).join('')
    }

    let timingMode = 'exact'

    function setTimingMode(mode) {
      timingMode = mode
      ;['exact', 'range', 'auto'].forEach(m => {
        document.getElementById('tmode-' + m).classList.toggle('active', m === mode)
        document.getElementById('timing-' + m).style.display = m === mode ? '' : 'none'
      })
    }

    async function sendCapsule() {
      const msg = document.getElementById('msg-input').value.trim()
      if (!msg) { showToast('メッセージを入力してください'); return }
      if (!partnerId) { showToast('パートナー情報が取得できませんでした'); return }

      let openAt
      if (timingMode === 'exact') {
        const dateInput = document.getElementById('open-date-input').value
        if (!dateInput) { showToast('日時を選んでください'); return }
        openAt = new Date(dateInput).toISOString()
      } else if (timingMode === 'range') {
        const fromVal = document.getElementById('range-from-input').value
        const toVal   = document.getElementById('range-to-input').value
        if (!fromVal || !toVal) { showToast('開始と終了の日時を両方選んでください'); return }
        const fromMs = new Date(fromVal).getTime()
        const toMs   = new Date(toVal).getTime()
        if (toMs <= fromMs) { showToast('終了日時は開始より後にしてください'); return }
        openAt = new Date(fromMs + Math.random() * (toMs - fromMs)).toISOString()
      } else {
        // おまかせ: 3〜90日後のランダム
        const daysLater = 3 + Math.floor(Math.random() * 88)
        const d = new Date()
        d.setDate(d.getDate() + daysLater)
        openAt = d.toISOString()
      }

      const btn = document.getElementById('send-btn')
      btn.disabled = true
      btn.textContent = '送信中...'

      const { error } = await _sb.from('time_capsules').insert({
        sender_id: myId,
        recipient_id: partnerId,
        message: msg,
        open_at: openAt
      })

      btn.disabled = false
      btn.textContent = '🎁 カプセルを送る'

      if (error) {
        console.error('time_capsule insert error:', error)
        showToast('送信失敗: ' + (error.message || error.code || 'unknown'))
        return
      }

      const openDate = new Date(openAt).toLocaleString('ja-JP', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      showToast(`🎁 ${openDate}ごろに届きます！`)
      document.getElementById('msg-input').value = ''
      document.getElementById('open-date-input').value = ''
      document.getElementById('range-from-input').value = ''
      document.getElementById('range-to-input').value = ''
      await loadSent()
      switchTab('sent')
    }

    function showToast(msg) {
      const el = document.getElementById('toast')
      el.textContent = msg
      el.classList.add('show')
      setTimeout(() => el.classList.remove('show'), 2800)
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function escAttr(s) {
      return encodeURIComponent(String(s))
    }

    init()
  </script>
</body>
</html>
