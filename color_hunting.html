  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #0a1628 0%, #0d2044 40%, #112a5e 100%) fixed;
      color: #e8f0fc;
      min-height: 100vh;
    }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: linear-gradient(180deg, rgba(26,48,96,0.85), transparent);
    }
    .top-bar a { color: #98bedd; text-decoration: none; font-size: 0.9rem; }
    .top-bar h1 { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.3rem; color: #e8f4fd; }
    .content { max-width: 520px; margin: 0 auto; padding: 20px 16px 60px; }

    .mode-cards { display: flex; flex-direction: column; gap: 12px; }
    .mode-card {
      display: flex; align-items: center; gap: 14px;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(150,200,255,0.22);
      border-radius: 16px; padding: 16px 18px;
      cursor: pointer; transition: background 0.2s, transform 0.15s;
    }
    .mode-card:active { transform: scale(0.97); }
    .mode-card:hover { background: rgba(255,255,255,0.12); }
    .mode-card-icon { font-size: 2rem; flex-shrink: 0; }
    .mode-card-title { font-size: 1.05rem; color: #e8f4fd; margin-bottom: 3px; }
    .mode-card-desc { font-size: 0.78rem; color: #98bedd; line-height: 1.5; }
    .mode-card-arrow { color: #5c8aaf; font-size: 1.1rem; margin-left: auto; }

    /* Screen switching */
    .screen { display: none; }
    .screen.active { display: block; }

    .screen-title {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.35rem; color: #e8f4fd; margin-bottom: 6px;
    }
    .screen-sub { font-size: 0.85rem; color: #98bedd; margin-bottom: 20px; }

    /* Palette */
    .palette-grid {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 10px; margin-top: 12px;
    }
    .palette-swatch {
      aspect-ratio: 1;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.15);
      cursor: pointer;
      display: flex; align-items: flex-end; justify-content: center;
      padding: 4px;
      transition: transform 0.15s, border-color 0.2s;
    }
    .palette-swatch:active { transform: scale(0.94); }
    .palette-swatch .swatch-name {
      font-size: 0.65rem; color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 2px 6px; border-radius: 6px;
    }

    /* Hunt board */
    .hunt-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0 20px;
    }
    .hunt-cell {
      aspect-ratio: 1;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      border: 1.5px dashed rgba(150,200,255,0.28);
      display: flex; align-items: center; justify-content: center;
      color: #7aa;
      font-size: 1.6rem;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      transition: background 0.2s;
    }
    .hunt-cell:hover { background: rgba(255,255,255,0.10); }
    .hunt-cell.filled { border-style: solid; border-color: rgba(150,200,255,0.5); }
    .hunt-cell img { width: 100%; height: 100%; object-fit: cover; }
    .hunt-cell.center {
      cursor: default;
      border: 3px solid rgba(255,255,255,0.6);
      box-shadow: 0 0 20px rgba(255,255,255,0.15);
    }
    .hunt-cell.center .center-color-label {
      position: absolute; bottom: 4px;
      background: rgba(0,0,0,0.55);
      color: #fff; font-size: 0.7rem;
      padding: 3px 8px; border-radius: 8px;
    }

    .hunt-title {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.4rem;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px;
    }
    .color-chip {
      display: inline-block; width: 22px; height: 22px;
      border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
      vertical-align: middle;
    }

    .hunt-actions {
      display: flex; gap: 10px; margin-top: 20px;
    }
    .btn {
      flex: 1; padding: 12px;
      background: rgba(100,160,255,0.16);
      border: 1.5px solid rgba(100,160,255,0.4);
      color: #cfe4ff; border-radius: 12px;
      font-family: inherit; font-size: 0.9rem; cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: rgba(100,160,255,0.28); }
    .btn.primary { background: rgba(80,180,120,0.2); border-color: rgba(80,180,120,0.5); color: #baffcc; }

    input[type="file"] { display: none; }
    input[type="color"] {
      width: 100%; height: 60px; border: none;
      border-radius: 12px; background: transparent;
      cursor: pointer; padding: 0;
    }

    /* toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: rgba(20,40,80,0.95); border: 1px solid rgba(100,160,255,0.4);
      color: #e8f4fd; padding: 10px 22px; border-radius: 30px;
      font-size: 0.9rem; opacity: 0; z-index: 200;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: rgba(80,20,20,0.95); border-color: rgba(255,120,120,0.5); }
  </style>
</head>
<body style="visibility:hidden" onload="document.body.style.visibility='visible'">

  <div class="top-bar">

  <div class="content">
    <!-- Screen: mode -->

      <div class="mode-cards">

      <div class="mode-cards">
        <div class="mode-card" onclick="showScreen('pick')">

    <!-- Screen: pick color -->
    <div class="screen" id="screen-pick">
      <div class="screen-title">色を選ぶ</div>

      <div class="palette-grid" id="palette-grid"></div>

      <div style="margin-top:24px">
        <div style="font-size:0.85rem;color:#98bedd;margin-bottom:8px">自由に選ぶ:</div>
        <input type="color" id="custom-color" value="#ff6b6b" onchange="startSingle(this.value, null)">

    <!-- Screen: hunt board -->
    <div class="screen" id="screen-hunt">

        <span id="hunt-color-label"></span>
      </div>
      <div class="screen-sub">中央の色に合うものを周りに8枚集めよう</div>

      <div class="hunt-board" id="hunt-board"></div>

      <div class="hunt-actions" id="hunt-actions"></div>
    </div>

    <!-- Screen: history -->
    <div class="screen" id="screen-history">
      <div class="screen-title">📖 履歴</div>
      <div class="screen-sub">2人のカラーハント履歴（写真が入っているもの）</div>
      <div id="history-list" style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
        <div style="text-align:center;color:#7aa;padding:32px 0">読み込み中…</div>
      </div>

  <input type="file" id="upload-input" accept="image/*" capture="environment">
  <div class="toast" id="toast"></div>

  <script>
    // ========= Palette =========
    const PALETTE = [
      { name: '桜色',   hex: '#F8B7CE' },
      { name: '朱色',   hex: '#E85C3B' },
      { name: '橙色',   hex: '#F39C12' },
      { name: '山吹色', hex: '#F1C40F' },
      { name: '若草色', hex: '#A9D46F' },
      { name: '常盤色', hex: '#16A085' },
      { name: '空色',   hex: '#5DADE2' },
      { name: '群青',   hex: '#2C3E50' },
      { name: '藤色',   hex: '#B08AD9' },
      { name: '紫紺',   hex: '#7D3C98' },
      { name: '紅梅',   hex: '#E84393' },
      { name: '赤',     hex: '#E74C3C' },
      { name: '黄',     hex: '#F4D03F' },
      { name: '緑',     hex: '#27AE60' },
      { name: '青',     hex: '#3498DB' },
      { name: '茶',     hex: '#8B5A3C' },
      { name: '灰',     hex: '#7F8C8D' },
      { name: '白',     hex: '#ECF0F1' },
      { name: '黒',     hex: '#2C3E50' },
      { name: '金',     hex: '#D4AC0D' },
    ];

    // ========= State =========
    const state = {
      userId: null,
      currentHunt: null,   // { id, mode, week_key, color_hex, color_name, photos:[] }
      profiles: {},        // { userId: {emoji,name} }
      selectingIndex: null,// アップロード対象のマス
      isHuntOwner: true    // 表示中のハントが自分のものか
    };

    // localStorage key for active single hunt id per user
    function activeSingleKey() { return `color_hunt_active_single_${state.userId || 'anon'}` }
    function setActiveSingle(id) { try { localStorage.setItem(activeSingleKey(), id) } catch {} }
    function getActiveSingle() { try { return localStorage.getItem(activeSingleKey()) } catch { return null } }
    function clearActiveSingle() { try { localStorage.removeItem(activeSingleKey()) } catch {} }

    // ========= Utils =========
    function showToast(msg, isError = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast' + (isError ? ' error' : '');
      void el.offsetWidth;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }
    function getWeekStr(date = new Date()) {
      const d = new Date(date.getTime());
      d.setHours(0,0,0,0);
      const dow = d.getDay();
      const days = (dow + 6) % 7;
      d.setDate(d.getDate() - days);
      return d.toLocaleDateString('sv-SE');
    }

    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + name).classList.add('active');
      if (name === 'history') loadHistory();
    }

    // ========= Init =========
    async function init() {
      const { data: { session } } = await _sb.auth.getSession();
      if (!session) return;
      state.userId = session.user.id;

      const { data: profs } = await _sb.from('profiles').select('*');
      (profs || []).forEach(p => { state.profiles[p.id] = p; });

      renderPalette();
      // 自動リダイレクトはしない。単発ボタンを押した時に復元する
    }

    // 単発モードカードのクリックハンドラ: 前回のセッションあれば復元、無ければサブ画面
    async function openSingle() {
      const activeId = getActiveSingle();
      if (activeId) {
        const { data } = await _sb.from('color_hunts')
          .select('*').eq('id', activeId).maybeSingle();
        if (data && data.user_id === state.userId && data.mode === 'single') {
          state.currentHunt = data;
      state.viewingHistory = false;
          await openHuntBoard('single');
          return;
        }
        clearActiveSingle();
      }
      showScreen('single-sub');
    }

    function renderPalette() {
      const grid = document.getElementById('palette-grid');
      grid.innerHTML = '';
      PALETTE.forEach(c => {
        const div = document.createElement('div');
        div.className = 'palette-swatch';
        div.style.background = c.hex;
        div.innerHTML = `<span class="swatch-name">${c.name}</span>`;
        div.onclick = () => startSingle(c.hex, c.name);
        grid.appendChild(div);
      });
    }

    // ========= Weekly Mode =========
    async function startWeekly() {
      const weekKey = getWeekStr();

      // 既存の今週のカラーハントを取得（自分のもののみ = 相手のは別セッション）
      const { data: existing } = await _sb.from('color_hunts')
        .select('*')
        .eq('user_id', state.userId)
        .eq('mode', 'weekly')
        .eq('week_key', weekKey)
        .order('created_at', { ascending: false })
        .limit(1);

      if (existing && existing.length > 0) {
        state.currentHunt = existing[0];
        state.viewingHistory = false;
      } else {
        // 週キーからパレットの色を決定
        const seed = parseInt(weekKey.replace(/-/g, ''), 10);
        const c = PALETTE[seed % PALETTE.length];
        // 新規作成
        const { data, error } = await _sb.from('color_hunts').insert({
          user_id: state.userId,
          mode: 'weekly',
          week_key: weekKey,
          color_hex: c.hex,
          color_name: c.name,
          photos: []
        }).select().single();
        if (error) { showToast('作成に失敗: ' + error.message, true); return; }
        state.currentHunt = data;
      state.viewingHistory = false;
      }

      openHuntBoard('weekly');
    }

    // ========= Single Mode =========
    async function startSingle(hex, name) {
      const { data, error } = await _sb.from('color_hunts').insert({
        user_id: state.userId,
        mode: 'single',
        color_hex: hex,
        color_name: name,
        photos: []
      }).select().single();
      if (error) { showToast('作成に失敗: ' + error.message, true); return; }
      state.currentHunt = data;
      state.viewingHistory = false;
      setActiveSingle(data.id);
      openHuntBoard('single');
    }

    // ランダム色を生成して単発スタート
    async function startRandom() {
      // HSL でランダム生成（彩度・明度は視認しやすい範囲）
      const h = Math.floor(Math.random() * 360);
      const s = 55 + Math.floor(Math.random() * 30);   // 55-85%
      const l = 45 + Math.floor(Math.random() * 20);   // 45-65%
      const hex = hslToHex(h, s, l);
      await startSingle(hex, 'ランダム色');
    }

    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = l - c / 2;
      let r=0,g=0,b=0;
      if (h < 60)      { r=c; g=x; b=0; }
      else if (h<120)  { r=x; g=c; b=0; }
      else if (h<180)  { r=0; g=c; b=x; }
      else if (h<240)  { r=0; g=x; b=c; }
      else if (h<300)  { r=x; g=0; b=c; }
      else             { r=c; g=0; b=x; }
      const toHex = v => Math.round((v + m) * 255).toString(16).padStart(2,'0');
      return '#' + toHex(r) + toHex(g) + toHex(b);
    }

    // 単発の再生成: DBのハント自体は残しつつ、activeフラグを外して初期画面へ
    function regenerateSingle() {
      if (!confirm('新しい色でやり直しますか？現在の写真は履歴に残ります。')) return;
      clearActiveSingle();
      state.currentHunt = null;
      showScreen('single-sub');
    }

    // ========= Hunt Board =========
    async function openHuntBoard(mode) {
      const h = state.currentHunt;
      state.isHuntOwner = h.user_id === state.userId;
      const modeLabel = mode === 'weekly' ? '今週の' : ''
      const historyLabel = state.viewingHistory ? '（履歴・閲覧のみ）' : ''
      document.getElementById('hunt-mode-label').textContent = modeLabel + historyLabel;
      document.getElementById('hunt-color-chip').style.background = h.color_hex;
      document.getElementById('hunt-color-label').textContent = h.color_name || h.color_hex;
      showScreen('hunt');
      await renderBoard();
    }

    async function renderBoard() {
      const h = state.currentHunt;
      const photos = Array.isArray(h.photos) ? h.photos : [];
      const board = document.getElementById('hunt-board');

      // 全photosの signed URL を一括取得 (マスは小さいのでサムネで十分。7日キャッシュ付き)
      const urlMap = {};
      if (photos.length > 0) {
        const signed = await Promise.all(
          photos.map(p => signedPhotoUrl(p.path, { thumb: true }))
        );
        photos.forEach((p, idx) => {
          if (signed[idx]) urlMap[p.path] = signed[idx];
        });
      }

      // アクションボタン更新
      renderHuntActions();

      board.innerHTML = '';
      // 3x3グリッド: 0..8 のインデックス。中央=4。写真スロットは0-3,5-8 の8個。
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'hunt-cell';
        if (i === 4) {
          cell.classList.add('center');
          cell.style.background = h.color_hex;
          cell.innerHTML = `<div class="center-color-label">${escHtml(h.color_name || h.color_hex)}</div>`;
        } else {
          const slotIndex = i < 4 ? i : i - 1;
          const photo = photos.find(p => p.position === slotIndex);
          if (photo) {
            cell.classList.add('filled');
            const url = urlMap[photo.path];
            if (url) {
              cell.innerHTML = `<img src="${url}" alt="" loading="lazy">`;
            } else {
              cell.textContent = '⚠︎';
            }
            if (!state.viewingHistory) {
              cell.onclick = () => {
                if (photo.user_id && photo.user_id !== state.userId) {
                  showToast('相手が撮った写真です', true);
                  return;
                }
                if (confirm('この写真を削除しますか？')) removePhoto(slotIndex);
              };
            }
          } else if (state.isHuntOwner && !state.viewingHistory) {
            cell.textContent = '+';
            cell.onclick = () => triggerUpload(slotIndex);
          } else {
            cell.textContent = '·';
            cell.style.opacity = '0.5';
          }
        }
        board.appendChild(cell);
      }
    }

    function renderHuntActions() {
      const el = document.getElementById('hunt-actions');
      if (!el) return;
      const h = state.currentHunt;
      const isSingle = h?.mode === 'single';
      const isOwner = h?.user_id === state.userId;
      const parts = [];
      parts.push(`<button class="btn" onclick="backFromHunt()">← 戻る</button>`);
      if (isSingle && isOwner) {
        parts.push(`<button class="btn" onclick="regenerateSingle()">🎲 再生成</button>`);
      }
      el.innerHTML = parts.join('');
    }

    function backFromHunt() {
      // 単発モードの自分のハントは維持したまま戻る（activeSingleに残す）
      // 週間モード・履歴閲覧はモード選択に戻る
      showScreen('mode');
    }

    // ========= Upload =========
    function triggerUpload(slotIndex) {
      state.selectingIndex = slotIndex;
      document.getElementById('upload-input').value = '';
      document.getElementById('upload-input').click();
    }

    // 付与済み記録 (写真の削除→再アップでの二重付与防止)。
    // 無ければ「現在の写真状態 = 付与済み」として初期化 (既存ハントの後方互換)
    function ensureAwarded() {
      const h = state.currentHunt;
      if (!h) return null;
      if (!h.awarded || !Array.isArray(h.awarded.positions)) {
        const photos = Array.isArray(h.photos) ? h.photos : [];
        h.awarded = {
          positions: photos.map(p => p.position),
          complete: photos.length >= 8,
          half: photos.length >= 4,
        };
      }
      return h.awarded;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('upload-input');
      input.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file || state.selectingIndex == null) return;

        showToast('アップロード中…');
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `color_hunts/${state.userId}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
        const { error: upErr } = await uploadPhoto(path, file);
        if (upErr) { showToast('アップロード失敗: ' + upErr.message, true); return; }

        const awarded = ensureAwarded();   // ★ photos 更新前に付与済み状態を確定
        const photos = Array.isArray(state.currentHunt.photos) ? [...state.currentHunt.photos] : [];
        // 同じposに既に写真があれば置換
        const existingIdx = photos.findIndex(p => p.position === state.selectingIndex);
        const entry = {
          position: state.selectingIndex,
          path,
          uploaded_at: new Date().toISOString(),
          user_id: state.userId
        };
        if (existingIdx >= 0) photos[existingIdx] = entry;
        else photos.push(entry);

        // ポイント付与: 同じスロットは削除→再アップしても一度きり (awarded.positions で管理)
        let gotPhoto = false, gotComplete = false, gotHalf = false;
        if (awarded && !awarded.positions.includes(state.selectingIndex)) {
          gotPhoto = true;
          awarded.positions.push(state.selectingIndex);
        }
        if (awarded && !awarded.complete && photos.length >= 8) {
          gotComplete = true;
          awarded.complete = true;
        }
        if (awarded && !awarded.half && photos.length >= 4) {
          gotHalf = true;
          awarded.half = true;
        }

        const { error: updErr } = await _sb.from('color_hunts')
          .update({ photos, awarded: state.currentHunt.awarded, updated_at: new Date().toISOString() })
          .eq('id', state.currentHunt.id);
        if (updErr) { showToast('保存失敗: ' + updErr.message, true); return; }

        state.currentHunt.photos = photos;
        await renderBoard();

        if (gotPhoto) addPoints(state.userId, 2, 'color_photo');

        // 相手に push (新規達成のみ。撮り直しでは送らない)
        const doPush = (msg) => notify({
          title: '🎨 カラーハント',
          body: msg,
          url: '/color_hunting.html',
          kind: 'color',
          sender: state.userId,
        });
        if (gotComplete) {
          addPoints(state.userId, 15, 'color_complete');
          doPush('🎨 全8枚コンプリート！');
          showToast('🎨 全8枚コンプリート！');
          return;
        }
        if (gotHalf) doPush('半分の4枚まで集めたよ');
        showToast(gotPhoto ? '✅ 追加しました' : '📷 差し替えました');
      });
    });

    async function removePhoto(slotIndex) {
      const photos = (state.currentHunt.photos || []).filter(p => p.position !== slotIndex);
      const { error } = await _sb.from('color_hunts')
        .update({ photos, updated_at: new Date().toISOString() })
        .eq('id', state.currentHunt.id);
      if (error) { showToast('削除失敗', true); return; }
      state.currentHunt.photos = photos;
      renderBoard();
      showToast('削除しました');
    }

    // ========= History =========
    async function loadHistory() {
      const list = document.getElementById('history-list');
      list.innerHTML = '<div style="text-align:center;color:#7aa;padding:32px 0">読み込み中…</div>';

      const { data, error } = await _sb.from('color_hunts')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(100);

      if (error) { list.innerHTML = '<div style="text-align:center;color:#f88">読み込み失敗</div>'; return; }

      const filled = (data || []).filter(r => Array.isArray(r.photos) && r.photos.length > 0);
      if (filled.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:#7aa;padding:32px 0">まだ写真がありません</div>';
        return;
      }

      list.innerHTML = '';
      filled.forEach(row => {
        const owner = state.profiles[row.user_id];
        const label = owner ? `${owner.emoji} ${owner.name}` : '?';
        const date = new Date(row.created_at).toLocaleDateString('ja-JP');
        const modeLabel = row.mode === 'weekly' ? `今週 (${row.week_key})` : '単発';
        const item = document.createElement('div');
        item.style.cssText = 'background:rgba(255,255,255,0.06);border:1.5px solid rgba(150,200,255,0.2);border-radius:14px;padding:14px 16px;cursor:pointer;transition:background 0.2s';
        item.onmouseover = () => item.style.background = 'rgba(255,255,255,0.10)';
        item.onmouseout = () => item.style.background = 'rgba(255,255,255,0.06)';
        item.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
            <span class="color-chip" style="background:${row.color_hex}"></span>
            <span style="color:#e8f4fd;font-size:0.95rem">${escHtml(row.color_name || row.color_hex)}</span>
            <span style="margin-left:auto;color:#7aa;font-size:0.75rem">${date}</span>
          </div>
          <div style="font-size:0.78rem;color:#98bedd">${label} · ${modeLabel} · 📸 ${row.photos.length}/8</div>
        `;
        item.onclick = () => { state.currentHunt = row; state.viewingHistory = true; openHuntBoard(row.mode); };
        list.appendChild(item);
      });
    }

    init();
  </script>
</body>
</html>
