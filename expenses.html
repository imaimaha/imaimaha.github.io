        —
      </div>
      <div class="modal-btns">

        <button class="btn-save" onclick="doSettle()">確定する</button>
      </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentUser = null
    let partnerProf = null
    let myProf = null
    let allExpenses = []
    let formPayer = 'me'
    let formSplit = 0.5

    function showToast(msg, isErr) {
      const t = document.getElementById('toast')
      t.textContent = msg
      t.className = 'toast show' + (isErr ? ' error' : '')
      setTimeout(() => t.classList.remove('show'), 2200)
    }
    function fmtYen(n) {
      return '¥' + Math.round(Number(n) || 0).toLocaleString('ja-JP')
    }
    const CAT_ICON = {
      '食費': '🍚', '光熱費': '💡', '家賃': '🏠', 'デート': '💕',
      '交通': '🚃', '日用品': '🧴', '旅行': '✈️', 'その他': '📝'
    }

    async function init() {
      const { data: { session } } = await _sb.auth.getSession()
      if (!session) return
      currentUser = session.user
      const { data: profs } = await _sb.from('profiles').select('*')
      if (profs) {
        myProf = profs.find(p => p.id === currentUser.id)
        partnerProf = profs.find(p => p.id !== currentUser.id)
      }
      // Default date to today
      document.getElementById('in-date').value = new Date().toLocaleDateString('sv-SE')

      // Update payer/split chip labels to actual emoji
      if (myProf)      document.querySelector('[data-payer="me"]').textContent      = `${myProf.emoji} 自分`
      if (partnerProf) document.querySelector('[data-payer="partner"]').textContent = `${partnerProf.emoji} 相手`
      if (partnerProf) document.getElementById('split-partner').textContent = `${partnerProf.emoji} 相手全額`
      if (myProf)      document.getElementById('split-me').textContent      = `${myProf.emoji} 自分全額`

      await loadExpenses()
    }

    async function loadExpenses() {
      const { data, error } = await _sb.from('expenses').select('*').order('spent_at', { ascending: false }).order('id', { ascending: false })
      if (error) { showToast('読み込み失敗: ' + error.message, true); return }
      allExpenses = data || []
      renderSummary()
      renderList()
    }

    function calcBalance() {
      let net = 0
      allExpenses.filter(e => !e.settled_at).forEach(e => {
        const partnerShare = Number(e.amount) * Number(e.split_ratio ?? 0.5)
        if (e.paid_by === currentUser.id) net += partnerShare
        else net -= partnerShare
      })
      return Math.round(net)
    }

    function calcMonthTotal() {
      const now = new Date()
      const y = now.getFullYear(), m = now.getMonth()
      const monthStart = new Date(y, m, 1)
      return allExpenses
        .filter(e => new Date(e.spent_at) >= monthStart)
        .reduce((s, e) => s + Number(e.amount), 0)
    }

    function renderSummary() {
      const bal = calcBalance()
      const monthTot = calcMonthTotal()
      const unsettled = allExpenses.filter(e => !e.settled_at).length

      document.getElementById('balance-value').textContent = fmtYen(Math.abs(bal))
      document.getElementById('month-total').textContent = fmtYen(monthTot)
      document.getElementById('unsettled-count').textContent = unsettled + '件'

      const detail = document.getElementById('balance-detail')
      const settleBtn = document.getElementById('settle-btn')
      if (bal === 0) {
        detail.innerHTML = 'バランスは 0 です 🎉'
        settleBtn.disabled = true
      } else if (bal > 0) {
        detail.innerHTML = `<span class="emoji">${partnerProf?.emoji || '🦔'}</span> が <span class="balance-arrow">→</span> <span class="emoji">${myProf?.emoji || '🦊'}</span> に返す`
        settleBtn.disabled = false
      } else {
        detail.innerHTML = `<span class="emoji">${myProf?.emoji || '🦊'}</span> が <span class="balance-arrow">→</span> <span class="emoji">${partnerProf?.emoji || '🦔'}</span> に返す`
        settleBtn.disabled = false
      }
    }

    function renderList() {
      const filter = document.getElementById('filter-select').value
      let list = allExpenses
      if (filter === 'unsettled') list = list.filter(e => !e.settled_at)
      else if (filter === 'settled') list = list.filter(e => e.settled_at)

      const el = document.getElementById('expense-list')
      if (list.length === 0) {
        el.innerHTML = '<div class="empty">記録がまだありません</div>'
        return
      }

      el.innerHTML = ''
      list.forEach(e => {
        const paidByMe = e.paid_by === currentUser.id
        const emoji = paidByMe ? (myProf?.emoji || '🦊') : (partnerProf?.emoji || '🦔')
        const canDelete = e.created_by === currentUser.id && !e.settled_at
        // split_ratio = 支払ってない方(non-payer)の負担割合。表示は支払者/非支払者を絵文字で明示する
        const ratio = Number(e.split_ratio ?? 0.5)
        const payerEmoji = emoji
        const nonPayerEmoji = paidByMe ? (partnerProf?.emoji || '🦔') : (myProf?.emoji || '🦊')
        const ratioLabel = ratio === 0.5 ? '折半'
          : ratio === 1 ? `${nonPayerEmoji}が全額負担`
          : ratio === 0 ? `${payerEmoji}が全額負担`
          : `${nonPayerEmoji}が${Math.round(ratio*100)}%負担`
        const dateStr = new Date(e.spent_at + 'T00:00:00').toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' })
        const item = document.createElement('div')
        item.className = 'expense-item' + (e.settled_at ? ' settled' : '')
        item.innerHTML = `
          <div class="expense-cat">${CAT_ICON[e.category] || '📝'}</div>
          <div class="expense-info">
            <div class="expense-title">${escHtml(e.description || e.category)}</div>
            <div class="expense-meta">
              <span>${dateStr}</span>
              <span class="paid-by">${emoji} が支払い</span>
              <span>${escHtml(e.category)}</span>
              ${e.settled_at ? '<span class="settled-tag">精算済</span>' : ''}
            </div>
          </div>
          <div class="expense-amt">
            ${fmtYen(e.amount)}
            <span class="ratio">${ratioLabel}</span>
          </div>
          ${canDelete ? `<button class="expense-del" onclick="deleteExpense(${e.id})" aria-label="削除">✕</button>` : ''}
        `
        el.appendChild(item)
      })
    }

    function setPayer(btn, val) {
      formPayer = val
      document.querySelectorAll('[data-payer]').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
    }
    function setSplit(btn, val) {
      formSplit = val
      document.querySelectorAll('[data-split]').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
    }

    function toggleForm() {
      const f = document.getElementById('form-card')
      const isOpen = f.classList.toggle('open')
      if (!isOpen) {
        document.getElementById('in-amount').value = ''
        document.getElementById('in-desc').value = ''
      }
    }

    async function submitExpense() {
      const amount = parseInt(document.getElementById('in-amount').value, 10)
      if (!amount || amount < 1) { showToast('金額を入力してください', true); return }
      const category = document.getElementById('in-category').value
      const description = document.getElementById('in-desc').value.trim() || null
      const spent_at = document.getElementById('in-date').value
      const paid_by = formPayer === 'me' ? currentUser.id : partnerProf?.id
      if (!paid_by) { showToast('相手プロフィールが見つかりません', true); return }
      // split_ratio は「支払ってない方の負担割合」として保存する。
      // チップは常に「相手(recorder視点)の負担割合」を表すので、相手が払った回は 1-formSplit に反転させる
      const split_ratio = formPayer === 'me' ? formSplit : (1 - formSplit)

      const { data: inserted, error } = await _sb.from('expenses').insert({
        paid_by, amount, category, description,
        split_ratio,
        spent_at,
        created_by: currentUser.id,
      }).select().single()
      if (error) { showToast('記録失敗: ' + error.message, true); return }

      // 自分が payer なら pt
      if (paid_by === currentUser.id) {
        addPoints(currentUser.id, 1, 'expense_add')
      }

      // 相手に通知
      if (partnerProf) {
        const payerLabel = paid_by === currentUser.id ? (myProf?.emoji + ' ' + (myProf?.name || '自分')) : (partnerProf.emoji + ' ' + (partnerProf.name || '相手'))
        notify({
          title: '💰 割り勘に記録が追加されました',
          body: `${payerLabel} が ${category} に ${fmtYen(amount)} を記録`,
          url: '/expenses.html',
          kind: 'expense',
          recipient: partnerProf.id,
        })
      }

      showToast('✅ 記録しました')
      toggleForm()
      await loadExpenses()
    }

    async function deleteExpense(id) {
      if (!confirm('この記録を削除しますか？')) return
      const { error } = await _sb.from('expenses').delete().eq('id', id)
      if (error) { showToast('削除失敗', true); return }
      showToast('削除しました')
      await loadExpenses()
    }

    function openSettleModal() {
      const bal = calcBalance()
      if (bal === 0) return
      const abs = Math.abs(bal)
      const payer = bal < 0 ? myProf : partnerProf
      const receiver = bal < 0 ? partnerProf : myProf
      document.getElementById('settle-detail').innerHTML = `
        <div>
          <span style="font-size:1.4rem">${payer?.emoji || '🦊'}</span>
          <span class="balance-arrow" style="font-size:1.4rem">→</span>
          <span style="font-size:1.4rem">${receiver?.emoji || '🦔'}</span>
        </div>
        <span class="big">${fmtYen(abs)}</span>
        <div style="font-size:0.82rem;color:#98bedd">${escHtml(payer?.name || '')} → ${escHtml(receiver?.name || '')}</div>
        <div style="font-size:0.75rem;color:#7aadcc;margin-top:8px">この金額を渡すと未精算バランスが 0 になります</div>
      `
      document.getElementById('settle-modal').classList.add('open')
    }
    function closeSettleModal() {
      document.getElementById('settle-modal').classList.remove('open')
    }

    async function doSettle() {
      const bal = calcBalance()
      if (bal === 0) { closeSettleModal(); return }
      const abs = Math.abs(bal)
      const payerId = bal < 0 ? currentUser.id : partnerProf.id
      const receiverId = bal < 0 ? partnerProf.id : currentUser.id
      const unsettled = allExpenses.filter(e => !e.settled_at)
      if (unsettled.length === 0) { closeSettleModal(); return }
      const dates = unsettled.map(e => e.spent_at).sort()
      const period_from = dates[0]
      const period_to   = dates[dates.length - 1]

      // 1) settlements に記録
      const { data: settleRow, error: sErr } = await _sb.from('settlements').insert({
        settled_by: currentUser.id,
        net_amount: abs,
        payer_id: payerId,
        receiver_id: receiverId,
        period_from, period_to,
      }).select().single()
      if (sErr) { showToast('精算失敗: ' + sErr.message, true); return }

      // 2) 未精算を全部 settled_at と settlement_id で更新
      const nowIso = new Date().toISOString()
      const ids = unsettled.map(e => e.id)
      const { error: uErr } = await _sb.from('expenses')
        .update({ settled_at: nowIso, settlement_id: settleRow.id })
        .in('id', ids)
      if (uErr) { showToast('更新失敗: ' + uErr.message, true); return }

      // 3) 精算 pt (+3)
      addPoints(currentUser.id, 3, 'expense_settle')

      // 4) 相手に通知
      if (partnerProf) {
        notify({
          title: '✨ 割り勘を精算しました',
          body: `未精算 ${fmtYen(abs)} をリセット。バランスは 0 になりました`,
          url: '/expenses.html',
          kind: 'expense',
          recipient: partnerProf.id,
        })
      }

      closeSettleModal()
      showToast(`✨ 精算しました (${fmtYen(abs)})`)
      await loadExpenses()
    }

    init()
  </script>
</body>
</html>
