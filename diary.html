  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #1a1610 0%, #241e2e 45%, #1e2438 100%) fixed;
      color: #f3ecf3; min-height: 100vh;
    }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
      background: linear-gradient(180deg, rgba(40,34,50,0.85) 0%, transparent 100%);
      backdrop-filter: blur(4px); position: sticky; top: 0; z-index: 10;
    }
    .top-bar a { color: #d0b8d8; text-decoration: none; font-size: 0.9rem; }
    .top-bar h1 { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.2rem; color: #f8ecf4; flex: 1; text-align: center; }
    .top-bar .spacer { width: 52px; }

    .content { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px)); position: relative; z-index: 1; }
    .section-label { font-size: 0.86rem; color: #e8d0ec; font-weight: 700; margin: 4px 4px 12px; }
    .section + .section { margin-top: 26px; }
    .empty-msg { text-align: center; color: #a890b0; font-size: 0.86rem; padding: 18px 10px; line-height: 1.7; }

    .streak-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .streak-chip {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px; border-radius: 14px; font-size: 0.86rem; color: #ffd0a0;
      background: rgba(255,150,80,0.1); border: 1.5px solid rgba(255,170,100,0.3);
    }
    .streak-chip b { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.05rem; color: #ffe4b8; }

    .today-card {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(220,180,240,0.2);
      border-radius: 18px; padding: 16px; margin-bottom: 8px;
    }
    .today-date { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.05rem; color: #f6e8fd; margin-bottom: 10px; }
    .mood-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .mood-chip {
      padding: 7px 11px; border-radius: 999px; font-size: 1rem; cursor: pointer;
      background: rgba(255,255,255,0.05); border: 1.5px solid rgba(220,180,240,0.22);
    }
    .mood-chip.sel { background: rgba(226,140,106,0.22); border-color: rgba(226,140,106,0.6); }
    .diary-textarea {
      width: 100%; min-height: 110px; padding: 12px 14px; resize: vertical;
      background: rgba(0,0,0,0.22); border: 1.5px solid rgba(220,180,240,0.25);
      border-radius: 12px; color: #f3ecf3; font-size: 16px; font-family: inherit; line-height: 1.6; outline: none;
    }
    .diary-save-btn {
      display: block; width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px; border: none; cursor: pointer;
      background: linear-gradient(135deg, #e28c6a, #a8608c); color: #fff;
      font-family: inherit; font-size: 0.92rem; font-weight: 700;
    }
    .diary-save-btn:active { transform: scale(0.98); }

    .entry-card {
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(220,180,240,0.15);
      border-radius: 16px; padding: 13px 15px; margin-bottom: 10px;
    }
    .entry-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .entry-who { font-size: 1.1rem; }
    .entry-date { flex: 1; font-size: 0.76rem; color: #b89ac0; }
    .entry-mood { font-size: 0.95rem; }
    .entry-body { font-size: 0.92rem; color: #f0e0f0; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .entry-edit-btn {
      flex-shrink: 0; padding: 4px 10px; border-radius: 8px; font-size: 0.72rem; cursor: pointer;
      background: rgba(255,255,255,0.06); border: 1.5px solid rgba(220,180,240,0.28); color: #dcc0e4; font-family: inherit;
    }
    .entry-edit-btn.danger { color: #ffb0b0; border-color: rgba(255,120,120,0.35); }
    .entry-edit-area textarea {
      width: 100%; min-height: 90px; padding: 11px 13px; resize: vertical; margin-top: 4px;
      background: rgba(0,0,0,0.22); border: 1.5px solid rgba(220,180,240,0.3);
      border-radius: 12px; color: #f3ecf3; font-size: 16px; font-family: inherit; line-height: 1.6; outline: none;
    }
    .entry-edit-btns { display: flex; gap: 8px; margin-top: 8px; }
    .entry-edit-btns button {
      flex: 1; padding: 9px; border-radius: 10px; font-family: inherit; font-size: 0.82rem; font-weight: 700; cursor: pointer;
    }
    .entry-edit-btns .ee-save { background: linear-gradient(135deg,#e28c6a,#a8608c); border: none; color: #fff; }
    .entry-edit-btns .ee-cancel { background: rgba(255,255,255,0.08); border: 1.5px solid rgba(220,180,240,0.25); color: #d0b8d8; }

    /* スタンプ反応 */
    .rx-row {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
      margin-top: 10px; padding-top: 9px;
      border-top: 1px solid rgba(220,180,240,0.12);
    }
    .rx-given {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 5px 10px; border-radius: 999px; font-size: 0.95rem;
      background: rgba(226,140,106,0.16); border: 1.5px solid rgba(226,140,106,0.4);
    }
    .rx-add {
      padding: 6px 12px; border-radius: 999px; cursor: pointer;
      background: rgba(255,255,255,0.06); border: 1.5px dashed rgba(220,180,240,0.35);
      color: #d0b8d8; font-family: inherit; font-size: 0.78rem;
    }
    .rx-add:active { transform: scale(0.96); }
    .rx-chip {
      min-width: 44px; padding: 7px 10px; border-radius: 999px; cursor: pointer;
      background: rgba(255,255,255,0.06); border: 1.5px solid rgba(220,180,240,0.24);
      font-size: 1.15rem; line-height: 1; font-family: inherit;
    }
    .rx-chip.sel { background: rgba(226,140,106,0.24); border-color: rgba(226,140,106,0.65); }
    .rx-chip:active { transform: scale(0.94); }
    .rx-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    /* 書き漏れた日を書く */
    .backfill {
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(220,180,240,0.18);
      border-radius: 16px; padding: 12px 14px;
    }
    .backfill summary { font-size: 0.88rem; color: #e8d0ec; cursor: pointer; }
    .backfill-body { margin-top: 12px; }
    .backfill-note { font-size: 0.76rem; color: #b89ac0; line-height: 1.6; margin-bottom: 10px; }
    .backfill-row { display: flex; gap: 8px; align-items: center; }
    .backfill-row input[type="date"] {
      flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px;
      background: rgba(0,0,0,0.22); border: 1.5px solid rgba(220,180,240,0.25);
      color: #f3ecf3; font-size: 16px; font-family: inherit;
    }
    .bf-btn {
      flex-shrink: 0; padding: 10px 14px; border-radius: 10px; cursor: pointer;
      background: rgba(226,140,106,0.18); border: 1.5px solid rgba(226,140,106,0.5);
      color: #ffd8c0; font-family: inherit; font-size: 0.82rem;
    }
    .bf-btn:active { transform: scale(0.97); }
    #bf-form { margin-top: 12px; }

    .memory-year-label { font-size: 0.78rem; color: #e2a878; font-weight: 700; margin: 14px 4px 6px; }
    .memory-year-label:first-child { margin-top: 0; }

    .toast {
      position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(20px);
      background: rgba(36,30,44,0.96); border: 1.5px solid rgba(226,140,106,0.5);
      color: #ffe0c8; padding: 10px 20px; border-radius: 999px; font-size: 0.85rem;
      opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 400;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body style="visibility:hidden" onload="document.body.style.visibility='visible'">
  <script src="assets/js/util.js?v=202608061558"></script>
  <script src="assets/js/header.js?v=202608061558"></script>
  <script src="assets/js/nav.js?v=202608061558"></script>

  <div class="top-bar">
    <a href="/index.html">← ホーム</a>
    <h1>📔 ふたりの日記</h1>
    <span class="spacer"></span>
  </div>

  <div class="content">
    <div class="section">
      <div class="streak-row" id="streak-row"></div>
      <div class="today-card">
        <div class="today-date" id="today-date"></div>
        <div class="mood-row" id="mood-row"></div>
        <textarea class="diary-textarea" id="my-body" maxlength="2000" placeholder="今日はどんな一日だった？"></textarea>
        <button class="diary-save-btn" onclick="saveEntry()">📔 今日の日記を書く</button>
      </div>
      <div id="partner-today"></div>
    </div>

    <!-- 書き漏れた日をあとから書く (ポイント消費) -->
    <div class="section">
      <details class="backfill">
        <summary>📝 書き漏れた日を書く</summary>
        <div class="backfill-body">
          <div class="backfill-note" id="backfill-note"></div>
          <div class="backfill-row">
            <input type="date" id="bf-date">
            <button class="bf-btn" onclick="prepareBackfill()">この日を書く</button>
          </div>
          <div id="bf-form" style="display:none">
            <div class="mood-row" id="bf-mood-row"></div>
            <textarea class="diary-textarea" id="bf-body" maxlength="2000" placeholder="その日はどんな一日だった？"></textarea>
            <button class="diary-save-btn" onclick="saveBackfill()" id="bf-save"></button>
          </div>
        </div>
      </details>
    </div>

    <div class="section" id="memory-section" style="display:none">
      <div class="section-label">✨ この日の思い出</div>
      <div id="memory-list"></div>
    </div>

    <div class="section">
      <div class="section-label">📖 これまでの日記</div>
      <div id="history-list"><div class="empty-msg">読み込み中...</div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // 日付の変わり目は JST 2:00 (深夜に書いても「その日」の日記になる)
    const DIARY_TODAY = () => jstDateStrAt(2)
    // 書き漏れた日をあとから書くときの消費ポイント
    const BACKFILL_COST = 20

    const MOODS = ['☀️', '🌤️', '☁️', '🌧️', '⛈️', '❄️', '🌈', '🥰', '😊', '😴', '😢', '😤']
    // 相手の日記に押せるスタンプ
    const STAMPS = ['💖', '🥰', '👏', '🙏', '🫂', '😆', '🥲', '✨', '💪', '😴']

    let myId = null, myProfile = null, partnerProfile = null, profById = {}
    let entries = []
    let reactions = []
    let today = null
    let selMood = null
    let editingEntryId = null

    function fmtDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00')
      return d.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' })
    }
    function fmtShort(dateStr) {
      const d = new Date(dateStr + 'T00:00:00')
      return d.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', weekday: 'short' })
    }
    function monthDay(dateStr) { return dateStr.slice(5) }   // "MM-DD"
    function yearOf(dateStr) { return parseInt(dateStr.slice(0, 4), 10) }

    async function init() {
      const { data: { session } } = await _sb.auth.getSession()
      if (!session) { location.href = '/login.html'; return }
      myId = session.user.id
      const { data: profiles } = await _sb.from('profiles').select('*')
      ;(profiles || []).forEach(p => { profById[p.id] = p })
      myProfile = profById[myId] || null
      partnerProfile = (profiles || []).find(p => p.id !== myId) || null

      today = DIARY_TODAY()
      document.getElementById('today-date').textContent = fmtDate(today)
      renderMoodRow()

      const [{ data }, { data: rx }] = await Promise.all([
        _sb.from('diary_entries').select('*').order('date_str', { ascending: false }),
        _sb.from('diary_reactions').select('*'),
      ])
      entries = data || []
      reactions = rx || []

      const mine = entries.find(e => e.user_id === myId && e.date_str === today)
      if (mine) { document.getElementById('my-body').value = mine.body; selMood = mine.mood; renderMoodRow() }

      renderPartnerToday()
      renderMemories()
      renderHistory()
      renderStreaks()
      initBackfillUI()
    }

    // ── 連続記入ストリーク ──
    const STREAK_BONUS = { 3: 3, 7: 10, 14: 15, 30: 30, 60: 50, 100: 100, 200: 150, 365: 300 }

    // 1日の抜けはセーフ、2日続けて抜けたら途切れる (util.js の countStreak)
    function streakFor(userId) {
      const mySet = new Set(entries.filter(e => e.user_id === userId).map(e => e.date_str))
      return countStreak(ds => mySet.has(ds), today).days
    }

    function renderStreaks() {
      const row = document.getElementById('streak-row')
      const chips = []
      if (myProfile) chips.push(`<div class="streak-chip">${myProfile.emoji} <b>🔥${streakFor(myId)}</b>日</div>`)
      if (partnerProfile) chips.push(`<div class="streak-chip">${partnerProfile.emoji} <b>🔥${streakFor(partnerProfile.id)}</b>日</div>`)
      // 1日あいてもセーフというルールが伝わるように添える
      chips.push('<div class="streak-chip" style="flex:0 0 auto;font-size:0.7rem;color:#c9a6d8;background:rgba(200,160,220,0.08);border-color:rgba(200,160,220,0.2)">1日あいてもセーフ</div>')
      row.innerHTML = chips.join('')
    }

    async function checkStreakBonus() {
      const streak = streakFor(myId)
      const bonus = STREAK_BONUS[streak]
      if (!bonus) return
      const { data, error } = await _sb.from('diary_streak_awards').insert({ user_id: myId, milestone: streak }).select().single()
      if (error || !data) return   // 既に付与済み (ON CONFLICT)
      await addPoints(myId, bonus, 'diary_streak')
      showToast(`🔥 ${streak}日連続達成！`)
      if (partnerProfile) {
        notify({
          title: '🔥 日記が続いてるね',
          body: `${myProfile?.emoji || ''} が ${streak}日連続で日記を書いたよ`,
          url: '/diary.html', kind: 'diary', recipient: partnerProfile.id,
        })
      }
    }

    function renderMoodRow() {
      document.getElementById('mood-row').innerHTML = MOODS.map(m =>
        `<span class="mood-chip ${m === selMood ? 'sel' : ''}" onclick="setMood('${m}')">${m}</span>`
      ).join('')
    }
    function setMood(m) { selMood = (selMood === m) ? null : m; renderMoodRow() }

    function renderPartnerToday() {
      const el = document.getElementById('partner-today')
      if (!partnerProfile) { el.innerHTML = ''; return }
      const p = entries.find(e => e.user_id === partnerProfile.id && e.date_str === today)
      if (!p) {
        el.innerHTML = `<div class="empty-msg">${partnerProfile.emoji} ${escHtml(partnerProfile.name || '相手')}はまだ今日の日記を書いてないみたい</div>`
        return
      }
      el.innerHTML = entryCardHtml(p, false)
    }

    function entryCardHtml(e, editable) {
      const who = profById[e.user_id]
      if (editable && e.id === editingEntryId) {
        return `
          <div class="entry-card">
            <div class="entry-head">
              <span class="entry-who">${who?.emoji || '👤'}</span>
              <span class="entry-date">${escHtml(who?.name || '')} ・ ${fmtShort(e.date_str)}</span>
              <span class="entry-mood">${e.mood || ''}</span>
            </div>
            <div class="entry-edit-area">
              <textarea id="edit-body-${e.id}" maxlength="2000">${escHtml(e.body)}</textarea>
              <div class="entry-edit-btns">
                <button class="ee-cancel" onclick="cancelEntryEdit()">やめる</button>
                <button class="ee-save" onclick="saveEntryEdit('${e.id}')">保存</button>
              </div>
            </div>
          </div>`
      }
      return `
        <div class="entry-card">
          <div class="entry-head">
            <span class="entry-who">${who?.emoji || '👤'}</span>
            <span class="entry-date">${escHtml(who?.name || '')} ・ ${fmtShort(e.date_str)}</span>
            <span class="entry-mood">${e.mood || ''}</span>
            ${editable ? `<button class="entry-edit-btn" onclick="editEntry('${e.id}')">✎</button>
            <button class="entry-edit-btn danger" onclick="deleteEntry('${e.id}')">🗑</button>` : ''}
          </div>
          <div class="entry-body">${escHtml(e.body)}</div>
          ${reactionBarHtml(e)}
        </div>`
    }

    // ── スタンプ反応 ──
    // 相手の日記: 自分のスタンプを付け外しできる (1エントリ1つ・再タップで解除)
    // 自分の日記: 相手がくれたスタンプを表示するだけ
    function reactionBarHtml(e) {
      const rs = reactions.filter(r => r.entry_id === e.id)
      const mine = rs.find(r => r.user_id === myId)
      const given = rs.filter(r => r.user_id !== myId)
        .map(r => `<span class="rx-given">${profById[r.user_id]?.emoji || '👤'}${r.emoji}</span>`).join('')

      if (e.user_id === myId) return given ? `<div class="rx-row">${given}</div>` : ''

      return `
        <div class="rx-row">
          ${given}
          ${mine
            ? `<button class="rx-chip sel" onclick="toggleRxPicker('${e.id}')">${mine.emoji}</button>`
            : `<button class="rx-add" onclick="toggleRxPicker('${e.id}')">＋ スタンプ</button>`}
        </div>
        <div class="rx-picker" id="rx-picker-${e.id}" style="display:none">
          ${STAMPS.map(s => `<button class="rx-chip ${mine?.emoji === s ? 'sel' : ''}" onclick="setReaction('${e.id}','${s}')">${s}</button>`).join('')}
        </div>`
    }

    function toggleRxPicker(entryId) {
      const el = document.getElementById('rx-picker-' + entryId)
      const wasOpen = el && el.style.display !== 'none'
      closeRxPickers()
      if (el && !wasOpen) el.style.display = 'flex'
    }
    function closeRxPickers() {
      document.querySelectorAll('.rx-picker').forEach(p => { p.style.display = 'none' })
    }

    function renderEntryViews() {
      renderPartnerToday(); renderMemories(); renderHistory()
    }

    async function setReaction(entryId, emoji) {
      const e = entries.find(x => x.id === entryId)
      if (!e || e.user_id === myId) return   // 自分の日記には押せない
      const mine = reactions.find(r => r.entry_id === entryId && r.user_id === myId)
      closeRxPickers()

      // 同じスタンプをもう一度 → 解除
      if (mine && mine.emoji === emoji) {
        const { error } = await _sb.from('diary_reactions').delete().eq('entry_id', entryId).eq('user_id', myId)
        if (error) { showToast('うまくいかなかった'); console.error(error); return }
        reactions = reactions.filter(r => !(r.entry_id === entryId && r.user_id === myId))
        renderEntryViews()
        showToast('スタンプを外したよ')
        return
      }

      const { data, error } = await _sb.from('diary_reactions')
        .upsert({ entry_id: entryId, user_id: myId, emoji }, { onConflict: 'entry_id,user_id' })
        .select().single()
      if (error) { showToast('うまくいかなかった'); console.error(error); return }
      reactions = reactions.filter(r => !(r.entry_id === entryId && r.user_id === myId))
      reactions.push(data)
      renderEntryViews()
      showToast(`${emoji} を送ったよ`)

      notify({
        title: `${emoji} 日記にスタンプがついたよ`,
        body: `${myProfile?.emoji || ''} が ${fmtShort(e.date_str)} の日記に ${emoji} をくれたよ`,
        url: '/diary.html', kind: 'diary', recipient: e.user_id,
      })
    }

    function renderMemories() {
      const md = monthDay(today)
      const thisYear = yearOf(today)
      const past = entries.filter(e => e.date_str !== today && monthDay(e.date_str) === md && yearOf(e.date_str) < thisYear)
      const sec = document.getElementById('memory-section')
      if (!past.length) { sec.style.display = 'none'; return }
      sec.style.display = 'block'
      // 年ごとにグルーピング (新しい年から)
      const byYear = {}
      past.forEach(e => { (byYear[yearOf(e.date_str)] ||= []).push(e) })
      const years = Object.keys(byYear).map(Number).sort((a, b) => b - a)
      document.getElementById('memory-list').innerHTML = years.map(y => {
        const rows = byYear[y].sort((a, b) => a.user_id.localeCompare(b.user_id))
        return `<div class="memory-year-label">${y}年 (${thisYear - y}年前)</div>` +
          rows.map(e => entryCardHtml(e, e.user_id === myId)).join('')
      }).join('')
    }

    function renderHistory() {
      const el = document.getElementById('history-list')
      const past = entries.filter(e => e.date_str !== today)
      if (!past.length) { el.innerHTML = '<div class="empty-msg">まだ日記はないよ。今日から書いてみよう ✨</div>'; return }
      el.innerHTML = past.slice(0, 120).map(e => entryCardHtml(e, e.user_id === myId)).join('')
    }

    async function saveEntry() {
      const body = document.getElementById('my-body').value.trim()
      if (!body) { showToast('本文を入れてね'); return }
      const already = entries.find(e => e.user_id === myId && e.date_str === today)
      const { data, error } = await _sb.from('diary_entries')
        .upsert({ user_id: myId, date_str: today, mood: selMood, body, updated_at: new Date().toISOString() }, { onConflict: 'user_id,date_str' })
        .select().single()
      if (error) { showToast('保存に失敗しました'); console.error(error); return }
      entries = entries.filter(e => !(e.user_id === myId && e.date_str === today))
      entries.unshift(data)
      showToast(already ? '更新したよ' : '今日の日記を書いたよ 📔')
      renderStreaks()
      if (!already) {
        await addPoints(myId, 2, 'diary_entry')
        if (partnerProfile) {
          notify({
            title: '📔 ふたりの日記',
            body: `${myProfile?.emoji || ''} が今日の日記を書いたよ`,
            url: '/diary.html', kind: 'diary', recipient: partnerProfile.id,
          })
        }
        await checkStreakBonus()
      }
      renderHistory()
    }

    // ── 書き漏れた日をあとから書く (ポイント消費) ──
    let bfDate = null, bfMood = null

    function initBackfillUI() {
      const input = document.getElementById('bf-date')
      const y = new Date(today + 'T00:00:00+09:00')
      y.setDate(y.getDate() - 1)
      input.max = y.toLocaleDateString('sv-SE')   // 今日は上のカードで書く
      input.value = input.max
      document.getElementById('backfill-note').innerHTML =
        `あとから書くと ${BACKFILL_COST}pt 消費するよ（連続記入もつながる）。<br>今日のぶんは上のカードから無料で書けるよ`
      document.getElementById('bf-save').textContent = `📝 この日の日記を書く（${BACKFILL_COST}pt）`
      renderBfMoodRow()
    }

    function renderBfMoodRow() {
      document.getElementById('bf-mood-row').innerHTML = MOODS.map(m =>
        `<span class="mood-chip ${m === bfMood ? 'sel' : ''}" onclick="setBfMood('${m}')">${m}</span>`
      ).join('')
    }
    function setBfMood(m) { bfMood = (bfMood === m) ? null : m; renderBfMoodRow() }

    function prepareBackfill() {
      const d = document.getElementById('bf-date').value
      if (!d) { showToast('日付を選んでね'); return }
      if (d >= today) { showToast('今日のぶんは上のカードから書けるよ'); return }
      if (entries.some(e => e.user_id === myId && e.date_str === d)) {
        showToast('その日はもう書いてあるよ'); return
      }
      bfDate = d
      bfMood = null
      renderBfMoodRow()
      document.getElementById('bf-body').value = ''
      document.getElementById('bf-form').style.display = 'block'
      showToast(`${fmtShort(d)} の日記を書こう`)
    }

    async function saveBackfill() {
      if (!bfDate) { showToast('日付を選んでね'); return }
      const body = document.getElementById('bf-body').value.trim()
      if (!body) { showToast('本文を入れてね'); return }
      const btn = document.getElementById('bf-save')
      btn.disabled = true

      try {
        // 消費直前に実残高を確認 (表示が古くてもマイナスにしない)
        const balance = await getBalance(myId)
        if (balance === null) { showToast('ポイントを確認できませんでした'); return }
        if (balance < BACKFILL_COST) { showToast(`ポイントが足りないよ（${BACKFILL_COST}pt必要）`); return }
        if (entries.some(e => e.user_id === myId && e.date_str === bfDate)) {
          showToast('その日はもう書いてあるよ'); return
        }

        const { data, error } = await _sb.from('diary_entries')
          .upsert({ user_id: myId, date_str: bfDate, mood: bfMood, body, updated_at: new Date().toISOString() },
                  { onConflict: 'user_id,date_str' })
          .select().single()
        if (error) { showToast('保存に失敗しました'); console.error(error); return }

        const paid = await addPoints(myId, -BACKFILL_COST, 'diary_backfill')
        if (!paid) {
          // 消費できなかったら日記も取り消す (タダ書きにしない)
          await _sb.from('diary_entries').delete().eq('id', data.id)
          showToast('ポイントの処理に失敗しました')
          return
        }

        entries = entries.filter(e => !(e.user_id === myId && e.date_str === bfDate))
        entries.unshift(data)
        entries.sort((a, b) => b.date_str.localeCompare(a.date_str))
        document.getElementById('bf-form').style.display = 'none'
        showToast(`${fmtShort(bfDate)} の日記を書いたよ 📝`)
        renderStreaks(); renderMemories(); renderHistory()
        await checkStreakBonus()

        if (partnerProfile) {
          notify({
            title: '📔 書き漏れた日の日記',
            body: `${myProfile?.emoji || ''} が ${fmtShort(bfDate)} の日記をあとから書いたよ`,
            url: '/diary.html', kind: 'diary', recipient: partnerProfile.id,
          })
        }
        bfDate = null
      } finally {
        btn.disabled = false
      }
    }

    function editEntry(entryId) {
      const e = entries.find(x => x.id === entryId)
      if (!e || e.user_id !== myId) return
      editingEntryId = entryId
      renderMemories(); renderHistory()
      const ta = document.getElementById('edit-body-' + entryId)
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length) }
    }

    function cancelEntryEdit() {
      editingEntryId = null
      renderMemories(); renderHistory()
    }

    async function saveEntryEdit(entryId) {
      const e = entries.find(x => x.id === entryId)
      if (!e) return
      const ta = document.getElementById('edit-body-' + entryId)
      const trimmed = (ta?.value || '').trim()
      if (!trimmed) { showToast('空にはできないよ'); return }
      const { error } = await _sb.from('diary_entries').update({ body: trimmed, updated_at: new Date().toISOString() }).eq('id', entryId)
      if (error) { showToast('更新に失敗しました'); console.error(error); return }
      e.body = trimmed
      editingEntryId = null
      renderMemories(); renderHistory()
      showToast('更新したよ')
    }

    async function deleteEntry(entryId) {
      const e = entries.find(x => x.id === entryId)
      if (!e || e.user_id !== myId) return
      if (!confirm('この日の日記を削除する？')) return
      const { error } = await _sb.from('diary_entries').delete().eq('id', entryId)
      if (error) { showToast('削除に失敗しました'); console.error(error); return }
      entries = entries.filter(x => x.id !== entryId)
      reactions = reactions.filter(r => r.entry_id !== entryId)   // DB 側は ON DELETE CASCADE
      if (editingEntryId === entryId) editingEntryId = null
      renderMemories(); renderHistory(); renderStreaks()
      showToast('削除したよ')
    }

    let toastTimer = null
    function showToast(msg) {
      const t = document.getElementById('toast')
      t.textContent = msg
      t.classList.add('show')
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => t.classList.remove('show'), 2200)
    }

    init()
  </script>
</body>
</html>
