<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ありがとう | Notre Endroit</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=202608031439">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const _sb = window.supabase.createClient(
      'https://qivnfiqyjfajlzbdqodd.supabase.co',
      'sb_publishable_PR_chyGmNVRJJ24eVqlqYg_CGAOjfpx'
    )
    _sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) window.location.href = '/login.html'
    })
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #0a1628 0%, #0d2044 40%, #112a5e 100%) fixed;
      background-attachment: fixed;
      color: #e8f4fd;
      min-height: 100vh;
    }
    .clouds { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .top-bar {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: linear-gradient(180deg, rgba(26,48,96,0.78) 0%, transparent 100%);
      backdrop-filter: blur(8px);
    }
    .top-bar a { color: #98bedd; text-decoration: none; font-size: 0.9rem; }
    .top-bar h1 { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.3rem; color: #e8f4fd; }

    .content { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 20px 16px 80px; }

    .compose-card {
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,180,199,0.35);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.28), inset 0 0 24px rgba(255,180,199,0.06);
      padding: 20px; margin-bottom: 24px;
      backdrop-filter: blur(12px) saturate(1.15);
      -webkit-backdrop-filter: blur(12px) saturate(1.15);
    }
    .compose-title { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.15rem; color: #ffb3c7; margin-bottom: 12px; }
    .compose-input {
      width: 100%; padding: 12px 14px;
      background: rgba(0,0,0,0.24); border: 1.5px solid rgba(255,180,199,0.32);
      border-radius: 12px; color: #f0f6ff;
      font-size: 15px; font-family: inherit;
      min-height: 90px; resize: vertical;
    }
    .compose-input::placeholder { color: rgba(200,220,255,0.4); }
    .compose-input:focus { outline: none; border-color: rgba(255,180,199,0.6); }
    .send-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #e75a7c, #ff8caa);
      color: #fff; border: none; border-radius: 14px;
      font-family: inherit; font-size: 1rem; font-weight: bold;
      margin-top: 10px; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 20px rgba(231,90,124,0.38);
    }
    .send-btn:hover  { box-shadow: 0 6px 26px rgba(231,90,124,0.5); }
    .send-btn:active { transform: scale(0.98); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .quick-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .quick-tag {
      padding: 6px 12px;
      background: rgba(255,180,199,0.14);
      border: 1px solid rgba(255,180,199,0.4);
      color: #ffd0e0; border-radius: 14px;
      font-size: 0.78rem; cursor: pointer;
      transition: background 0.18s, transform 0.14s;
    }
    .quick-tag:hover  { background: rgba(255,180,199,0.26); }
    .quick-tag:active { transform: scale(0.95); }

    .section-title {
      font-family: 'Zen Kurenaido', sans-serif; font-size: 1.2rem;
      color: #f0f6ff; margin: 24px 0 12px; padding-left: 12px;
      border-left: 4px solid #ffb3c7;
    }

    .post {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(150,200,255,0.15);
      border-radius: 16px;
      padding: 14px 16px; margin-bottom: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      position: relative;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .post-header {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.82rem; color: #98bedd; margin-bottom: 6px;
    }
    .post-emoji { font-size: 1.05rem; }
    .post-arrow { color: #ffb3c7; }
    .post-message { font-size: 0.98rem; color: #e8f4fd; white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
    .post-time { font-size: 0.7rem; color: #5a7fa8; margin-top: 6px; }
    .post-delete {
      position: absolute; top: 10px; right: 10px;
      background: none; border: none; color: #5a7fa8; font-size: 0.85rem; cursor: pointer;
      transition: color 0.18s;
    }
    .post-delete:hover { color: #ff9d9d; }

    .empty { text-align: center; color: #7aadcc; padding: 30px 0; font-size: 0.9rem; }

    /* Gift box (previously peach) */
    .gift-box {
      margin-top: 14px; padding: 12px 14px;
      background: linear-gradient(135deg, rgba(255,215,100,0.10), rgba(255,180,50,0.12));
      border: 1.5px solid rgba(255,215,100,0.35);
      border-radius: 12px;
    }
    .gift-title { font-size: 0.85rem; color: #ffd764; margin-bottom: 8px; font-weight: bold; }
    .gift-input {
      width: 90px; padding: 7px 10px;
      background: rgba(0,0,0,0.24); border: 1.5px solid rgba(255,215,100,0.4);
      border-radius: 10px; color: #f0f6ff;
      font-size: 14px; font-family: inherit;
    }
    .gift-label { font-size: 0.85rem; color: #98bedd; }
    .gift-preview-val { font-weight: bold; color: #ffd764; }
    .gift-hint { font-size: 0.75rem; color: #98bedd; }
    .gift-hint b { color: #ffd764; }
  </style>
</head>
<body style="visibility:hidden" onload="document.body.style.visibility='visible'">
  <div class="clouds"></div>
  <script src="assets/js/stars.js?v=202608031439"></script>
  <script src="assets/js/push.js?v=202608031439"></script>
  <script src="assets/js/util.js?v=202608031439"></script>
  <script src="assets/js/header.js?v=202608031439"></script>
  <script src="assets/js/nav.js?v=202608031439"></script>

  <div class="top-bar">
    <a href="/">← ホーム</a>
    <h1>🌸 ありがとう</h1>
  </div>

  <div class="content">
    <div class="compose-card">
      <div class="compose-title">相手にありがとうを送る</div>
      <textarea class="compose-input" id="msg-input" placeholder="いつもありがとう…、〇〇してくれてありがとう…、など"></textarea>
      <div class="quick-tags">
        <span class="quick-tag" onclick="addTag('いつもありがとう ')">いつもありがとう</span>
        <span class="quick-tag" onclick="addTag('ごはんおいしかった ')">ごはん</span>
        <span class="quick-tag" onclick="addTag('話きいてくれてありがとう ')">話</span>
        <span class="quick-tag" onclick="addTag('やさしくしてくれてありがとう ')">やさしさ</span>
        <span class="quick-tag" onclick="addTag('会えて嬉しかった ')">会えて</span>
      </div>

      <div class="gift-box">
        <div class="gift-title">🎁 感謝の気持ちをptで（任意）</div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">
          <input id="gift-amount" type="number" value="0" min="0" step="1" class="gift-input">
          <span class="gift-label">pt → 相手 <span id="gift-preview" class="gift-preview-val">+0pt</span></span>
        </div>
        <div class="gift-hint">自分のptを消費して相手に<b>1.5倍</b>で届きます (残高: <span id="gift-balance" class="gift-preview-val">…</span>)</div>
      </div>

      <button class="send-btn" id="send-btn" onclick="sendThanks()">🌸 送る</button>
    </div>

    <h2 class="section-title">ふたりのありがとう</h2>
    <div id="posts-list"></div>
  </div>

  <script>
    let currentUser = null
    let profiles = {}
    let partnerId = null

    async function init() {
      const { data: { session } } = await _sb.auth.getSession()
      if (!session) return
      currentUser = session.user
      const { data: profs } = await _sb.from('profiles').select('*')
      ;(profs || []).forEach(p => { profiles[p.id] = p })
      const partner = (profs || []).find(p => p.id !== currentUser.id)
      partnerId = partner?.id || null
      await loadPosts()
      await loadBalance()

      // ギフトプレビューの更新
      const gAmount = document.getElementById('gift-amount')
      const gPreview = document.getElementById('gift-preview')
      const upd = () => {
        const n = parseInt(gAmount.value) || 0
        gPreview.textContent = '+' + Math.round(n * 1.5) + 'pt'
      }
      gAmount.addEventListener('input', upd)
      upd()
    }

    async function loadBalance() {
      const total = await getBalance(currentUser.id)
      if (total === null) return null
      const el = document.getElementById('gift-balance')
      if (el) el.textContent = total + 'pt'
      return total
    }


    function addTag(text) {
      const input = document.getElementById('msg-input')
      input.value += text
      input.focus()
    }

    async function sendThanks() {
      const msg = document.getElementById('msg-input').value.trim()
      const giftAmount = parseInt(document.getElementById('gift-amount').value) || 0

      if (!msg) { showToast('メッセージを入力してください'); return }
      if (!partnerId) { showToast('相手情報が取得できません'); return }

      // ギフトあり時は残高チェック (消費直前にDBの実残高を再確認)
      if (giftAmount > 0) {
        const balance = await loadBalance()
        if (balance === null) { showToast('残高の確認に失敗しました'); return }
        if (giftAmount > balance) {
          showToast(`残高不足（${balance}pt しかありません）`)
          return
        }
      }

      const btn = document.getElementById('send-btn')
      btn.disabled = true

      const { error } = await _sb.from('thanks_posts').insert({
        from_user_id: currentUser.id,
        to_user_id: partnerId,
        message: msg,
        gift_amount: giftAmount > 0 ? giftAmount : null,
      })
      if (error) { showToast('送信失敗: ' + error.message); btn.disabled = false; return }

      // ポイント: 送信 +1pt (通常)、ギフトありは -giftAmount / 相手 +giftAmount*2
      const pointRows = [
        { user_id: currentUser.id, amount: 1, reason: 'thanks_send' },
      ]
      if (giftAmount > 0) {
        pointRows.push({ user_id: currentUser.id, amount: -giftAmount, reason: 'thanks_gift_sent' })
        pointRows.push({ user_id: partnerId, amount: Math.round(giftAmount * 1.5), reason: 'thanks_gift_received' })
      }
      await _sb.from('points').insert(pointRows)

      // Push通知（ギフトありは金額もタイトルに含める）
      const notifTitle = giftAmount > 0 ? '🎁 ポイント付きのありがとうが届いたよ' : '🌸 ありがとう'
      notify({
        title: notifTitle,
        body: msg.length > 50 ? msg.slice(0, 50) + '…' : msg,
        url: '/thanks.html',
        kind: 'thanks',
        recipient: partnerId,
      })

      document.getElementById('msg-input').value = ''
      document.getElementById('gift-amount').value = '0'
      document.getElementById('gift-preview').textContent = '+0pt'
      btn.disabled = false
      await loadBalance()
      await loadPosts()
    }

    async function loadPosts() {
      const list = document.getElementById('posts-list')
      const { data, error } = await _sb.from('thanks_posts')
        .select('*').order('created_at', { ascending: false }).limit(100)
      if (error) { list.innerHTML = '<div class="empty">読み込み失敗</div>'; return }
      if (!data || data.length === 0) {
        list.innerHTML = '<div class="empty">まだありがとうが投稿されていません</div>'
        return
      }
      list.innerHTML = ''
      data.forEach(p => {
        const from = profiles[p.from_user_id]
        const to = profiles[p.to_user_id]
        const time = new Date(p.created_at).toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })
        const canDelete = p.from_user_id === currentUser.id
        const el = document.createElement('div')
        el.className = 'post'
        el.innerHTML = `
          ${canDelete ? `<button class="post-delete" onclick="deletePost('${p.id}')">🗑</button>` : ''}
          <div class="post-header">
            <span class="post-emoji">${from?.emoji ?? '?'}</span>
            <span>${escHtml(from?.name ?? '?')}</span>
            <span class="post-arrow">→</span>
            <span class="post-emoji">${to?.emoji ?? '?'}</span>
            <span>${escHtml(to?.name ?? '?')}</span>
          </div>
          <div class="post-message">${escHtml(p.message)}</div>
          ${p.gift_amount ? `<div style="margin-top:6px;padding:6px 10px;background:linear-gradient(135deg,rgba(255,215,100,0.14),rgba(255,180,50,0.18));border:1px solid rgba(255,215,100,0.35);border-radius:10px;font-size:0.82rem;color:#ffd764;font-weight:bold">🎁 +${Math.round(p.gift_amount * 1.5)}pt プレゼント（消費: ${p.gift_amount}pt）</div>` : ''}
          <div class="post-time">${time}</div>
        `
        list.appendChild(el)
      })
    }

    async function deletePost(id) {
      if (!confirm('このポストを削除しますか？')) return
      const { error } = await _sb.from('thanks_posts').delete().eq('id', id)
      if (error) { showToast('削除失敗'); return }
      await loadPosts()
    }

    function showToast(msg) {
      const el = document.createElement('div')
      el.textContent = msg
      el.style.cssText = 'position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(20,40,80,0.95);border:1px solid rgba(100,160,255,0.4);color:#e8f4fd;padding:10px 20px;border-radius:22px;font-size:0.88rem;z-index:500;box-shadow:0 4px 16px rgba(0,0,0,0.3)'
      document.body.appendChild(el)
      setTimeout(() => el.remove(), 2500)
    }

    init()
  </script>
</body>
</html>
