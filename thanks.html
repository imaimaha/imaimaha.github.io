<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ありがとう | Notre Endroit</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const _sb = window.supabase.createClient(
      'https://qivnfiqyjfajlzbdqodd.supabase.co',
      'sb_publishable_PR_chyGmNVRJJ24eVqlqYg_CGAOjfpx'
    )
    _sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) window.location.href = '/login.html'
    })
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #f6e6d8 0%, #fce7d8 40%, #f5d4c1 100%) fixed;
      color: #5d4037;
      min-height: 100vh;
    }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: linear-gradient(180deg, rgba(255,255,255,0.6), transparent);
    }
    .top-bar a { color: #8d6e63; text-decoration: none; font-size: 0.9rem; }
    .top-bar h1 { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.3rem; color: #6d4c41; }

    .content { max-width: 560px; margin: 0 auto; padding: 20px 16px 80px; }

    .compose-card {
      background: #fff; border-radius: 20px;
      box-shadow: 0 4px 16px rgba(139,84,50,0.12);
      padding: 20px; margin-bottom: 24px;
    }
    .compose-title { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.15rem; color: #6d4c41; margin-bottom: 12px; }
    .compose-input {
      width: 100%; padding: 12px 14px;
      background: #fdf5ef; border: 1.5px solid #e8ddd5;
      border-radius: 12px; color: #5d4037;
      font-size: 15px; font-family: inherit;
      min-height: 90px; resize: vertical;
    }
    .compose-input:focus { outline: none; border-color: #d4a373; }
    .send-btn {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #e07a5f, #d4785a);
      color: #fff; border: none; border-radius: 14px;
      font-family: inherit; font-size: 1rem; font-weight: bold;
      margin-top: 10px; cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
    }
    .send-btn:active { transform: scale(0.98); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .quick-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .quick-tag {
      padding: 5px 10px; background: rgba(224,122,95,0.12);
      border: 1px solid rgba(224,122,95,0.35);
      color: #8d4a37; border-radius: 14px;
      font-size: 0.78rem; cursor: pointer;
    }
    .quick-tag:hover { background: rgba(224,122,95,0.22); }

    .section-title {
      font-family: 'Zen Kurenaido', sans-serif; font-size: 1.15rem;
      color: #6d4c41; margin: 20px 0 10px; padding-left: 8px;
      border-left: 4px solid #d4a373;
    }

    .post {
      background: #fff; border-radius: 16px;
      padding: 14px 16px; margin-bottom: 10px;
      box-shadow: 0 2px 10px rgba(139,84,50,0.08);
      position: relative;
    }
    .post-header {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.82rem; color: #a1887f; margin-bottom: 6px;
    }
    .post-emoji { font-size: 1.05rem; }
    .post-arrow { color: #d4a373; }
    .post-message { font-size: 0.98rem; color: #5d4037; white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
    .post-time { font-size: 0.7rem; color: #bcaaa4; margin-top: 6px; }
    .post-delete {
      position: absolute; top: 10px; right: 10px;
      background: none; border: none; color: #d7ccc8; font-size: 0.85rem; cursor: pointer;
    }
    .post-delete:hover { color: #e07a5f; }

    .empty { text-align: center; color: #a1887f; padding: 30px 0; font-size: 0.9rem; }
  </style>
</head>
<body style="visibility:hidden" onload="document.body.style.visibility='visible'">
  <script src="assets/js/push.js"></script>
  <script src="assets/js/header.js"></script>

  <div class="top-bar">
    <a href="/">← ホーム</a>
    <h1>🌸 ありがとう</h1>
  </div>

  <div class="content">
    <div class="compose-card">
      <div class="compose-title">相手にありがとうを送る</div>
      <textarea class="compose-input" id="msg-input" placeholder="いつもありがとう…、〇〇してくれてありがとう…、など"></textarea>
      <div class="quick-tags">
        <span class="quick-tag" onclick="addTag('いつもありがとう ')">いつもありがとう</span>
        <span class="quick-tag" onclick="addTag('ごはんおいしかった ')">ごはん</span>
        <span class="quick-tag" onclick="addTag('話きいてくれてありがとう ')">話</span>
        <span class="quick-tag" onclick="addTag('やさしくしてくれてありがとう ')">やさしさ</span>
        <span class="quick-tag" onclick="addTag('会えて嬉しかった ')">会えて</span>
      </div>
      <button class="send-btn" id="send-btn" onclick="sendThanks()">🌸 送る（+1pt）</button>
    </div>

    <h2 class="section-title">ふたりのありがとう</h2>
    <div id="posts-list"></div>
  </div>

  <script>
    let currentUser = null
    let profiles = {}
    let partnerId = null

    async function init() {
      const { data: { session } } = await _sb.auth.getSession()
      if (!session) return
      currentUser = session.user
      const { data: profs } = await _sb.from('profiles').select('*')
      ;(profs || []).forEach(p => { profiles[p.id] = p })
      const partner = (profs || []).find(p => p.id !== currentUser.id)
      partnerId = partner?.id || null
      await loadPosts()
    }

    function addTag(text) {
      const input = document.getElementById('msg-input')
      input.value += text
      input.focus()
    }

    async function sendThanks() {
      const msg = document.getElementById('msg-input').value.trim()
      if (!msg) { showToast('メッセージを入力してください'); return }
      if (!partnerId) { showToast('相手情報が取得できません'); return }
      const btn = document.getElementById('send-btn')
      btn.disabled = true

      const { error } = await _sb.from('thanks_posts').insert({
        from_user_id: currentUser.id,
        to_user_id: partnerId,
        message: msg,
      })
      if (error) { showToast('送信失敗: ' + error.message); btn.disabled = false; return }

      // ポイント: 送信 +1pt / 相手にも +1pt (thanks_receive)
      await _sb.from('points').insert([
        { user_id: currentUser.id, amount: 1, reason: 'thanks_send' },
      ])
      // 相手側のポイントも入れたい → RLSで自分の分しかINSERTできないので断念（or send-remindersで補正できるが省略）
      // 代わりに: 「受信 +1pt」は受信者が自分で読み込んだタイミングで claim させるか、Function 経由。今回は簡易に送信のみ加算

      // Push通知
      _sb.functions.invoke('send-push', {
        body: {
          title: '🌸 ありがとう',
          body: msg.length > 50 ? msg.slice(0, 50) + '…' : msg,
          url: '/thanks.html',
          recipient_user_id: partnerId,
        },
      }).then(({ error }) => { if (error) console.error('[thanks] push:', error) })

      document.getElementById('msg-input').value = ''
      btn.disabled = false
      await loadPosts()
    }

    async function loadPosts() {
      const list = document.getElementById('posts-list')
      const { data, error } = await _sb.from('thanks_posts')
        .select('*').order('created_at', { ascending: false }).limit(100)
      if (error) { list.innerHTML = '<div class="empty">読み込み失敗</div>'; return }
      if (!data || data.length === 0) {
        list.innerHTML = '<div class="empty">まだありがとうが投稿されていません</div>'
        return
      }
      list.innerHTML = ''
      data.forEach(p => {
        const from = profiles[p.from_user_id]
        const to = profiles[p.to_user_id]
        const time = new Date(p.created_at).toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })
        const canDelete = p.from_user_id === currentUser.id
        const el = document.createElement('div')
        el.className = 'post'
        el.innerHTML = `
          ${canDelete ? `<button class="post-delete" onclick="deletePost('${p.id}')">🗑</button>` : ''}
          <div class="post-header">
            <span class="post-emoji">${from?.emoji ?? '?'}</span>
            <span>${escHtml(from?.name ?? '?')}</span>
            <span class="post-arrow">→</span>
            <span class="post-emoji">${to?.emoji ?? '?'}</span>
            <span>${escHtml(to?.name ?? '?')}</span>
          </div>
          <div class="post-message">${escHtml(p.message)}</div>
          <div class="post-time">${time}</div>
        `
        list.appendChild(el)
      })
    }

    async function deletePost(id) {
      if (!confirm('このポストを削除しますか？')) return
      const { error } = await _sb.from('thanks_posts').delete().eq('id', id)
      if (error) { showToast('削除失敗'); return }
      await loadPosts()
    }

    function escHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function showToast(msg) {
      const el = document.createElement('div')
      el.textContent = msg
      el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(80,50,30,0.9);color:#fff;padding:10px 20px;border-radius:22px;font-size:0.88rem;z-index:500'
      document.body.appendChild(el)
      setTimeout(() => el.remove(), 2500)
    }

    init()
  </script>
</body>
</html>
