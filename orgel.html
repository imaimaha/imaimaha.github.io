<body style="visibility:hidden" onload="document.body.style.visibility='visible'">

    <a href="/index.html">← ホーム</a>
    <h1>🎼 オルゴール</h1>
  </div>

  <div class="content">
    <div class="ctrl-card">
      <input class="title-input" id="mel-title" maxlength="40" placeholder="曲の名前（例: きみのねがおのワルツ）">
      <div class="tempo-row">
        <button class="tempo-chip" data-bpm="88" onclick="setTempo(88, this)">ゆっくり</button>
        <button class="tempo-chip active" data-bpm="112" onclick="setTempo(112, this)">ふつう</button>
        <button class="tempo-chip" data-bpm="138" onclick="setTempo(138, this)">はやめ</button>
      </div>
      <div class="play-row">
        <button class="btn-play" id="play-btn" onclick="togglePlay()">▶ きく</button>
        <button class="btn-clear" onclick="clearGrid()">クリア</button>
      </div>
      <button class="btn-send" id="send-btn" onclick="sendMelody()">💌 相手にとどける</button>
      <div class="editing-row" id="editing-row">
        <span>✎「<span id="editing-title"></span>」を編集中</span>
        <button onclick="resetEditor()">🆕 新しく作る</button>
      </div>
    </div>

    <div class="hint">
      まるをタップすると穴があいて音が鳴るよ。上から下へ流れて演奏される。<br>
      どこを押してもきれいにハモる音だけ並んでるから、適当に打っても大丈夫 ✨
    </div>

    <!-- オルゴールカード -->
    <div class="card-frame">
      <div class="pitch-header" id="pitch-header"></div>
      <div class="orgel-grid" id="orgel-grid"></div>
    </div>

    <!-- ギャラリー -->
    <div class="section-label">🎁 ふたりのオルゴール棚</div>
    <div id="gallery"><div class="empty-msg">読み込み中...</div></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ─────────────────────────────
    // 設定: Cペンタトニック 2オクターブ+ (低→高)。外れる音が無いスケール
    // ─────────────────────────────
    const PITCHES = [
      { n: 'ド', f: 523.25 }, { n: 'レ', f: 587.33 }, { n: 'ミ', f: 659.26 },
      { n: 'ソ', f: 783.99 }, { n: 'ラ', f: 880.00 },
      { n: 'ド', f: 1046.50 }, { n: 'レ', f: 1174.66 }, { n: 'ミ', f: 1318.51 },
      { n: 'ソ', f: 1567.98 }, { n: 'ラ', f: 1760.00 }, { n: 'ド', f: 2093.00 },
    ]
    const STEPS = 32
    let bpm = 112   // エディタのテンポ (1ステップ = 8分音符 = 30/bpm 秒)

    let myId = null, myProfile = null, partnerProfile = null
    const profById = {}
    // 打った穴: "step:pitch" の Set
    const holes = new Set()
    let editingId = null

    // ─────────────────────────────
    // オルゴール音源 (合成: 基音 + 高次倍音 + きらめき + エコー)
    // 任意の AudioContext / OfflineAudioContext に同じ音を組み立てる
    // ─────────────────────────────
    function buildEchoGraph(c) {
      const master = c.createGain()
      master.gain.value = 0.5
      const delay = c.createDelay(1.0)
      delay.delayTime.value = 0.28
      const fb = c.createGain(); fb.gain.value = 0.22
      const wet = c.createGain(); wet.gain.value = 0.14
      master.connect(c.destination)
      master.connect(delay)
      delay.connect(fb); fb.connect(delay)
      delay.connect(wet); wet.connect(c.destination)
      return master
    }

    function scheduleNote(c, dest, pitchIdx, t) {
      const f = PITCHES[pitchIdx].f
      const out = c.createGain()
      out.gain.setValueAtTime(0, t)
      out.gain.linearRampToValueAtTime(0.85, t + 0.004)
      out.gain.exponentialRampToValueAtTime(0.0004, t + 1.6)
      out.connect(dest)
      const mk = (freq, gain, dur) => {
        const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = freq
        const g = c.createGain(); g.gain.value = gain
        o.connect(g); g.connect(out)
        o.start(t); o.stop(t + dur)
      }
      mk(f, 1.0, 1.7)          // 基音
      mk(f * 4, 0.16, 0.9)     // 倍音 (箱鳴り)
      mk(f * 6.7, 0.05, 0.25)  // きらめき (非整数倍音)
    }

    // ── タップ時のプレビュー音 (ライブ Web Audio。ミュートスイッチONだと鳴らない端末あり) ──
    let ctx = null, master = null
    async function ensureAudio() {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)()
        master = buildEchoGraph(ctx)
      }
      if (ctx.state !== 'running') {
        try { await ctx.resume() } catch (e) {}
      }
    }
    function playNote(pitchIdx) {
      if (!ctx || ctx.state !== 'running') return
      scheduleNote(ctx, master, pitchIdx, ctx.currentTime)
    }

    // ─────────────────────────────
    // 曲の再生: OfflineAudioContext で WAV にレンダリング → <audio> 要素で再生
    // iOS 対策の本命。<audio> はサイレントスイッチONでも鳴り、
    // AudioContext の interrupted 問題（iOS PWAで頻発）の影響も受けない
    // ─────────────────────────────
    const RENDER_LEAD = 0.06   // 頭の無音
    const RENDER_TAIL = 1.8    // エコーの余韻
    let player = null          // 共有 <audio>
    let playing = false
    let playSource = null      // 'editor' or melody id
    let activeStepDur = 30 / 112
    let _blobUrl = null

    function ensurePlayer() {
      if (player) return player
      player = document.createElement('audio')
      player.setAttribute('playsinline', '')
      player.loop = true
      document.body.appendChild(player)
      player.addEventListener('ended', () => { if (playing) stopPlayback() })
      return player
    }

    // AudioBuffer (mono) → 16bit PCM WAV
    function bufferToWav(buf) {
      const ch = buf.getChannelData(0)
      const n = ch.length
      const bytes = 44 + n * 2
      const ab = new ArrayBuffer(bytes)
      const v = new DataView(ab)
      const wstr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)) }
      wstr(0, 'RIFF'); v.setUint32(4, bytes - 8, true); wstr(8, 'WAVE')
      wstr(12, 'fmt '); v.setUint32(16, 16, true)
      v.setUint16(20, 1, true); v.setUint16(22, 1, true)
      v.setUint32(24, buf.sampleRate, true)
      v.setUint32(28, buf.sampleRate * 2, true)
      v.setUint16(32, 2, true); v.setUint16(34, 16, true)
      wstr(36, 'data'); v.setUint32(40, n * 2, true)
      for (let i = 0; i < n; i++) {
        const s = Math.max(-1, Math.min(1, ch[i]))
        v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true)
      }
      return ab
    }

    async function renderWavUrl(notesSet, playBpm) {
      const stepD = 30 / playBpm
      const dur = RENDER_LEAD + STEPS * stepD + RENDER_TAIL
      const sr = 44100
      const off = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, Math.ceil(sr * dur), sr)
      const offMaster = buildEchoGraph(off)
      notesSet.forEach(key => {
        const [s, p] = key.split(':').map(Number)
        scheduleNote(off, offMaster, p, RENDER_LEAD + s * stepD)
      })
      const rendered = await off.startRendering()
      const url = URL.createObjectURL(new Blob([bufferToWav(rendered)], { type: 'audio/wav' }))
      if (_blobUrl) URL.revokeObjectURL(_blobUrl)
      _blobUrl = url
      return url
    }

    let _startSeq = 0   // 連打対策
    async function startPlayback(notesSet, sourceKey, playBpm) {
      const seq = ++_startSeq
      const el = ensurePlayer()
      stopPlayback()
      playing = true
      playSource = sourceKey
      activeStepDur = 30 / (playBpm || bpm)
      updatePlayButtons('…')
      try {
        const url = await renderWavUrl(notesSet, playBpm || bpm)
        if (seq !== _startSeq || !playing) return   // その間に停止/別再生された
        el.src = url
        el.loop = true
        await el.play()
        requestAnimationFrame(uiTick)
      } catch (e) {
        console.error('[orgel] playback failed:', e)
        showToast('再生できませんでした… もう一度タップしてみて')
        playing = false
        playSource = null
      }
      updatePlayButtons()
    }

    function stopPlayback() {
      playing = false
      playSource = null
      if (player) { try { player.pause(); player.currentTime = 0 } catch (e) {} }
      document.querySelectorAll('.orgel-row.playing').forEach(r => r.classList.remove('playing'))
      updatePlayButtons()
    }

    function uiTick() {
      if (!playing || !player) return
      if (playSource === 'editor') {
        // ハイライトのみ。自動スクロールはページ操作を奪うのでしない
        const i = Math.floor((player.currentTime - RENDER_LEAD) / activeStepDur)
        const rows = document.querySelectorAll('.orgel-row')
        rows.forEach((r, idx) => r.classList.toggle('playing', idx === i && i >= 0 && i < STEPS))
      }
      requestAnimationFrame(uiTick)
    }

    async function togglePlay() {
      if (playing && playSource === 'editor') { stopPlayback(); return }
      if (holes.size === 0) { showToast('まずは まるをタップして穴をあけてみて 🎶'); return }
      // ジェスチャ内で <audio> を有効化 (以後は同じ要素ならプログラム的に再生できる)
      primePlayer()
      startPlayback(new Set(holes), 'editor', bpm)
    }

    // ジェスチャ内で無音を一度 play して要素をアンロック (iOS)
    function primePlayer() {
      const el = ensurePlayer()
      if (primePlayer._done) return
      try {
        el.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA'
        el.loop = false
        el.play().catch(() => {})
      } catch (e) {}
      primePlayer._done = true
    }

    function updatePlayButtons(busy) {
      const label = (on) => on ? '■ とめる' : '▶ きく'
      document.getElementById('play-btn').textContent =
        busy && playSource === 'editor' ? busy : label(playing && playSource === 'editor')
      document.querySelectorAll('[data-mel-play]').forEach(b => {
        const on = playing && playSource === b.dataset.melPlay
        b.textContent = busy && playSource === b.dataset.melPlay ? busy : label(on)
      })
    }

    function setTempo(v, chip) {
      bpm = v
      document.querySelectorAll('.tempo-chip').forEach(c => c.classList.toggle('active', c === chip))
    }

    // ─────────────────────────────
    // グリッド
    // ─────────────────────────────
    function buildGrid() {
      const head = document.getElementById('pitch-header')
      head.innerHTML = PITCHES.map(p => `<span>${p.n}</span>`).join('')
      const grid = document.getElementById('orgel-grid')
      grid.innerHTML = ''
      for (let s = 0; s < STEPS; s++) {
        const row = document.createElement('div')
        row.className = 'orgel-row' + (s % 4 === 0 ? ' beat' : '')
        for (let p = 0; p < PITCHES.length; p++) {
          const cell = document.createElement('button')
          cell.className = 'orgel-cell'
          cell.dataset.key = s + ':' + p
          cell.setAttribute('aria-label', `${s + 1}拍目 ${PITCHES[p].n}`)
          cell.addEventListener('click', () => toggleCell(cell, p))
          row.appendChild(cell)
        }
        grid.appendChild(row)
      }
    }

    async function toggleCell(cell, pitchIdx) {
      const key = cell.dataset.key
      if (holes.has(key)) {
        holes.delete(key)
        cell.classList.remove('on')
      } else {
        holes.add(key)
        cell.classList.add('on')
        if (navigator.vibrate) navigator.vibrate(6)
        await ensureAudio()
        playNote(pitchIdx)   // 置いた瞬間に鳴る
      }
    }

    function paintGrid() {
      document.querySelectorAll('.orgel-cell').forEach(c =>
        c.classList.toggle('on', holes.has(c.dataset.key)))
    }

    function clearGrid() {
      if (holes.size && !confirm('カードの穴を全部消しますか？')) return
      holes.clear()
      paintGrid()
    }

    function resetEditor() {
      editingId = null
      holes.clear()
      paintGrid()
      document.getElementById('mel-title').value = ''
      document.getElementById('editing-row').style.display = 'none'
      document.getElementById('send-btn').textContent = '💌 相手にとどける'
    }

    // ─────────────────────────────
    // 保存 / とどける / ギャラリー
    // ─────────────────────────────
    function serializeNotes() {
      return Array.from(holes).map(k => k.split(':').map(Number))
    }

    async function sendMelody() {
      if (holes.size === 0) { showToast('穴がまだ無いよ。まるをタップしてね 🎶'); return }
      const btn = document.getElementById('send-btn')
      btn.disabled = true
      const title = document.getElementById('mel-title').value.trim() || '名もないオルゴール'
      const payload = { title, bpm, steps: STEPS, notes: serializeNotes(), updated_at: new Date().toISOString() }

      if (editingId) {
        const { error } = await _sb.from('melodies').update(payload).eq('id', editingId)
        if (error) { showToast('保存に失敗しました'); console.error(error); btn.disabled = false; return }
        showToast('保存しなおしました ✎')
      } else {
        const { data, error } = await _sb.from('melodies')
          .insert({ ...payload, user_id: myId }).select().single()
        if (error) { showToast('保存に失敗しました'); console.error(error); btn.disabled = false; return }
        if (partnerProfile) {
          notify({
            title: '🎼 オルゴールが届いたよ',
            body: `${myProfile?.emoji ?? ''} ${myProfile?.name ?? ''} が「${title}」を作ったよ`,
            url: '/orgel.html?id=' + data.id,
            kind: 'melody',
            recipient: partnerProfile.id,
          })
        }
        showToast('💌 とどけました！')
        resetEditor()
      }
      btn.disabled = false
      await loadGallery()
    }

    let melodies = []
    let heartsByMel = {}   // melody_id -> Set(user_id)

    async function loadGallery() {
      const { data } = await _sb.from('melodies')
        .select('*').order('created_at', { ascending: false }).limit(100)
      melodies = data || []
      heartsByMel = {}
      if (melodies.length) {
        const { data: hearts } = await _sb.from('melody_reactions')
          .select('melody_id, user_id').in('melody_id', melodies.map(m => m.id))
        ;(hearts || []).forEach(h => {
          (heartsByMel[h.melody_id] ||= new Set()).add(h.user_id)
        })
      }
      renderGallery()
    }

    function renderGallery() {
      const el = document.getElementById('gallery')
      if (!melodies.length) {
        el.innerHTML = '<div class="empty-msg">まだオルゴールがありません。最初の1曲を作ってとどけよう 🎼</div>'
        return
      }
      el.innerHTML = ''
      melodies.forEach(m => {
        const who = profById[m.user_id]
        const mine = m.user_id === myId
        const hearts = heartsByMel[m.id] || new Set()
        const iHearted = hearts.has(myId)
        const d = new Date(m.created_at).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' })
        const card = document.createElement('div')
        card.className = 'mel-card'
        card.id = 'mel-' + m.id
        card.innerHTML = `
          <div class="mel-head">
            <span style="font-size:1.3rem">🎼</span>
            <div style="flex:1;min-width:0">
              <div class="mel-title">${escHtml(m.title || '名もないオルゴール')}</div>
              <div class="mel-meta">${who ? escHtml(who.emoji + ' ' + who.name) : ''} · ${d} · ♪${(m.notes || []).length}</div>
            </div>
          </div>
          <div class="mel-actions">
            <button class="mel-btn" data-mel-play="${m.id}" onclick="playMelody('${m.id}')">▶ きく</button>
            <button class="heart-btn ${iHearted ? 'mine' : ''}" onclick="toggleHeart('${m.id}', ${mine})">💖 ${hearts.size || ''}</button>
            ${mine ? `<button class="mel-btn sub" onclick="openMelody('${m.id}')">✎ ひらく</button>` : ''}
            ${mine ? `<button class="mel-btn danger" onclick="deleteMelody('${m.id}')">けす</button>` : ''}
          </div>`
        el.appendChild(card)
      })
      updatePlayButtons()
    }

    function playMelody(id) {
      if (playing && playSource === id) { stopPlayback(); return }
      const m = melodies.find(x => x.id === id)
      if (!m) return
      const set = new Set((m.notes || []).map(([s, p]) => s + ':' + p))
      if (!set.size) { showToast('この曲にはまだ穴が無いみたい'); return }
      primePlayer()   // ジェスチャ内でアンロック
      startPlayback(set, id, m.bpm || 112)   // 曲の保存BPMで再生 (エディタのテンポは不変)
    }

    async function toggleHeart(id, mine) {
      const hearts = heartsByMel[id] || new Set()
      if (hearts.has(myId)) {
        await _sb.from('melody_reactions').delete().eq('melody_id', id).eq('user_id', myId)
      } else {
        await _sb.from('melody_reactions').upsert(
          { melody_id: id, user_id: myId, emoji: '💖' }, { onConflict: 'melody_id,user_id' })
        const m = melodies.find(x => x.id === id)
        if (m && m.user_id !== myId) {
          notify({
            title: '💖 オルゴールにリアクション',
            body: `${myProfile?.emoji ?? ''} ${myProfile?.name ?? ''} が「${m.title || '名もないオルゴール'}」を気に入ったって`,
            url: '/orgel.html?id=' + id,
            kind: 'melody',
            recipient: m.user_id,
          })
        }
      }
      await loadGallery()
    }

    function openMelody(id) {
      const m = melodies.find(x => x.id === id)
      if (!m) return
      stopPlayback()
      editingId = m.id
      holes.clear()
      ;(m.notes || []).forEach(([s, p]) => holes.add(s + ':' + p))
      paintGrid()
      document.getElementById('mel-title').value = m.title || ''
      bpm = m.bpm || 112
      document.querySelectorAll('.tempo-chip').forEach(c =>
        c.classList.toggle('active', Number(c.dataset.bpm) === bpm))
      document.getElementById('editing-title').textContent = m.title || '名もないオルゴール'
      document.getElementById('editing-row').style.display = 'flex'
      document.getElementById('send-btn').textContent = '保存しなおす'
      window.scrollTo({ top: 0, behavior: 'smooth' })
    }

    async function deleteMelody(id) {
      if (!confirm('このオルゴールを消しますか？')) return
      await _sb.from('melodies').delete().eq('id', id)
      if (editingId === id) resetEditor()
      await loadGallery()
    }

    // ─────────────────────────────
    // init
    // ─────────────────────────────
    async function init() {
      buildGrid()
      const { data: { session } } = await _sb.auth.getSession()
      if (!session) { location.href = '/login.html'; return }
      myId = session.user.id
      const { data: profiles } = await _sb.from('profiles').select('*')
      ;(profiles || []).forEach(p => { profById[p.id] = p })
      myProfile = profById[myId] || null
      partnerProfile = (profiles || []).find(p => p.id !== myId) || null
      await loadGallery()

      // 通知から来た場合 (?id=...) は該当カードへスクロール+ハイライト
      const target = new URLSearchParams(location.search).get('id')
      if (target) {
        const card = document.getElementById('mel-' + target)
        if (card) {
          card.classList.add('highlight')
          card.scrollIntoView({ block: 'center', behavior: 'smooth' })
          setTimeout(() => card.classList.remove('highlight'), 4000)
        }
      }
    }

    let toastTimer = null
    function showToast(msg) {
      const t = document.getElementById('toast')
      t.textContent = msg
      t.classList.add('show')
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => t.classList.remove('show'), 2000)
    }

    init()
  </script>
</body>
</html>
