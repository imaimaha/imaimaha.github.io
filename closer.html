<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
  <title>One Step Closer | Notre Endroit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const _sb = window.supabase.createClient(
      'https://qivnfiqyjfajlzbdqodd.supabase.co',
      'sb_publishable_PR_chyGmNVRJJ24eVqlqYg_CGAOjfpx'
    )
    _sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) window.location.href = '/login.html'
    })
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #0a1628 0%, #0d2044 40%, #112a5e 100%) fixed;
      background-attachment: fixed;
      color: #e8f0fc;
      height: 100vh;
      overflow: hidden;
    }

    .clouds { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }

    /* ---------- top bar ---------- */
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: linear-gradient(180deg, rgba(10,22,40,0.9) 0%, transparent 100%);
      backdrop-filter: blur(4px);
    }
    .top-bar a { color: #98bedd; text-decoration: none; font-size: 0.9rem; }
    .top-bar h1 { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.2rem; color: #e8f4fd; }
    .logout-btn {
      background: #fff; border: 2px solid #e8ddd5; color: #8d6e63;
      padding: 5px 14px; border-radius: 20px; cursor: pointer; font-size: 0.8rem;
    }
    .top-right { display: flex; align-items: center; gap: 8px; }
    .user-badge {
      display: none; align-items: center; gap: 4px;
      background: #fff; border: 2px solid #e8ddd5; border-radius: 20px;
      padding: 4px 12px; font-size: 0.8rem; color: #5d4037;
    }

    /* ---------- floating emojis ---------- */
    .float-emoji {
      position: fixed;
      font-size: 4rem;
      cursor: pointer;
      user-select: none;
      z-index: 10;
      filter: drop-shadow(0 0 14px rgba(200,230,255,0.4));
      transition: filter 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .float-emoji:hover { filter: drop-shadow(0 0 22px rgba(255,220,100,0.7)); }

    @keyframes emojipop {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.6) rotate(15deg); }
      60%  { transform: scale(0.85) rotate(-8deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .float-emoji.pop { animation: emojipop 0.4s cubic-bezier(0.36,0.07,0.19,0.97); }

    /* ---------- center display ---------- */
    .closer-display {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      text-align: center;
      pointer-events: none;
    }

    .closer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .closer-side { font-size: 3.2rem; transition: none; }

    .closer-middle {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 80px;
    }

    #closer-gap {
      font-size: 1.1rem;
      color: rgba(150,200,255,0.55);
      letter-spacing: 0.08em;
      transition: all 0.6s ease;
    }

    .closer-song {
      position: absolute;
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 0.58rem;
      color: rgba(150,200,255,0.2);
      letter-spacing: 0.22em;
      white-space: nowrap;
      pointer-events: none;
    }

    /* ---------- bottom buttons ---------- */
    .btn-row {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      gap: 14px;
      padding: 20px 24px 36px;
      background: linear-gradient(0deg, rgba(10,22,40,0.92) 0%, transparent 100%);
      justify-content: center;
    }

    .view-btn {
      background: rgba(255,255,255,0.09);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(150,200,255,0.3);
      color: #e8f4fd;
      padding: 13px 26px;
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .view-btn:hover { background: rgba(255,255,255,0.18); transform: translateY(-2px); }
    .view-btn:active { transform: scale(0.95); }

    /* ---------- popup ---------- */
    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: linear-gradient(160deg, #0a0f1e 0%, #0b1830 50%, #0e2050 100%);
      overflow: hidden;
    }
    .popup-overlay.open { display: block; }

    .hearts-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .ph {
      position: absolute;
      display: inline-block;
      opacity: 0.07;
      line-height: 1;
    }
    .ph.on { opacity: 1; }

    @keyframes heartglow {
      from { opacity: 0; filter: blur(6px) brightness(0.5); }
      to   { opacity: 1; filter: blur(0)   brightness(1); }
    }
    .ph.burst { animation: heartglow 0.45s ease-out forwards; }

    .popup-center-emoji {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 7rem;
      z-index: 110;
      pointer-events: none;
      filter: drop-shadow(0 0 40px rgba(255,200,200,0.5));
      animation: bigpulse 2.5s ease-in-out infinite;
    }
    @keyframes bigpulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%       { transform: translate(-50%, -50%) scale(1.1); }
    }

    .popup-close {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 120;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: #e8f4fd;
      padding: 13px 36px;
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .popup-close:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body style="visibility:hidden" onload="document.body.style.visibility='visible'">
  <div class="clouds"></div>
  <script src="assets/js/stars.js"></script>

  <div class="top-bar">
    <a href="/">← もどる</a>
    <h1>✨ One Step Closer</h1>
    <div class="top-right">
      <div class="user-badge" id="user-badge">
        <span id="ub-emoji"></span>
        <span id="ub-name"></span>
      </div>
      <button class="logout-btn" onclick="_sb.auth.signOut().then(()=>location.href='/login.html')">ログアウト</button>
    </div>
  </div>

  <!-- floating emojis (position set by JS) -->
  <div id="fox-float" class="float-emoji">🦊</div>
  <div id="hed-float"  class="float-emoji">🦔</div>

  <!-- center display -->
  <div class="closer-display">
    <div class="closer-row">
      <span class="closer-side">🦊</span>
      <div class="closer-middle">
        <span id="closer-gap"></span>
        <span class="closer-song">one step closer</span>
      </div>
      <span class="closer-side">🦔</span>
    </div>
  </div>

  <!-- bottom buttons -->
  <div class="btn-row">
    <button class="view-btn" onclick="openPopup('fox')">🦊の✨を見る</button>
    <button class="view-btn" onclick="openPopup('hed')">🦔の✨を見る</button>
  </div>

  <!-- gauge popup -->
  <div class="popup-overlay" id="popup">
    <div class="hearts-wrap" id="popup-hearts"></div>
    <div class="popup-center-emoji" id="popup-emoji"></div>
    <button class="popup-close" onclick="closePopup()">閉じる</button>
  </div>

  <script>
    const POPUP_HEARTS = 60

    let myId       = null
    let foxUid     = null
    let hedUid     = null
    let gauges     = { fox: 0, hed: 0 }

    // -------- floating animation --------
    const fl = {
      fox: { x: 12, y: 28, vx:  0.034, vy:  0.026 },
      hed: { x: 68, y: 52, vx: -0.029, vy:  0.037 }
    }

    function animateFloat() {
      const foxEl = document.getElementById('fox-float')
      const hedEl = document.getElementById('hed-float')
      const f = fl.fox, h = fl.hed

      f.x += f.vx;  f.y += f.vy
      if (f.x <= 3 || f.x >= 87) f.vx *= -1
      if (f.y <= 12 || f.y >= 82) f.vy *= -1
      foxEl.style.left = f.x + 'vw'
      foxEl.style.top  = f.y + 'vh'

      h.x += h.vx;  h.y += h.vy
      if (h.x <= 3 || h.x >= 87) h.vx *= -1
      if (h.y <= 12 || h.y >= 82) h.vy *= -1
      hedEl.style.left = h.x + 'vw'
      hedEl.style.top  = h.y + 'vh'

      requestAnimationFrame(animateFloat)
    }

    // -------- distance display --------
    const GAP_STEPS = 12

    function updateDistance() {
      const avg  = (gauges.fox + gauges.hed) / 2
      const dots = Math.round(GAP_STEPS * (1 - avg / 100))
      document.getElementById('closer-gap').textContent =
        dots > 0 ? ' ' + '· '.repeat(dots).trimEnd() + ' ' : ' '
    }

    // -------- click handler --------
    async function clickEmoji(type) {
      const uid = type === 'fox' ? foxUid : hedUid
      if (!uid) return

      const cur      = gauges[type] || 0
      const newGauge = Math.min(cur + 5, 100)
      gauges[type]   = newGauge
      updateDistance()

      // pop animation
      const el = document.getElementById(type === 'fox' ? 'fox-float' : 'hed-float')
      el.classList.remove('pop')
      void el.offsetWidth
      el.classList.add('pop')
      setTimeout(() => el.classList.remove('pop'), 400)

      // jump to new position
      setTimeout(() => {
        const f  = fl[type]
        f.x  = 8  + Math.random() * 76
        f.y  = 14 + Math.random() * 64
        f.vx = (0.022 + Math.random() * 0.028) * (Math.random() < .5 ? 1 : -1)
        f.vy = (0.018 + Math.random() * 0.024) * (Math.random() < .5 ? 1 : -1)
      }, 220)

      await _sb.from('closer_gauge')
        .upsert({ user_id: uid, gauge: newGauge, updated_at: new Date().toISOString() })
    }

    // -------- popup --------
    const HEART_TYPES = ['❤️', '💖', '🤍']
    const PER_ROW     = 5
    const TOTAL_ROWS  = Math.ceil(POPUP_HEARTS / PER_ROW)

    function openPopup(type) {
      const gauge  = gauges[type] || 0
      const emoji  = type === 'fox' ? '🦊' : '🦔'
      const filled = Math.round(gauge / 100 * POPUP_HEARTS)

      const wrap = document.getElementById('popup-hearts')
      wrap.innerHTML = ''

      // ハートを下から上に配置。filled個(下側)が光る
      for (let i = 0; i < POPUP_HEARTS; i++) {
        const h   = document.createElement('span')
        h.className   = 'ph'
        h.textContent = HEART_TYPES[Math.floor(Math.random() * HEART_TYPES.length)]

        const row      = Math.floor(i / PER_ROW)
        const size     = 1.3 + Math.random() * 1.9             // 1.3〜3.2rem
        const rotation = -50 + Math.random() * 100             // -50°〜+50°
        const x        = 3  + Math.random() * 88               // 横位置
        const bottomPct = 4 + (row / (TOTAL_ROWS - 1)) * 84   // 下4%〜上88%
        const yJitter  = Math.random() * 8 - 4

        h.style.cssText = [
          `left:${x.toFixed(1)}%`,
          `bottom:${Math.max(2, bottomPct + yJitter).toFixed(1)}%`,
          `font-size:${size.toFixed(2)}rem`,
          `transform:rotate(${rotation.toFixed(1)}deg)`,
        ].join(';')

        wrap.appendChild(h)
      }

      // 下から順番に光らせる
      const spans = wrap.querySelectorAll('.ph')
      for (let i = 0; i < filled; i++) {
        setTimeout(() => spans[i]?.classList.add('on', 'burst'), i * 28)
      }

      document.getElementById('popup-emoji').textContent = emoji
      document.getElementById('popup').classList.add('open')
    }

    function closePopup() {
      document.getElementById('popup').classList.remove('open')
    }

    // -------- init --------
    async function init() {
      const { data: { session } } = await _sb.auth.getSession()
      if (!session) { window.location.href = '/login.html'; return }
      myId = session.user.id

      const [profRes, gaugeRes] = await Promise.all([
        _sb.from('profiles').select('*'),
        _sb.from('closer_gauge').select('*')
      ])

      const profiles = profRes.data || []

      // プロフィールの絵文字でfox/hedを判定
      const foxProf = profiles.find(p => p.emoji === '🦊')
      const hedProf = profiles.find(p => p.emoji === '🦔')
      foxUid = foxProf?.id || profiles[0]?.id  || null
      hedUid = hedProf?.id || profiles[1]?.id  || null

      // 自分が🦊でも🦔でもない場合のフォールバック
      if (!foxUid) foxUid = myId
      if (!hedUid && profiles.find(p => p.id !== myId)) {
        hedUid = profiles.find(p => p.id !== myId).id
      }

      ;(gaugeRes.data || []).forEach(g => {
        if (g.user_id === foxUid) gauges.fox = g.gauge
        if (g.user_id === hedUid) gauges.hed = g.gauge
      })

      // クリックイベントをUIDで紐付け
      document.getElementById('fox-float').onclick = () => clickEmoji('fox')
      document.getElementById('hed-float').onclick  = () => clickEmoji('hed')

      updateDistance()

      const me = profiles.find(p => p.id === myId)
      if (me) {
        document.getElementById('ub-emoji').textContent = me.emoji
        document.getElementById('ub-name').textContent  = me.name
        document.getElementById('user-badge').style.display = 'flex'
      }

      // realtime
      _sb.channel('closer-gauge-rt')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'closer_gauge' }, payload => {
          const uid = payload.new?.user_id
          const g   = payload.new?.gauge
          if (uid === foxUid) gauges.fox = g
          if (uid === hedUid) gauges.hed = g
          updateDistance()
        })
        .subscribe()

      animateFloat()
    }

    init()
  </script>
</body>
</html>
