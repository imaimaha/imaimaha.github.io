  <div id="toast"></div>

  <script>
    let myId = null, partnerId = null
    let myProfile = null, partnerProfile = null
    let currentDate = new Date()
    let map = null
    let markers = []

    // 日付を YYYY-MM-DD 文字列に
    function toDateStr(d) {
      return d.toLocaleDateString('sv-SE') // "2026-07-09"
    }

    function isTodaySelected() {
      return toDateStr(currentDate) === toDateStr(new Date())
    }

    // ふたりの拠点。ここに載っている町は「おうち」「会社」として扱う
    // (町名は Nominatim が返す suburb 名。増えたらここに足す)
    const BASES = {
      '本町一丁目':   { kind: 'home',   emoji: '🏠', owner: 'nick',     label: 'nickのおうち' },
      '西新宿五丁目': { kind: 'home',   emoji: '🏠', owner: 'hedgehog', label: 'hedgehogのおうち' },
      '西新宿二丁目': { kind: 'office', emoji: '🏢', owner: null,       label: '会社' },
    }

    // その人にとってその町がどこか (自分の家なら「おうち」と呼ぶ)
    function placeLabelFor(placeName, profileName) {
      if (!placeName) return { emoji: '📍', text: 'どこかな？' }
      const base = BASES[placeName]
      if (!base) return { emoji: '🗺', text: placeName, out: true }
      if (base.kind === 'office') return { emoji: '🏢', text: '会社' }
      if (base.owner && profileName && base.owner === profileName) return { emoji: '🏠', text: 'おうち' }
      return { emoji: base.emoji, text: base.label }
    }

    function relTime(iso) {
      const diff = Date.now() - new Date(iso).getTime()
      const m = Math.floor(diff / 60000)
      if (m < 1) return 'たった今'
      if (m < 60) return `${m}分前`
      const h = Math.floor(m / 60)
      if (h < 24) return `${h}時間前`
      const d = Math.floor(h / 24)
      return `${d}日前`
    }

    // 2点間の距離 (km)
    function distanceKm(a, b) {
      const R = 6371, toRad = x => x * Math.PI / 180
      const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng)
      const s = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2
      return 2 * R * Math.asin(Math.sqrt(s))
    }

    async function init() {
      const { data: { session } } = await _sb.auth.getSession()
      if (!session) return
      myId = session.user.id

      const { data: profs } = await _sb.from('profiles').select('*')
      if (profs) {
        allProfiles = profs
        myProfile = profs.find(p => p.id === myId)
        partnerProfile = profs.find(p => p.id !== myId)
        partnerId = partnerProfile?.id
      }

      initMap()
      updateDateLabel()
      await loadCheckins()
      await loadOverview()
    }

    // ===== いま どこ？ / 記録 / 街コレクション =====
    let allCheckins = []
    let allProfiles = []

    // その住所で「ふたりとも今ここした日」の数
    // (会社で同じ日に居ただけ、は一緒とは限らないので拠点=おうちだけを数える)
    function bothHereDays(rows, placeName) {
      const byDay = {}
      rows.filter(c => c.place_name === placeName).forEach(c => {
        const d = new Date(c.created_at).toLocaleDateString('sv-SE')
        ;(byDay[d] ||= new Set()).add(c.user_id)
      })
      return Object.values(byDay).filter(s => s.has(myId) && s.has(partnerId)).length
    }

    // 「町の数 / 🦊のおうちで一緒 / 🦔のおうちで一緒」の3つ
    function statBoxesHtml(rows) {
      const places = new Set(rows.map(c => c.place_name).filter(Boolean))
      const homes = Object.entries(BASES)
        .filter(([, b]) => b.kind === 'home')
        .map(([place, b]) => {
          const prof = allProfiles.find(p => p.name === b.owner)
          return `<div class="stat-box">
            <div class="sv">${bothHereDays(rows, place)}</div>
            <div class="sl">${prof?.emoji || '🏠'}のおうちで一緒</div>
          </div>`
        }).join('')
      return `<div class="stat-box"><div class="sv">${places.size}</div><div class="sl">町の数</div></div>${homes}`
    }

    async function loadOverview() {
      const { data, error } = await _sb.from('location_checkins')
        .select('*').order('created_at', { ascending: false }).limit(1000)
      if (error) { console.error('[location] 集計の取得に失敗:', error.message); return }
      allCheckins = data || []
      renderNow()
      renderMonth()
      renderStats()
      renderCollection()
    }

    // ===== 月のふりかえり =====
    let statsMonth = new Date()

    function changeMonth(delta) {
      statsMonth = new Date(statsMonth.getFullYear(), statsMonth.getMonth() + delta, 1)
      renderMonth()
    }

    function inMonth(iso, d) {
      const t = new Date(iso)
      return t.getFullYear() === d.getFullYear() && t.getMonth() === d.getMonth()
    }

    function renderMonth() {
      const y = statsMonth.getFullYear(), m = statsMonth.getMonth()
      document.getElementById('month-label').textContent = `${y}年 ${m + 1}月のふりかえり`
      const now = new Date()
      // 未来の月には進めない
      document.getElementById('month-next').disabled =
        (y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth()))

      const rows = allCheckins.filter(c => inMonth(c.created_at, statsMonth))
      const places = new Set(rows.map(c => c.place_name).filter(Boolean))
      document.getElementById('month-stat-row').innerHTML = statBoxesHtml(rows)

      const counts = {}
      rows.forEach(c => { if (c.place_name) counts[c.place_name] = (counts[c.place_name] || 0) + 1 })
      const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5)
      const max = top[0]?.[1] || 1
      document.getElementById('month-top').innerHTML = top.length
        ? top.map(([name, n], i) => `
          <div class="top-place">
            <span class="tp-rank">${i + 1}</span>
            <span>${escHtml(name)}</span>
            <span class="tp-bar"><span class="tp-fill" style="width:${Math.round(n / max * 100)}%"></span></span>
            <span class="tp-n">${n}回</span>
          </div>`).join('')
        : '<div class="coll-sub">この月のチェックインはまだないよ</div>'

      // この月がはじめてだった町 (それ以前に記録が無い町)
      const before = new Set(allCheckins
        .filter(c => new Date(c.created_at) < new Date(y, m, 1))
        .map(c => c.place_name).filter(Boolean))
      const newOnes = [...places].filter(p => !before.has(p))
      document.getElementById('month-new').innerHTML = newOnes.length
        ? `<div class="month-new-title">🆕 この月にはじめて行った町</div>
           <div class="coll-grid">${newOnes.map(p => `<span class="coll-chip new">🆕 ${escHtml(p)}</span>`).join('')}</div>`
        : ''

      document.getElementById('month-card').style.display = 'block'
    }

    // その月の足あとを地図にまとめて出す
    function showMonthOnMap() {
      if (!map) return
      const rows = allCheckins.filter(c => inMonth(c.created_at, statsMonth))
      if (!rows.length) { showToast('この月の記録はまだないよ'); return }
      markers.forEach(mk => map.removeLayer(mk))
      markers = []
      const pts = []
      rows.forEach(c => {
        const prof = c.user_id === myId ? myProfile : partnerProfile
        const mk = L.marker([c.lat, c.lng], {
          icon: L.divIcon({
            className: '', iconSize: [26, 26], iconAnchor: [13, 13],
            html: `<div style="font-size:18px;line-height:26px;text-align:center;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))">${prof?.emoji || '📍'}</div>`,
          }),
        }).addTo(map)
        const when = new Date(c.created_at).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        mk.bindPopup(`${prof?.emoji || ''} ${escHtml(c.place_name || '')}<br><small>${when}</small>`)
        markers.push(mk)
        pts.push([c.lat, c.lng])
      })
      map.fitBounds(pts, { padding: [30, 30], maxZoom: 15 })
      document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' })
      showToast(`🗺 ${statsMonth.getMonth() + 1}月の足あと ${rows.length}件`)
    }

    function renderNow() {
      const people = [myProfile, partnerProfile].filter(Boolean)
      if (!people.length) return
      const latest = {}
      allCheckins.forEach(c => { if (!latest[c.user_id]) latest[c.user_id] = c })

      document.getElementById('now-rows').innerHTML = people.map(p => {
        const c = latest[p.id]
        if (!c) return `
          <div class="now-person"><span class="np-emoji">${p.emoji}</span>
            <div class="np-body"><div class="np-where">まだチェックインしてないよ</div></div>
          </div>`
        const w = placeLabelFor(c.place_name, p.name)
        return `
          <div class="now-person">
            <span class="np-emoji">${p.emoji}</span>
            <div class="np-body">
              <div class="np-where">${w.emoji} ${escHtml(w.text)}</div>
              <div class="np-when">${relTime(c.created_at)}${c.note ? ' ・「' + escHtml(c.note) + '」' : ''}</div>
            </div>
            ${w.out ? '<span class="np-tag">おでかけ中</span>' : ''}
          </div>`
      }).join('')

      // ふたりの距離
      const el = document.getElementById('now-distance')
      const a = myProfile && latest[myProfile.id], b = partnerProfile && latest[partnerProfile.id]
      if (a && b) {
        const km = distanceKm(a, b)
        const same = a.place_name && a.place_name === b.place_name
        el.className = 'now-distance' + (same || km < 0.3 ? ' together' : '')
        el.innerHTML = same || km < 0.3
          ? `💞 いま おなじところにいるみたい`
          : `ふたりの距離 <b>${km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km'}</b>`
      } else { el.textContent = '' }
      document.getElementById('now-card').style.display = 'block'
    }

    function renderStats() {
      document.getElementById('stat-row').innerHTML = statBoxesHtml(allCheckins)

      const counts = {}
      allCheckins.forEach(c => { if (c.place_name) counts[c.place_name] = (counts[c.place_name] || 0) + 1 })
      const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 3)
      const max = top[0]?.[1] || 1
      const medals = ['🥇', '🥈', '🥉']
      document.getElementById('top-places').innerHTML = top.map(([name, n], i) => `
        <div class="top-place">
          <span class="tp-rank">${medals[i]}</span>
          <span>${escHtml(name)}</span>
          <span class="tp-bar"><span class="tp-fill" style="width:${Math.round(n / max * 100)}%"></span></span>
          <span class="tp-n">${n}回</span>
        </div>`).join('')
      document.getElementById('stats-card').style.display = 'block'
    }

    function renderCollection() {
      // 町ごとに 回数 / 最後にいつ / 代表座標
      const byPlace = {}
      allCheckins.forEach(c => {
        if (!c.place_name) return
        const e = (byPlace[c.place_name] ||= { n: 0, lat: c.lat, lng: c.lng, last: c.created_at })
        e.n++
        if (new Date(c.created_at) > new Date(e.last)) { e.last = c.created_at; e.lat = c.lat; e.lng = c.lng }
      })
      const entries = Object.entries(byPlace).sort((a, b) => b[1].n - a[1].n)
      const weekAgo = Date.now() - 7 * 86400000

      document.getElementById('coll-count').textContent = `${entries.length} か所`
      document.getElementById('coll-grid').innerHTML = entries.map(([name, e]) => {
        const base = BASES[name]
        const isNew = e.n === 1 && new Date(e.last).getTime() >= weekAgo
        const cls = base?.kind === 'home' ? 'home' : base?.kind === 'office' ? 'office' : (isNew ? 'new' : '')
        const emoji = base?.emoji || (isNew ? '🆕' : '📍')
        return `<button class="coll-chip ${cls}" onclick="focusPlace(${e.lat},${e.lng},'${escAttr(name)}')">
          ${emoji} ${escHtml(name)} <span class="cc-n">×${e.n}</span></button>`
      }).join('')
      document.getElementById('collection-card').style.display = 'block'
    }

    function escAttr(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/'/g, '&#39;').replace(/"/g, '&quot;') }

    function focusPlace(lat, lng, name) {
      if (!map) return
      map.setView([lat, lng], 15)
      document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' })
      showToast(`🗺 ${name}`)
    }

    function initMap() {
      map = L.map('map', { zoomControl: true, attributionControl: false })
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
      }).addTo(map)
      // デフォルト: 東京
      map.setView([35.6762, 139.6503], 12)
    }

    function updateDateLabel() {
      const today = new Date()
      const isToday = toDateStr(currentDate) === toDateStr(today)
      const d = currentDate
      const label = isToday
        ? `今日 (${d.getMonth()+1}/${d.getDate()})`
        : `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`
      document.getElementById('date-label').textContent = label
      document.getElementById('next-btn').disabled = isToday
    }

    function changeDay(delta) {
      const d = new Date(currentDate)
      d.setDate(d.getDate() + delta)
      currentDate = d
      updateDateLabel()
      loadCheckins()
    }

    async function loadCheckins() {
      const dateStr = toDateStr(currentDate)
      const from = dateStr + 'T00:00:00+09:00'
      const to   = dateStr + 'T23:59:59+09:00'

      const { data } = await _sb.from('location_checkins')
        .select('*')
        .gte('created_at', from)
        .lte('created_at', to)
        .order('created_at', { ascending: true })

      // マーカーをクリア
      markers.forEach(m => map.removeLayer(m))
      markers = []

      const list = document.getElementById('checkin-list')
      if (!data || data.length === 0) {
        list.innerHTML = '<div class="empty-state">この日のチェックインはまだありません</div>'
        return
      }

      const bounds = []
      list.innerHTML = ''

      data.forEach(c => {
        const profile = c.user_id === myId ? myProfile : partnerProfile
        const emoji = profile?.emoji ?? '📍'
        const name = profile?.name ?? '?'
        const time = new Date(c.created_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
        const isMine = c.user_id === myId

        // マーカー
        const icon = L.divIcon({
          html: `<div style="font-size:24px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))">${emoji}</div>`,
          className: '',
          iconSize: [30, 30],
          iconAnchor: [15, 28],
        })
        const marker = L.marker([c.lat, c.lng], { icon })
          .addTo(map)
          .bindPopup(`<b>${emoji} ${escHtml(name)}</b><br>${time}${c.note ? '<br>' + escHtml(c.note) : ''}${c.place_name ? '<br><small>' + escHtml(c.place_name) + '</small>' : ''}`)
        markers.push(marker)
        bounds.push([c.lat, c.lng])

        // カード
        const card = document.createElement('div')
        card.className = 'checkin-card'
        card.dataset.id = c.id
        card.innerHTML = `
          <div class="checkin-user-emoji">${emoji}</div>
          <div class="checkin-info">
            <div class="checkin-name">${escHtml(name)}</div>
            ${c.place_name ? `<div class="checkin-place">📍 ${escHtml(c.place_name)}</div>` : ''}
            <div class="checkin-note" id="note-display-${c.id}">${c.note ? `"${escHtml(c.note)}"` : '<span style="color:#3a5a7a;font-style:normal;font-size:0.78rem">メモなし</span>'}</div>
            <div class="checkin-time">${time}</div>
          </div>
          ${isMine ? `<div class="checkin-actions">
            <button class="checkin-edit" data-id="${c.id}" data-note="${escHtml(c.note || '')}" onclick="startEditNote(Number(this.dataset.id), this.dataset.note)">✏️ メモ</button>
            <button class="checkin-delete" data-id="${c.id}" onclick="deleteCheckin(Number(this.dataset.id))">削除</button>
          </div>` : ''}
        `
        list.appendChild(card)
      })

      // 地図をフィット
      if (bounds.length === 1) {
        map.setView(bounds[0], 15)
      } else if (bounds.length > 1) {
        map.fitBounds(bounds, { padding: [40, 40] })
      }
    }

    async function doCheckin() {
      const btn = document.getElementById('checkin-btn')
      const status = document.getElementById('checkin-status')
      btn.disabled = true
      status.textContent = '📡 現在地を取得中...'

      if (!navigator.geolocation) {
        status.textContent = '❌ このブラウザは位置情報に対応していません'
        btn.disabled = false
        return
      }

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude
          const lng = pos.coords.longitude
          const note = document.getElementById('note-input').value.trim() || null

          // Nominatim で地名取得（失敗しても続行）
          let place_name = null
          try {
            const res = await fetch(
              `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ja`,
              { headers: { 'Accept-Language': 'ja' } }
            )
            const geo = await res.json()
            const addr = geo.address
            place_name = addr?.suburb || addr?.neighbourhood || addr?.quarter
              || addr?.city_district || addr?.city || addr?.town || addr?.village
              || null
          } catch (_) {}

          const { error } = await _sb.from('location_checkins').insert({
            user_id: myId, lat, lng, place_name, note,
          })

          if (error) {
            status.textContent = '❌ 保存失敗: ' + error.message
            btn.disabled = false
            return
          }

          // はじめて来た町ならお祝い (町コレクションが増える)
          const firstVisit = await awardFirstVisit(myId, place_name)

          // 相手にプッシュ通知
          if (partnerId && myProfile) {
            const body = `${myProfile.emoji} ${myProfile.name} が今ここにいるよ${place_name ? '（' + place_name + '）' : ''}${note ? '「' + note + '」' : ''}`
            notify({
              title: firstVisit ? '🆕 はじめての町にいるよ' : '📍 今ここにいるよ',
              body, url: '/location.html', kind: 'location', recipient: partnerId,
            })
          }

          document.getElementById('note-input').value = ''
          status.textContent = '✅ 送りました！' + (place_name ? '（' + place_name + '）' : '')
          if (firstVisit) showToast(`🆕 はじめての町！ ${place_name}`)
          setTimeout(() => { status.textContent = ''; btn.disabled = false }, 3000)

          // 今日表示中なら再読込
          if (isTodaySelected()) {
            currentDate = new Date()
            updateDateLabel()
            await loadCheckins()
          }
          await loadOverview()
        },
        (err) => {
          const msgs = { 1: '位置情報の許可が必要です', 2: '位置情報を取得できません', 3: 'タイムアウトしました' }
          status.textContent = '❌ ' + (msgs[err.code] || err.message)
          btn.disabled = false
        },
        { enableHighAccuracy: true, timeout: 10000 }
      )
    }

    function startEditNote(id, currentNote) {
      const noteEl = document.getElementById('note-display-' + id)
      if (!noteEl) return
      // .checkin-note の italic/small が入力欄に効かないよう wrapper で明示リセット
      noteEl.innerHTML = ''
      const wrap = document.createElement('div')
      wrap.style.cssText = 'display:flex;gap:6px;margin-top:4px;font-style:normal;font-size:1rem;color:#e8f4fd'
      const input = document.createElement('input')
      input.type = 'text'
      input.id = 'edit-note-' + id
      input.maxLength = 40
      input.value = currentNote || ''
      input.style.cssText = 'flex:1;min-width:0;padding:8px 10px;background:rgba(255,255,255,0.1);border:1.5px solid rgba(100,200,255,0.4);border-radius:8px;color:#e8f4fd;font-size:16px;font-family:inherit;font-style:normal'
      const btnSave = document.createElement('button')
      btnSave.type = 'button'
      btnSave.textContent = '保存'
      btnSave.style.cssText = 'padding:6px 12px;background:rgba(100,200,180,0.2);border:1.5px solid rgba(100,220,180,0.5);color:#b0f0d5;border-radius:8px;font-size:0.85rem;cursor:pointer;font-family:inherit;white-space:nowrap'
      btnSave.onclick = () => saveNote(id, input)
      const btnCancel = document.createElement('button')
      btnCancel.type = 'button'
      btnCancel.textContent = '×'
      btnCancel.style.cssText = 'padding:6px 10px;background:rgba(255,255,255,0.05);border:1.5px solid rgba(150,180,220,0.3);color:#98bedd;border-radius:8px;font-size:0.85rem;cursor:pointer;font-family:inherit'
      btnCancel.onclick = () => loadCheckins()
      input.addEventListener('keydown', e => { if (e.key === 'Enter') saveNote(id, input) })
      wrap.appendChild(input)
      wrap.appendChild(btnSave)
      wrap.appendChild(btnCancel)
      noteEl.appendChild(wrap)
      input.focus(); input.select()
    }

    async function saveNote(id, inputEl) {
      const input = inputEl || document.getElementById('edit-note-' + id)
      if (!input) return
      const newNote = input.value.trim() || null
      const { error } = await _sb.from('location_checkins').update({ note: newNote }).eq('id', id)
      if (error) { showToast('更新失敗: ' + (error.message || error.code || '')); return }
      showToast('メモを更新しました')
      await loadCheckins()
    }

    async function deleteCheckin(id) {
      const { error } = await _sb.from('location_checkins').delete().eq('id', id)
      if (error) { showToast('削除失敗'); return }
      showToast('削除しました')
      await loadCheckins()
    }

    function showToast(msg) {
      const el = document.getElementById('toast')
      el.textContent = msg
      el.classList.add('show')
      setTimeout(() => el.classList.remove('show'), 2500)
    }

    init()
  </script>
</body>
</html>
