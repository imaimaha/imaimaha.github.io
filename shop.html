<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポイント販売所 | Notre Endroit</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const _sb = window.supabase.createClient(
      'https://qivnfiqyjfajlzbdqodd.supabase.co',
      'sb_publishable_PR_chyGmNVRJJ24eVqlqYg_CGAOjfpx'
    )
    _sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) window.location.href = '/login.html'
    })
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #0a1628 0%, #0d2044 40%, #112a5e 100%) fixed;
      color: #e8f0fc;
      min-height: 100vh;
    }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: linear-gradient(180deg, rgba(26,48,96,0.85), transparent);
    }
    .top-bar a { color: #98bedd; text-decoration: none; font-size: 0.9rem; }
    .top-bar h1 { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.3rem; color: #e8f4fd; }

    .point-bar {
      display:flex; align-items:center; justify-content:center; gap:8px;
      padding:10px 24px; background:rgba(255,215,0,0.08);
      border-bottom:1px solid rgba(255,215,0,0.15);
      font-size:1rem; color:#ffe066;
    }
    .point-value { font-family:'Zen Kurenaido',sans-serif; font-size:1.25rem; font-weight:bold; color:#ffd700; }

    .content { max-width: 560px; margin: 0 auto; padding: 20px 16px 80px; }

    .tabs {
      display:flex; gap:0;
      background:rgba(255,255,255,0.06);
      border-radius:12px; padding:4px; margin-bottom:20px;
    }
    .tab-btn {
      flex:1; padding:10px 8px;
      background:none; border:none; color:#98bedd;
      font-size:0.88rem; font-family:inherit;
      border-radius:9px; cursor:pointer; transition:all 0.2s;
    }
    .tab-btn.active { background:rgba(100,160,255,0.25); color:#e8f4fd; font-weight:bold; }

    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    .item-card {
      display: flex; align-items:center; gap:14px;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(100,180,255,0.22);
      border-radius: 14px; padding: 14px 16px;
      margin-bottom: 10px;
    }
    .item-card.inactive { opacity: 0.5; }
    .item-card.SR { border-color: rgba(255,215,0,0.6); background: rgba(255,215,0,0.05); }
    .item-card.R  { border-color: rgba(180,120,255,0.55); background: rgba(180,120,255,0.05); }

    .item-emoji { font-size: 2rem; flex-shrink: 0; }
    .item-info { flex: 1; min-width: 0; }
    .item-name {
      font-family: 'Zen Kurenaido', sans-serif; font-size: 1.05rem;
      color: #e8f4fd; margin-bottom: 3px;
    }
    .item-desc { font-size: 0.8rem; color: #98bedd; margin-bottom: 4px; line-height: 1.4; }
    .item-meta { font-size: 0.72rem; color: #5a8fb8; }
    .item-price { font-family: 'Zen Kurenaido', sans-serif; color: #ffd764; font-weight: bold; }

    .buy-btn, .toggle-btn, .delete-btn, .cancel-btn, .approve-btn, .deny-btn {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 18px;
      font-family: inherit; font-size: 0.82rem;
      cursor: pointer; border: 1.5px solid;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .buy-btn { background: rgba(80,180,120,0.2); border-color: rgba(80,220,120,0.5); color: #baffcc; }
    .buy-btn:hover:not(:disabled) { background: rgba(80,220,120,0.35); }
    .buy-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .toggle-btn { background: rgba(100,160,255,0.15); border-color: rgba(100,160,255,0.35); color: #98bedd; }
    .delete-btn { background: rgba(255,100,100,0.12); border-color: rgba(255,100,100,0.35); color: #ff9d9d; margin-left: 4px; }
    .cancel-btn { background: rgba(255,180,50,0.12); border-color: rgba(255,200,80,0.4); color: #ffd080; font-size: 0.75rem; padding: 6px 10px; }
    .approve-btn { background: rgba(80,220,120,0.2); border-color: rgba(80,220,120,0.5); color: #baffcc; font-size: 0.78rem; padding: 6px 10px; }
    .deny-btn { background: rgba(255,100,100,0.12); border-color: rgba(255,100,100,0.4); color: #ff9d9d; font-size: 0.78rem; padding: 6px 10px; }

    .cancel-alert {
      margin-top: 8px; padding: 8px 10px;
      background: rgba(255,180,50,0.1); border: 1px solid rgba(255,200,80,0.35);
      border-radius: 10px; font-size: 0.78rem; color: #ffd080;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .cancel-pending { font-size: 0.72rem; color: #a08030; margin-top: 6px; }

    .empty { text-align: center; color: #5a7fa8; padding: 30px 0; font-size: 0.9rem; }

    /* Add form */
    .add-form {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(100,200,180,0.35);
      border-radius: 14px; padding: 14px; margin-bottom: 14px;
    }
    .add-form input, .add-form textarea {
      width: 100%; padding: 8px 12px;
      background: rgba(0,0,0,0.25);
      border: 1.5px solid rgba(150,200,255,0.28);
      border-radius: 10px; color: #e8f4fd;
      font-size: 0.95rem; font-family: inherit;
      margin-bottom: 10px;
    }
    .add-form input:focus, .add-form textarea:focus { outline: none; border-color: rgba(100,200,255,0.6); }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .row label { font-size: 0.8rem; color: #98bedd; }
    .row input { width: 90px; margin-bottom: 0; }
    .add-form-btns { display: flex; gap: 8px; }
    .btn-cancel, .btn-confirm {
      flex: 1; padding: 10px; border-radius: 10px;
      font-family: inherit; font-size: 0.9rem; cursor: pointer;
    }
    .btn-cancel { background: rgba(255,255,255,0.08); border: 1.5px solid rgba(150,200,255,0.25); color: #98bedd; }
    .btn-confirm { background: rgba(100,200,180,0.25); border: 1.5px solid rgba(100,220,180,0.5); color: #b0f0d5; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: rgba(20,40,80,0.95); border: 1px solid rgba(100,160,255,0.4);
      color: #e8f4fd; padding: 10px 22px; border-radius: 30px;
      font-size: 0.9rem; opacity: 0; z-index: 200;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: rgba(80,20,20,0.95); border-color: rgba(255,120,120,0.5); }
  </style>
</head>
<body style="visibility:hidden" onload="document.body.style.visibility='visible'">
  <script src="assets/js/push.js"></script>
  <script src="assets/js/header.js"></script>

  <div class="top-bar">
    <a href="/">← ホーム</a>
    <h1>🛒 販売所</h1>
  </div>

  <div class="point-bar">
    残高: ✨&nbsp;<span class="point-value" id="point-display">…</span>
  </div>

  <div class="content">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('buy')" id="tab-btn-buy">🛍 買う</button>
      <button class="tab-btn" onclick="switchTab('sell')" id="tab-btn-sell">💼 売る</button>
      <button class="tab-btn" onclick="switchTab('purchases')" id="tab-btn-purchases">📦 履歴</button>
      <button class="tab-btn" onclick="switchTab('requests')" id="tab-btn-requests">📝 リクエスト</button>
    </div>

    <!-- 相手が売っている商品を買う -->
    <div class="tab-panel active" id="panel-buy">
      <div style="font-size:0.85rem;color:#98bedd;margin-bottom:10px" id="buy-header">相手が販売中の商品</div>
      <div id="buy-list"><div class="empty">読み込み中…</div></div>
    </div>

    <!-- 自分が相手に売る商品を管理 -->
    <div class="tab-panel" id="panel-sell">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:0.85rem;color:#98bedd">自分が相手に販売中の商品</div>
        <button onclick="toggleForm()" style="background:rgba(100,200,180,0.2);border:1.5px solid rgba(100,220,180,0.5);color:#b0f0d5;padding:6px 12px;border-radius:14px;font-family:inherit;font-size:0.8rem;cursor:pointer">➕ 追加</button>
      </div>

      <div class="add-form" id="add-form" style="display:none">
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <input id="new-emoji" placeholder="絵文字" maxlength="4" style="width:70px;text-align:center;font-size:1.1rem">
          <input id="new-name" placeholder="商品名 (例: マッサージ券)" style="flex:1">
        </div>
        <textarea id="new-desc" placeholder="説明 (任意)" rows="2"></textarea>
        <div class="row">
          <label>💰 価格:</label>
          <input id="new-price" type="number" value="100" min="1" step="10">
          <label style="margin-left:10px">📦 在庫:</label>
          <input id="new-stock" type="number" placeholder="無制限" min="1">
        </div>
        <div class="row">
          <label>レア度:</label>
          <label style="font-size:0.85rem;color:#7ec8f0"><input type="radio" name="new-rarity" value="N" checked> N</label>
          <label style="font-size:0.85rem;color:#d09aff"><input type="radio" name="new-rarity" value="R"> R</label>
          <label style="font-size:0.85rem;color:#ffd700"><input type="radio" name="new-rarity" value="SR"> SR</label>
        </div>
        <input id="new-bonus" type="hidden" value="">
        <div class="add-form-btns">
          <button class="btn-cancel" onclick="toggleForm()">キャンセル</button>
          <button class="btn-confirm" onclick="addItem()">出品する</button>
        </div>
      </div>

      <div id="sell-list"><div class="empty">読み込み中…</div></div>
    </div>

    <!-- 履歴: 購入・販売 -->
    <div class="tab-panel" id="panel-purchases">
      <div style="font-size:0.85rem;color:#98bedd;margin-bottom:10px">🛍 買ったもの</div>
      <div id="my-purchases-list"><div class="empty">読み込み中…</div></div>
      <div style="height:20px"></div>
      <div style="font-size:0.85rem;color:#98bedd;margin-bottom:10px">💰 売れたもの</div>
      <div id="my-sales-list"><div class="empty">読み込み中…</div></div>
    </div>

    <!-- リクエスト -->
    <div class="tab-panel" id="panel-requests">
      <!-- 自分のリクエスト投稿フォーム -->
      <div style="margin-bottom:16px">
        <button onclick="toggleRequestForm()" style="background:rgba(100,200,180,0.2);border:1.5px solid rgba(100,220,180,0.5);color:#b0f0d5;padding:8px 16px;border-radius:14px;font-family:inherit;font-size:0.85rem;cursor:pointer;width:100%">➕ リクエストを送る</button>
      </div>
      <div id="request-form" style="display:none;background:rgba(255,255,255,0.05);border:1.5px solid rgba(100,180,255,0.2);border-radius:14px;padding:16px;margin-bottom:16px">
        <input id="req-title" placeholder="何をお願いしたい？ (例: マッサージ券)" maxlength="50"
          style="width:100%;padding:10px 14px;background:rgba(255,255,255,0.07);border:1.5px solid rgba(100,180,255,0.22);border-radius:10px;color:#e8f4fd;font-size:15px;font-family:inherit;margin-bottom:10px">
        <textarea id="req-desc" placeholder="詳細・メモ（任意）" rows="2" maxlength="200"
          style="width:100%;padding:10px 14px;background:rgba(255,255,255,0.07);border:1.5px solid rgba(100,180,255,0.22);border-radius:10px;color:#e8f4fd;font-size:14px;font-family:inherit;resize:none;margin-bottom:10px"></textarea>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
          <label style="font-size:0.85rem;color:#98bedd">💰 希望価格:</label>
          <input id="req-price" type="number" value="100" min="1" step="10"
            style="width:90px;padding:8px 12px;background:rgba(255,255,255,0.07);border:1.5px solid rgba(100,180,255,0.22);border-radius:10px;color:#e8f4fd;font-size:14px;font-family:inherit">
          <label style="font-size:0.85rem;color:#98bedd">pt</label>
        </div>
        <div style="display:flex;gap:8px">
          <button onclick="toggleRequestForm()" style="flex:1;padding:10px;background:rgba(255,255,255,0.07);border:1.5px solid rgba(100,180,255,0.2);border-radius:10px;color:#98bedd;font-family:inherit;cursor:pointer">キャンセル</button>
          <button onclick="submitRequest()" style="flex:1;padding:10px;background:linear-gradient(135deg,rgba(100,180,100,0.3),rgba(60,140,60,0.4));border:1.5px solid rgba(100,200,100,0.5);border-radius:10px;color:#b0f0d5;font-family:inherit;cursor:pointer;font-weight:bold">送る</button>
        </div>
      </div>

      <!-- 相手のリクエスト（自分が対応する）-->
      <div style="font-size:0.85rem;color:#98bedd;margin-bottom:10px">📩 相手からのリクエスト</div>
      <div id="partner-requests-list"><div class="empty">読み込み中…</div></div>
      <div style="height:16px"></div>
      <!-- 自分のリクエスト -->
      <div style="font-size:0.85rem;color:#98bedd;margin-bottom:10px">📤 自分のリクエスト</div>
      <div id="my-requests-list"><div class="empty">読み込み中…</div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentUser = null
    let profiles = {}
    let partnerId = null
    const _purchases = new Map()

    async function init() {
      const { data: { session } } = await _sb.auth.getSession()
      if (!session) return
      currentUser = session.user
      const { data: profs } = await _sb.from('profiles').select('*')
      ;(profs || []).forEach(p => { profiles[p.id] = p })
      const partner = (profs || []).find(p => p.id !== currentUser.id)
      partnerId = partner?.id || null

      await loadPoints()
      await loadBuyList()
      await loadSellList()
      await loadPurchases()
    }

    function switchTab(name) {
      ;['buy','sell','purchases','requests'].forEach(n => {
        document.getElementById('tab-btn-' + n).classList.toggle('active', n === name)
        document.getElementById('panel-' + n).classList.toggle('active', n === name)
      })
      if (name === 'requests') loadRequests()
    }

    async function loadPoints() {
      const { data } = await _sb.from('points').select('amount').eq('user_id', currentUser.id)
      const total = (data || []).reduce((s, r) => s + r.amount, 0)
      document.getElementById('point-display').textContent = total + 'pt'
      window._currentBalance = total
    }

    async function loadBuyList() {
      const { data, error } = await _sb.from('shop_items')
        .select('*').eq('buyer_id', currentUser.id).eq('active', true)
        .order('created_at', { ascending: false })
      const list = document.getElementById('buy-list')
      if (error || !data || data.length === 0) {
        list.innerHTML = '<div class="empty">相手からの出品はまだありません</div>'
        return
      }
      list.innerHTML = ''
      data.forEach(it => {
        const seller = profiles[it.seller_id]
        const soldOut = it.stock !== null && it.stock <= 0
        const canBuy = !soldOut && (window._currentBalance ?? 0) >= it.price
        const card = document.createElement('div')
        card.className = 'item-card' + (it.rarity ? ' ' + it.rarity : '')
        card.innerHTML = `
          <div class="item-emoji">${escHtml(it.emoji)}</div>
          <div class="item-info">
            <div class="item-name">${escHtml(it.name)}${it.rarity ? ` <span style="font-size:0.7rem;color:${it.rarity==='SR'?'#ffd700':it.rarity==='R'?'#d09aff':'#7ec8f0'}">[${it.rarity}]</span>` : ''}</div>
            ${it.description ? `<div class="item-desc">${escHtml(it.description)}</div>` : ''}
            <div class="item-meta">
              <span class="item-price">${it.price}pt</span>
              ${it.bonus_points ? ` · 使うと +${it.bonus_points}pt` : ''}
              ${it.stock !== null ? ` · 残り${it.stock}` : ''}
              · 出品: ${seller?.emoji ?? '?'} ${escHtml(seller?.name ?? '?')}
            </div>
          </div>
          <button class="buy-btn" ${canBuy ? '' : 'disabled'} onclick="buy('${it.id}')">${soldOut ? '売切' : '購入'}</button>
        `
        list.appendChild(card)
      })
    }

    async function loadSellList() {
      const { data } = await _sb.from('shop_items')
        .select('*').eq('seller_id', currentUser.id)
        .order('created_at', { ascending: false })
      const list = document.getElementById('sell-list')
      if (!data || data.length === 0) {
        list.innerHTML = '<div class="empty">まだ出品していません</div>'
        return
      }
      list.innerHTML = ''
      data.forEach(it => {
        const buyer = profiles[it.buyer_id]
        const card = document.createElement('div')
        card.className = 'item-card' + (it.active ? '' : ' inactive') + (it.rarity ? ' ' + it.rarity : '')
        card.innerHTML = `
          <div class="item-emoji">${escHtml(it.emoji)}</div>
          <div class="item-info">
            <div class="item-name">${escHtml(it.name)}${it.rarity ? ` <span style="font-size:0.7rem;color:${it.rarity==='SR'?'#ffd700':it.rarity==='R'?'#d09aff':'#7ec8f0'}">[${it.rarity}]</span>` : ''}</div>
            ${it.description ? `<div class="item-desc">${escHtml(it.description)}</div>` : ''}
            <div class="item-meta">
              <span class="item-price">${it.price}pt</span>
              ${it.bonus_points ? ` · 使うと +${it.bonus_points}pt` : ''}
              ${it.stock !== null ? ` · 残り${it.stock}` : ''}
              · 対象: ${buyer?.emoji ?? '?'} ${escHtml(buyer?.name ?? '?')}
              ${it.active ? '' : ' · 停止中'}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <button class="toggle-btn" onclick="editItem('${it.id}')">✏️</button>
            <button class="toggle-btn" onclick="toggleActive('${it.id}', ${!it.active})">${it.active ? '停止' : '再開'}</button>
            <button class="delete-btn" onclick="deleteItem('${it.id}')">🗑</button>
          </div>
        `
        list.appendChild(card)
      })
    }

    let editingItemId = null

    function editItem(id) {
      // load latest data (from cache: 再取得)
      _sb.from('shop_items').select('*').eq('id', id).single().then(({ data, error }) => {
        if (error || !data) { showToast('取得失敗', true); return }
        editingItemId = id
        document.getElementById('new-name').value = data.name
        document.getElementById('new-emoji').value = data.emoji
        document.getElementById('new-desc').value = data.description || ''
        document.getElementById('new-price').value = data.price
        document.getElementById('new-stock').value = data.stock ?? ''
        if (data.rarity) {
          const r = document.querySelector(`input[name="new-rarity"][value="${data.rarity}"]`)
          if (r) r.checked = true
        }
        document.getElementById('new-bonus').value = data.bonus_points ?? ''

        // フォーム表示 + ボタンラベル変更
        document.getElementById('add-form').style.display = 'block'
        const btns = document.querySelectorAll('#add-form .btn-confirm')
        btns.forEach(b => { b.textContent = '保存する'; b.onclick = saveItem })
        document.getElementById('add-form').scrollIntoView({ behavior: 'smooth', block: 'center' })
      })
    }

    async function saveItem() {
      if (!editingItemId) return
      const name = document.getElementById('new-name').value.trim()
      const emoji = document.getElementById('new-emoji').value.trim() || '🎁'
      const desc = document.getElementById('new-desc').value.trim() || null
      const price = Math.max(1, parseInt(document.getElementById('new-price').value, 10) || 100)
      const stockRaw = document.getElementById('new-stock').value
      const stock = stockRaw ? Math.max(1, parseInt(stockRaw, 10)) : null
      const rarity = document.querySelector('input[name="new-rarity"]:checked').value
      const bonusRaw = document.getElementById('new-bonus').value
      const bonus_points = bonusRaw ? Math.max(0, parseInt(bonusRaw, 10)) : null

      if (!name) { showToast('商品名を入力してください', true); return }

      const { error } = await _sb.from('shop_items').update({
        name, emoji, description: desc, price, stock, rarity, bonus_points,
        updated_at: new Date().toISOString(),
      }).eq('id', editingItemId)
      if (error) { showToast('保存失敗: ' + error.message, true); return }

      editingItemId = null
      resetForm()
      toggleForm()
      showToast('✅ 保存しました')
      await loadSellList()
      await loadBuyList()
    }

    function resetForm() {
      document.getElementById('new-name').value = ''
      document.getElementById('new-emoji').value = ''
      document.getElementById('new-desc').value = ''
      document.getElementById('new-price').value = '100'
      document.getElementById('new-stock').value = ''
      document.getElementById('new-bonus').value = ''
      const btns = document.querySelectorAll('#add-form .btn-confirm')
      btns.forEach(b => { b.textContent = '出品する'; b.onclick = addItem })
    }

    async function loadPurchases() {
      const { data: mine } = await _sb.from('shop_purchases')
        .select('*').eq('buyer_id', currentUser.id)
        .order('purchased_at', { ascending: false }).limit(50)
      renderPurchases('my-purchases-list', mine || [], true)

      const { data: sold } = await _sb.from('shop_purchases')
        .select('*').eq('seller_id', currentUser.id)
        .order('purchased_at', { ascending: false }).limit(50)
      renderPurchases('my-sales-list', sold || [], false)

      ;(mine || []).concat(sold || []).forEach(p => _purchases.set(p.id, p))
    }

    function renderPurchases(elId, list, canUse) {
      const el = document.getElementById(elId)
      if (list.length === 0) {
        el.innerHTML = '<div class="empty">まだありません</div>'
        return
      }
      el.innerHTML = ''
      list.forEach(p => {
        const otherUid = canUse ? p.seller_id : p.buyer_id
        const other = profiles[otherUid]
        const dt = new Date(p.purchased_at).toLocaleDateString('ja-JP')
        const card = document.createElement('div')
        const hasCancelAlert = canUse && p.cancel_requested
        card.className = 'item-card' + (p.used && !hasCancelAlert ? ' inactive' : '') + (p.rarity ? ' ' + p.rarity : '') + (hasCancelAlert ? '' : '')
        if (hasCancelAlert) card.style.borderColor = 'rgba(255,200,80,0.55)'

        let actionHtml = ''
        if (canUse) {
          // 買った側: 未使用なら使用、使用済かつボーナスなしなら取り消し申請可
          if (!p.used) {
            actionHtml = `<button class="buy-btn" onclick="markUsed('${p.id}')">使用済にする</button>`
          } else if (p.cancel_requested) {
            actionHtml = `<span class="cancel-pending">申請中...</span>`
          } else if (!p.bonus_points) {
            actionHtml = `<button class="cancel-btn" onclick="requestCancel('${p.id}')">取り消し申請</button>`
          }
        } else {
          // 売った側: 取り消し申請が来たら承認/否認
          if (p.cancel_requested) {
            actionHtml = `
              <div class="cancel-alert" style="width:100%;flex-direction:column;align-items:flex-start;gap:6px">
                <div>↩️ 取り消し申請あり</div>
                <div style="display:flex;gap:6px">
                  <button class="approve-btn" onclick="approveCancel('${p.id}')">承認</button>
                  <button class="deny-btn" onclick="denyCancel('${p.id}')">却下</button>
                </div>
              </div>`
          }
        }

        card.innerHTML = `
          <div class="item-emoji">${escHtml(p.emoji)}</div>
          <div class="item-info" style="flex:1">
            <div class="item-name">${escHtml(p.name)}${p.used ? ' <span style="font-size:0.7rem;color:#5a8fb8">(使用済)</span>' : ''}</div>
            ${p.description ? `<div class="item-desc">${escHtml(p.description)}</div>` : ''}
            <div class="item-meta">
              ${canUse ? '購入' : '販売'}: ${dt} · ${p.price}pt
              · ${canUse ? '出品' : '購入者'}: ${other?.emoji ?? '?'} ${escHtml(other?.name ?? '?')}
            </div>
            ${hasCancelAlert ? actionHtml : ''}
          </div>
          ${!hasCancelAlert ? actionHtml : ''}
        `
        el.appendChild(card)
      })
    }

    async function buy(itemId) {
      if (!confirm('この商品を購入しますか？')) return
      const { data, error } = await _sb.functions.invoke('purchase-shop-item', {
        body: { item_id: itemId },
      })
      if (error) {
        let msg = error.message || ''
        try { const j = await error.context?.json?.(); if (j?.error) msg = j.error } catch {}
        showToast('❌ ' + msg, true)
        return
      }
      showToast('✅ 購入しました！')
      await loadPoints()
      await loadBuyList()
      await loadPurchases()
    }

    async function markUsed(purchaseId) {
      const p = _purchases.get(purchaseId)
      if (!confirm('この券を使用済にしますか？')) return
      const { error } = await _sb.from('shop_purchases')
        .update({ used: true, used_at: new Date().toISOString() })
        .eq('id', purchaseId)
      if (error) { showToast('更新失敗', true); return }
      const bonusPoints = p?.bonus_points || 0
      if (bonusPoints > 0) {
        await _sb.from('points').insert({ user_id: currentUser.id, amount: bonusPoints, reason: 'shop_bonus' })
        showToast(`使用済 ✅ +${bonusPoints}pt`)
      } else {
        showToast('使用済にしました ✅')
      }
      if (p?.seller_id) {
        _sb.functions.invoke('send-push', { body: {
          title: '🎁 券が使われました',
          body: p.name,
          url: '/shop.html',
          recipient_user_id: p.seller_id,
        }}).catch(() => {})
      }
      await loadPoints()
      await loadPurchases()
    }

    async function requestCancel(purchaseId) {
      // 買った側が申請 → 売った側（seller）に通知
      const p = _purchases.get(purchaseId)
      const { error } = await _sb.from('shop_purchases')
        .update({ cancel_requested: true })
        .eq('id', purchaseId)
      if (error) { showToast('申請失敗', true); return }
      if (p?.seller_id) {
        _sb.functions.invoke('send-push', { body: {
          title: '↩️ 取り消し申請',
          body: `「${p?.name ?? '券'}」の使用済取り消しを申請されました`,
          url: '/shop.html',
          recipient_user_id: p.seller_id,
        }}).catch(() => {})
      }
      showToast('取り消しを申請しました')
      await loadPurchases()
    }

    async function approveCancel(purchaseId) {
      // 売った側が承認 → 買った側（buyer）に通知
      const p = _purchases.get(purchaseId)
      const { error } = await _sb.from('shop_purchases')
        .update({ used: false, used_at: null, cancel_requested: false })
        .eq('id', purchaseId)
      if (error) { showToast('承認失敗', true); return }
      if (p?.buyer_id) {
        _sb.functions.invoke('send-push', { body: {
          title: '✅ 取り消し承認',
          body: `「${p?.name ?? '券'}」の取り消しが承認されました`,
          url: '/shop.html',
          recipient_user_id: p.buyer_id,
        }}).catch(() => {})
      }
      showToast('取り消しを承認しました')
      await loadPurchases()
    }

    async function denyCancel(purchaseId) {
      // 売った側が却下 → 買った側（buyer）に通知
      const p = _purchases.get(purchaseId)
      const { error } = await _sb.from('shop_purchases')
        .update({ cancel_requested: false })
        .eq('id', purchaseId)
      if (error) { showToast('更新失敗', true); return }
      if (p?.buyer_id) {
        _sb.functions.invoke('send-push', { body: {
          title: '❌ 取り消し却下',
          body: `「${p?.name ?? '券'}」の申請が却下されました`,
          url: '/shop.html',
          recipient_user_id: p.buyer_id,
        }}).catch(() => {})
      }
      showToast('申請を却下しました')
      await loadPurchases()
    }

    function toggleForm() {
      const f = document.getElementById('add-form')
      const willOpen = f.style.display === 'none'
      f.style.display = willOpen ? 'block' : 'none'
      if (!willOpen) {
        editingItemId = null
        resetForm()
      }
    }

    async function addItem() {
      if (!partnerId) { showToast('相手情報が取得できません', true); return }
      const name = document.getElementById('new-name').value.trim()
      const emoji = document.getElementById('new-emoji').value.trim() || '🎁'
      const desc = document.getElementById('new-desc').value.trim() || null
      const price = Math.max(1, parseInt(document.getElementById('new-price').value, 10) || 100)
      const stockRaw = document.getElementById('new-stock').value
      const stock = stockRaw ? Math.max(1, parseInt(stockRaw, 10)) : null
      const rarity = document.querySelector('input[name="new-rarity"]:checked').value
      const bonusRaw = document.getElementById('new-bonus').value
      const bonus_points = bonusRaw ? Math.max(0, parseInt(bonusRaw, 10)) : null

      if (!name) { showToast('商品名を入力してください', true); return }

      const { error } = await _sb.from('shop_items').insert({
        seller_id: currentUser.id, buyer_id: partnerId,
        name, emoji, description: desc, price, stock, rarity, bonus_points,
      })
      if (error) { showToast('出品失敗: ' + error.message, true); return }

      _sb.from('points').insert({ user_id: currentUser.id, amount: 1, reason: 'shop_item_add' }).then(() => {})

      document.getElementById('new-name').value = ''
      document.getElementById('new-emoji').value = ''
      document.getElementById('new-desc').value = ''
      document.getElementById('new-price').value = '100'
      document.getElementById('new-stock').value = ''
      document.getElementById('new-bonus').value = ''
      toggleForm()
      showToast('✅ 出品しました')
      await loadSellList()
    }

    async function toggleActive(id, newActive) {
      const { error } = await _sb.from('shop_items').update({ active: newActive }).eq('id', id)
      if (error) { showToast('更新失敗', true); return }
      await loadSellList()
    }

    async function deleteItem(id) {
      if (!confirm('この商品を削除しますか？')) return
      const { error } = await _sb.from('shop_items').delete().eq('id', id)
      if (error) { showToast('削除失敗', true); return }
      showToast('削除しました')
      await loadSellList()
    }

    function escHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    let _hasRequestsTable = null

    async function checkRequestsTable() {
      if (_hasRequestsTable !== null) return _hasRequestsTable
      const { error } = await _sb.from('shop_requests').select('id').limit(1)
      _hasRequestsTable = !error
      return _hasRequestsTable
    }

    function toggleRequestForm() {
      const f = document.getElementById('request-form')
      f.style.display = f.style.display === 'none' ? 'block' : 'none'
    }

    async function loadRequests() {
      const hasTable = await checkRequestsTable()
      if (!hasTable) {
        document.getElementById('partner-requests-list').innerHTML = '<div class="empty">機能準備中です</div>'
        document.getElementById('my-requests-list').innerHTML = ''
        return
      }

      // 相手のリクエスト（pending）
      const { data: partnerReqs } = await _sb.from('shop_requests')
        .select('*')
        .eq('requester_id', partnerId)
        .eq('status', 'pending')
        .order('created_at', { ascending: false })

      const pEl = document.getElementById('partner-requests-list')
      if (!partnerReqs || partnerReqs.length === 0) {
        pEl.innerHTML = '<div class="empty">リクエストはありません</div>'
      } else {
        pEl.innerHTML = ''
        partnerReqs.forEach(r => {
          const card = document.createElement('div')
          card.style.cssText = 'background:rgba(255,255,255,0.06);border:1.5px solid rgba(100,180,255,0.2);border-radius:14px;padding:14px 16px;margin-bottom:10px'
          card.innerHTML = `
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              <span style="font-size:1rem;color:#ffd97d;font-weight:bold">${escReq(r.title)}</span>
              <span style="margin-left:auto;color:#ffd700;font-size:0.9rem">💰 ${r.price}pt</span>
            </div>
            ${r.description ? `<div style="font-size:0.82rem;color:#98bedd;margin-bottom:8px">${escReq(r.description)}</div>` : ''}
            <div style="display:flex;gap:8px">
              <button onclick="respondRequest('${r.id}','accepted')" style="flex:1;padding:8px;background:rgba(100,200,100,0.2);border:1.5px solid rgba(100,200,100,0.4);border-radius:10px;color:#b0f0d5;font-family:inherit;font-size:0.85rem;cursor:pointer">✅ 承諾</button>
              <button onclick="respondRequest('${r.id}','rejected')" style="flex:1;padding:8px;background:rgba(200,80,80,0.15);border:1.5px solid rgba(200,80,80,0.35);border-radius:10px;color:#f0a0a0;font-family:inherit;font-size:0.85rem;cursor:pointer">❌ 断る</button>
            </div>
          `
          pEl.appendChild(card)
        })
      }

      // 自分のリクエスト
      const { data: myReqs } = await _sb.from('shop_requests')
        .select('*')
        .eq('requester_id', currentUser.id)
        .order('created_at', { ascending: false })

      const mEl = document.getElementById('my-requests-list')
      if (!myReqs || myReqs.length === 0) {
        mEl.innerHTML = '<div class="empty">リクエストはありません</div>'
      } else {
        mEl.innerHTML = ''
        myReqs.forEach(r => {
          const statusMap = { pending: '⏳ 待ち中', accepted: '✅ 承諾された', rejected: '❌ 断られた' }
          const statusColor = { pending: '#98bedd', accepted: '#b0f0d5', rejected: '#f0a0a0' }
          const card = document.createElement('div')
          card.style.cssText = 'background:rgba(255,255,255,0.05);border:1.5px solid rgba(100,180,255,0.15);border-radius:14px;padding:14px 16px;margin-bottom:10px'
          card.innerHTML = `
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
              <span style="font-size:1rem;color:#e8f4fd">${escReq(r.title)}</span>
              <span style="margin-left:auto;color:#ffd700;font-size:0.9rem">💰 ${r.price}pt</span>
            </div>
            ${r.description ? `<div style="font-size:0.82rem;color:#7aadcc;margin-bottom:6px">${escReq(r.description)}</div>` : ''}
            <div style="display:flex;align-items:center;justify-content:space-between">
              <span style="font-size:0.82rem;color:${statusColor[r.status] || '#98bedd'}">${statusMap[r.status] || r.status}</span>
              ${r.status === 'pending' ? `<button onclick="deleteRequest('${r.id}')" style="padding:4px 10px;background:rgba(200,80,80,0.1);border:1px solid rgba(200,80,80,0.3);border-radius:8px;color:#f0a0a0;font-family:inherit;font-size:0.75rem;cursor:pointer">削除</button>` : ''}
            </div>
          `
          mEl.appendChild(card)
        })
      }
    }

    async function submitRequest() {
      const title = document.getElementById('req-title').value.trim()
      const price = parseInt(document.getElementById('req-price').value) || 100
      const description = document.getElementById('req-desc').value.trim() || null

      if (!title) { showToast('タイトルを入力してください', true); return }
      if (price < 1) { showToast('価格を入力してください', true); return }

      const hasTable = await checkRequestsTable()
      if (!hasTable) { showToast('機能準備中です', true); return }

      const { error } = await _sb.from('shop_requests').insert({
        requester_id: currentUser.id,
        title, price, description,
        status: 'pending'
      })

      if (error) { showToast('送信失敗: ' + error.message, true); return }

      // 相手に通知
      if (partnerId) {
        _sb.functions.invoke('send-push', {
          body: {
            title: '📝 リクエストが届きました',
            body: `「${title}」(${price}pt)`,
            url: '/shop.html',
            recipient_user_id: partnerId
          }
        }).catch(() => {})
      }

      document.getElementById('req-title').value = ''
      document.getElementById('req-desc').value = ''
      document.getElementById('req-price').value = '100'
      toggleRequestForm()
      showToast('リクエストを送りました！')
      await loadRequests()
    }

    async function respondRequest(id, status) {
      // まずリクエスト本体を取得（承諾時にshop_itemsへコピーするため）
      const { data: req, error: fetchErr } = await _sb.from('shop_requests')
        .select('*').eq('id', id).single()
      if (fetchErr || !req) { showToast('リクエストが見つかりません', true); return }

      const { error } = await _sb.from('shop_requests').update({ status }).eq('id', id)
      if (error) { showToast('更新失敗', true); return }

      let listed = false
      // 承諾時: shop_items に自動出品（承諾者=売り手 / リクエスト主=買い手）
      if (status === 'accepted') {
        const { error: itemErr } = await _sb.from('shop_items').insert({
          seller_id: currentUser.id,
          buyer_id: req.requester_id,
          name: req.title,
          emoji: '📝',
          description: req.description || `リクエストから出品: ${req.title}`,
          price: req.price,
          stock: 1,
          rarity: 'N',
          bonus_points: null,
        })
        if (itemErr) {
          console.error('[shop] auto-list from request failed:', itemErr)
          showToast('自動出品に失敗しました', true)
        } else {
          listed = true
          // 出品追加 +1pt
          _sb.from('points').insert({ user_id: currentUser.id, amount: 1, reason: 'shop_item_add' }).then(() => {})
        }
      }

      const msg = status === 'accepted'
        ? (listed ? '承諾＆出品しました' : '承諾しました')
        : '断りました'
      showToast(msg)

      // リクエスト主（パートナー）に通知
      if (partnerId) {
        const label = status === 'accepted'
          ? (listed ? '承諾されました✅ 買うタブから購入できます' : '承諾されました ✅')
          : '断られました ❌'
        _sb.functions.invoke('send-push', {
          body: {
            title: `📝 リクエストへの返答: ${req.title}`,
            body: label,
            url: '/shop.html',
            recipient_user_id: partnerId
          }
        }).catch(() => {})
      }

      await loadRequests()
      await loadBuyList()
      await loadSellList()
    }

    async function deleteRequest(id) {
      const { error } = await _sb.from('shop_requests').delete().eq('id', id)
      if (error) { showToast('削除失敗', true); return }
      showToast('削除しました')
      await loadRequests()
    }

    function escReq(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function showToast(msg, isError = false) {
      const el = document.getElementById('toast')
      el.textContent = msg
      el.className = 'toast' + (isError ? ' error' : '')
      void el.offsetWidth
      el.classList.add('show')
      setTimeout(() => el.classList.remove('show'), 3000)
    }

    init()
  </script>
</body>
</html>
