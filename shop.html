  <script>
    let currentUser = null
    let profiles = {}
    let partnerId = null
    const _purchases = new Map()

    async function init() {
      const { data: { session } } = await _sb.auth.getSession()
      if (!session) return
      currentUser = session.user
      const { data: profs } = await _sb.from('profiles').select('*')
      ;(profs || []).forEach(p => { profiles[p.id] = p })
      const partner = (profs || []).find(p => p.id !== currentUser.id)
      partnerId = partner?.id || null

      await loadPoints()
      await loadBuyList()
      await loadSellList()
      await loadPurchases()

      // 他ページ (ガチャ・クイズ等) でポイントや在庫が動いても最新に追従させる。
      // タブ復帰・戻るキャッシュ (bfcache) からの復帰の両方を拾う
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') refreshShop()
      })
      window.addEventListener('pageshow', e => { if (e.persisted) refreshShop() })
    }

    let _refreshing = false
    async function refreshShop() {
      if (_refreshing || !currentUser) return
      _refreshing = true
      try {
        await loadPoints()
        await loadBuyList()
        await loadSellList()
        await loadPurchases()
      } catch (e) {
        console.error('[shop] 再読み込みに失敗:', e)
      } finally {
        _refreshing = false
      }
    }

    function switchTab(name) {
      ;['buy','sell','purchases','requests'].forEach(n => {
        document.getElementById('tab-btn-' + n).classList.toggle('active', n === name)
        document.getElementById('panel-' + n).classList.toggle('active', n === name)
      })
      if (name === 'requests') loadRequests()
    }

    async function loadPoints() {
      const total = await getBalance(currentUser.id)
      if (total === null) return
      document.getElementById('point-display').textContent = total + 'pt'
      window._currentBalance = total
    }

          <div class="item-emoji">${escHtml(it.emoji)}</div>
          <div class="item-info">
            <div class="item-name">${escHtml(it.name)}${it.rarity ? ` <span style="font-size:0.7rem;color:${it.rarity==='SR'?'#ffd700':it.rarity==='R'?'#d09aff':'#7ec8f0'}">[${it.rarity}]</span>` : ''}</div>

    // 売り切れ商品の再販を出品者(相手)にリクエスト

        kind: 'shop',
        recipient: it.seller_id,

      const list = document.getElementById('sell-list')
      if (!data || data.length === 0) {

        card.innerHTML = `
          <div class="item-emoji">${escHtml(it.emoji)}</div>
          <div class="item-info">
            <div class="item-name">${escHtml(it.name)}${it.rarity ? ` <span style="font-size:0.7rem;color:${it.rarity==='SR'?'#ffd700':it.rarity==='R'?'#d09aff':'#7ec8f0'}">[${it.rarity}]</span>` : ''}</div>
            ${it.description ? `<div class="item-desc">${escHtml(it.description)}</div>` : ''}

              <span class="item-price">${it.price}pt</span>

              ${it.stock !== null ? ` · 残り${it.stock}` : ''}

    let editingItemId = null

    function editItem(id) {
      // load latest data (from cache: 再取得)
      _sb.from('shop_items').select('*').eq('id', id).single().then(({ data, error }) => {
        if (error || !data) { showToast('取得失敗', true); return }
        editingItemId = id
        document.getElementById('new-name').value = data.name
        document.getElementById('new-emoji').value = data.emoji
        document.getElementById('new-desc').value = data.description || ''
        document.getElementById('new-price').value = data.price
        document.getElementById('new-stock').value = data.stock ?? ''
        if (data.rarity) {
          const r = document.querySelector(`input[name="new-rarity"][value="${data.rarity}"]`)
          if (r) r.checked = true
        }
        document.getElementById('new-bonus').value = data.bonus_points ?? ''

        // フォーム表示 + ボタンラベル変更
        document.getElementById('add-form').style.display = 'block'
        const btns = document.querySelectorAll('#add-form .btn-confirm')
        btns.forEach(b => { b.textContent = '保存する'; b.onclick = saveItem })
        document.getElementById('add-form').scrollIntoView({ behavior: 'smooth', block: 'center' })
      })
    }

    async function saveItem() {
      if (!editingItemId) return
      const name = document.getElementById('new-name').value.trim()
      const emoji = document.getElementById('new-emoji').value.trim() || '🎁'
      const desc = document.getElementById('new-desc').value.trim() || null
      const price = Math.max(1, parseInt(document.getElementById('new-price').value, 10) || 100)
      const stockRaw = document.getElementById('new-stock').value
      const stock = stockRaw ? Math.max(1, parseInt(stockRaw, 10)) : null
      const rarity = document.querySelector('input[name="new-rarity"]:checked').value
      const bonusRaw = document.getElementById('new-bonus').value
      const bonus_points = bonusRaw ? Math.max(0, parseInt(bonusRaw, 10)) : null

      if (!name) { showToast('商品名を入力してください', true); return }

      const { error } = await _sb.from('shop_items').update({
        name, emoji, description: desc, price, stock, rarity, bonus_points,
        updated_at: new Date().toISOString(),
      }).eq('id', editingItemId)
      if (error) { showToast('保存失敗: ' + error.message, true); return }

      editingItemId = null
      resetForm()
      toggleForm()
      showToast('✅ 保存しました')
      await loadSellList()
      await loadBuyList()
    }

    function resetForm() {
      document.getElementById('new-name').value = ''
      document.getElementById('new-emoji').value = ''
      document.getElementById('new-desc').value = ''
      document.getElementById('new-price').value = '100'
      document.getElementById('new-stock').value = ''
      document.getElementById('new-bonus').value = ''
      const btns = document.querySelectorAll('#add-form .btn-confirm')
      btns.forEach(b => { b.textContent = '出品する'; b.onclick = addItem })
    }

    // ===== 統合券インベントリ =====
    // gacha_results と shop_purchases を統合表示。source フィールドで区別
    let _tickets = []          // 正規化されたチケット配列
    let ticketsTab = 'usable'  // 'usable' | 'partner' | 'used'

    function setTicketsTab(tab) {
      ticketsTab = tab
      document.querySelectorAll('.ticket-filter-chip').forEach(el =>
        el.classList.toggle('active', el.dataset.tTab === tab)
      )
      renderTickets()
    }

    // 正規化: 両テーブルの1レコードを共通形式に変換
    function normalizeGachaTicket(g) {
      return {
        source: 'gacha',
        id: g.id,
        ownerUserId: g.user_id,       // 券を持ってる（使える）人
        counterUserId: null,          // ガチャは相手が固定 (partnerId で解決)
        name: g.reward_name,
        emoji: g.reward_emoji,
        description: g.reward_desc,
        rarity: g.rarity,
        used: g.used,
        cancelRequested: g.cancel_requested,
        bonusPoints: g.bonus_points,
        createdAt: g.created_at,
        raw: g,
      }
    }
    function normalizeShopTicket(p) {
      return {
        source: 'shop',
        id: p.id,
        ownerUserId: p.buyer_id,      // 券を持ってる (使える) 人 = 買った人
        counterUserId: p.seller_id,   // 券を作った (売った) 相手
        name: p.name,
        emoji: p.emoji,
        description: p.description,
        rarity: p.rarity,
        used: p.used,
        cancelRequested: p.cancel_requested,
        bonusPoints: p.bonus_points,
        createdAt: p.purchased_at,
        raw: p,
      }
    }

    async function loadTickets() {
      // ガチャ券 (自分・相手両方)
      const { data: gacha } = await _sb.from('gacha_results')
        .select('*').order('created_at', { ascending: false }).limit(200)
      // 販売所券 (自分が buyer or 自分が seller)
      const { data: shopMine } = await _sb.from('shop_purchases')
        .select('*').eq('buyer_id', currentUser.id)
        .order('purchased_at', { ascending: false }).limit(100)
      const { data: shopSold } = await _sb.from('shop_purchases')
        .select('*').eq('seller_id', currentUser.id)
        .order('purchased_at', { ascending: false }).limit(100)

      // dedup on id (mine と sold は普通別だが念のため)
      const shopMap = new Map()
      ;(shopMine || []).forEach(p => shopMap.set(p.id, p))
      ;(shopSold || []).forEach(p => shopMap.set(p.id, p))

      _tickets = []
        .concat((gacha || []).map(normalizeGachaTicket))
        .concat(Array.from(shopMap.values()).map(normalizeShopTicket))
        // createdAt 降順
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))

      renderTickets()
    }
    // 旧APIの後方互換 (他所からの呼び出しを壊さない)
    const loadPurchases = loadTickets

    function ticketMatchesTicketsTab(t, tab) {
      const isMine = t.ownerUserId === currentUser.id
      if (tab === 'usable')  return isMine && !t.used
      if (tab === 'partner') return !isMine && !t.used
      if (tab === 'used')    return t.used
      return true
    }

    function renderTickets() {
      const el = document.getElementById('tickets-list')
      // 件数更新
      const counts = { usable: 0, partner: 0, used: 0 }
      _tickets.forEach(t => {
        if (ticketMatchesTicketsTab(t, 'usable'))  counts.usable++
        if (ticketMatchesTicketsTab(t, 'partner')) counts.partner++
        if (ticketMatchesTicketsTab(t, 'used'))    counts.used++
      })
      const u = document.getElementById('t-count-usable')
      const p = document.getElementById('t-count-partner')
      const s = document.getElementById('t-count-used')
      if (u) u.textContent = counts.usable
      if (p) p.textContent = counts.partner
      if (s) s.textContent = counts.used

      // サマリー: 使えるタブのとき「N枚 · 使うと合計 +Xpt」
      const summaryEl = document.getElementById('ticket-summary')
      if (summaryEl) {
        if (ticketsTab === 'usable' && counts.usable > 0) {
          const bonusTotal = _tickets
            .filter(t => ticketMatchesTicketsTab(t, 'usable'))
            .reduce((sum, t) => sum + (t.bonusPoints || 0), 0)
          summaryEl.innerHTML = `🎫 使える券 <b>${counts.usable}</b> 枚`
            + (bonusTotal > 0 ? ` · 使うと合計 <b>+${bonusTotal}pt</b>` : '')
          summaryEl.style.display = 'flex'
        } else {
          summaryEl.style.display = 'none'
        }
      }

      if (_tickets.length === 0) {
        el.innerHTML = '<div class="empty">まだ券がありません。ガチャを回すか販売所で買おう 🎫</div>'
        return
      }
      const filtered = _tickets.filter(t => ticketMatchesTicketsTab(t, ticketsTab))
      if (filtered.length === 0) {
        const msg = ticketsTab === 'usable'
          ? '使える券はありません'
          : ticketsTab === 'partner'
          ? '相手が持ってる券はありません'
          : 'まだ使用済みの券はありません'
        el.innerHTML = `<div class="empty">${msg}</div>`
        return
      }

      // 未使用タブ(使える/相手が持ってる)は同一の券をまとめて ×N 表示。
      // 使用済みタブは履歴なので個別表示のまま。
      let display
      if (ticketsTab === 'used') {
        display = filtered.map(t => ({ rep: t, count: 1 }))
      } else {
        const groups = new Map()
        filtered.forEach(t => {
          const key = [t.source, t.name, t.emoji, t.rarity, t.description, t.bonusPoints].join('§')
          if (!groups.has(key)) groups.set(key, { rep: t, count: 0 })
          groups.get(key).count++
        })
        display = Array.from(groups.values())
      }

      // レア度順(SR→R→N)、同レア度は新しい順で並べ替え → 良い券が上に来る
      const RARITY_ORDER = { SR: 0, R: 1, N: 2 }
      display.sort((a, b) => {
        const ra = RARITY_ORDER[a.rep.rarity] ?? 3
        const rb = RARITY_ORDER[b.rep.rarity] ?? 3
        if (ra !== rb) return ra - rb
        return new Date(b.rep.createdAt) - new Date(a.rep.createdAt)
      })

      el.innerHTML = ''
      display.forEach(g => {
        const t = g.rep
        const qty = g.count
        const isMine = t.ownerUserId === currentUser.id
        const hasCancelAlert = t.cancelRequested && (
          (t.source === 'shop' && t.counterUserId === currentUser.id) ||
          (t.source === 'gacha' && !isMine)  // 相手が引いたガチャ券に取り消し申請 → 自分が承認する側
        )
        const dt = new Date(t.createdAt).toLocaleDateString('ja-JP')
        const rarityCls = t.rarity ? ' ' + t.rarity : ''
        const inactiveCls = (t.used && !hasCancelAlert) ? ' inactive' : ''
        const card = document.createElement('div')
        card.className = 'item-card' + inactiveCls + rarityCls
        if (hasCancelAlert) card.style.borderColor = 'rgba(255,200,80,0.55)'

        // Owner label (誰の券か)
        const owner = profiles[t.ownerUserId]
        const ownerLabel = owner ? `${owner.emoji} ${escHtml(owner.name)}` : ''
        const sourceBadge = t.source === 'gacha'
          ? '<span class="source-badge gacha">🎰 ガチャ</span>'
          : '<span class="source-badge shop">🛍 販売所</span>'

        // Actions
        let actionHtml = ''
        if (isMine) {
          if (!t.used) {
            const fn = `markUsedTicket('${t.source}','${t.id}')`
            const btnLabel = qty > 1 ? '🎫 1枚使う' : '🎫 使う'
            actionHtml = `<button class="buy-btn" onclick="${fn}">${btnLabel}</button>`
          } else if (t.cancelRequested) {
            actionHtml = `<span class="cancel-pending">申請中...</span>`
          } else if (!t.bonusPoints) {
            const fn = t.source === 'gacha' ? `requestCancelTicket('gacha','${t.id}')` : `requestCancelTicket('shop','${t.id}')`
            actionHtml = `<button class="cancel-btn" onclick="${fn}">取り消し申請</button>`
          }
        } else {
          // 相手が持ってる券。相手が使用済＆取消申請してきた場合、こちら側が承認/却下
          if (hasCancelAlert) {
            actionHtml = `
              <div class="cancel-alert" style="width:100%;flex-direction:column;align-items:flex-start;gap:6px">
                <div>↩️ 取り消し申請あり</div>
                <div style="display:flex;gap:6px">
                  <button class="approve-btn" onclick="approveCancelTicket('${t.source}','${t.id}')">承認</button>
                  <button class="deny-btn"    onclick="denyCancelTicket('${t.source}','${t.id}')">却下</button>
                </div>
              </div>`
          }
        }

        // メタ
        const metaBits = []
        if (t.source === 'shop' && t.raw.price != null) metaBits.push(`${t.raw.price}pt`)
        if (t.bonusPoints) metaBits.push(`<span style="color:#ffd764;font-weight:bold">使うと +${t.bonusPoints}pt</span>`)
        metaBits.push(dt)
        const meta = metaBits.join(' · ')
        const rarityChip = t.rarity ? `<span class="rarity-chip ${t.rarity}">${t.rarity}</span>` : ''

        card.innerHTML = `
          <div class="item-emoji">${escHtml(t.emoji)}</div>
          <div class="item-info" style="flex:1">
            <div class="item-name">
              ${escHtml(t.name)}${rarityChip}${qty > 1 ? `<span class="qty-badge">×${qty}</span>` : ''}${sourceBadge}${t.used ? ' <span style="font-size:0.7rem;color:#5a8fb8">(使用済)</span>' : ''}
            </div>
            ${t.description ? `<div class="item-desc">${escHtml(t.description)}</div>` : ''}
            <div class="item-meta">
              ${meta}${ownerLabel ? ` · ${isMine ? '自分の券' : ownerLabel + ' の券'}` : ''}
            </div>
            ${hasCancelAlert ? actionHtml : ''}
          </div>
          ${!hasCancelAlert ? actionHtml : ''}
        `
        el.appendChild(card)
      })
    }

    // 統合 markUsed: source に応じて gacha_results / shop_purchases を更新
    async function markUsedTicket(source, id) {
      if (!confirm('この券を使用済にしますか？')) return
      const t = _tickets.find(x => x.source === source && x.id === id)
      if (!t) return
      const table = source === 'gacha' ? 'gacha_results' : 'shop_purchases'
      const usedCol = source === 'gacha' ? { used: true } : { used: true, used_at: new Date().toISOString() }
      const { error } = await _sb.from(table).update(usedCol).eq('id', id)
      if (error) { showToast('更新失敗: ' + error.message, true); return }

      // ボーナスpt付与
      const bonus = t.bonusPoints || 0
      if (bonus > 0) {
        const reason = source === 'gacha' ? 'gacha_bonus' : 'shop_bonus'
        await addPoints(currentUser.id, bonus, reason)
        showToast('使用済 ✅ ポイントを受け取ったよ')
      } else {
        showToast('使用済にしました ✅')
      }

      // 相手に通知 (Push + LINE)
      const counterId = source === 'gacha' ? partnerId : t.counterUserId
      if (counterId) {
        const bodyMsg = `${t.emoji || '🎁'} ${t.name}${t.description ? ' — ' + t.description : ''}`
        const pushTitle = source === 'gacha' ? '🎰 ガチャ券が使われました' : '🎁 券が使われました'
        notify({
          title: pushTitle,
          body: bodyMsg,
          url: '/shop.html',
          kind: source === 'gacha' ? 'gacha' : 'shop',
          recipient: counterId,
        })
        // LINE 個人にも通知（券は相手に対する約束事なので確実に届けたい）
        _sb.functions.invoke('line-notify', { body: {
          sender_id: currentUser.id,
          target: 'partner',
          message: `${pushTitle}\n${bodyMsg}`,
        }}).catch(() => {})
      }

      await loadPoints()
      await loadTickets()
    }

    async function requestCancelTicket(source, id) {
      const t = _tickets.find(x => x.source === source && x.id === id)
      if (!t) return
      const table = source === 'gacha' ? 'gacha_results' : 'shop_purchases'
      const { error } = await _sb.from(table).update({ cancel_requested: true }).eq('id', id)
      if (error) { showToast('申請失敗', true); return }

      const counterId = source === 'gacha' ? partnerId : t.counterUserId
      if (counterId) {
        notify({
          title: '↩️ 取り消し申請',
          body: `${t.emoji || '🎁'} ${t.name} の取り消しを申請されました`,
          url: '/shop.html',
          kind: source === 'gacha' ? 'gacha' : 'shop',
          recipient: counterId,
        })
      }
      showToast('取り消しを申請しました')
      await loadTickets()
    }

    async function approveCancelTicket(source, id) {
      const t = _tickets.find(x => x.source === source && x.id === id)
      if (!t) return
      const table = source === 'gacha' ? 'gacha_results' : 'shop_purchases'
      const patch = source === 'gacha'
        ? { used: false, cancel_requested: false }
        : { used: false, used_at: null, cancel_requested: false }
      const { error } = await _sb.from(table).update(patch).eq('id', id)
      if (error) { showToast('承認失敗', true); return }

      if (t.ownerUserId) {
        notify({
          title: '✅ 取り消し承認',
          body: `${t.emoji || '🎁'} ${t.name} の取り消しが承認されました`,
          url: '/shop.html',
          kind: source === 'gacha' ? 'gacha' : 'shop',
          recipient: t.ownerUserId,
        })
      }
      showToast('取り消しを承認しました')
      await loadTickets()
    }

    async function denyCancelTicket(source, id) {
      const t = _tickets.find(x => x.source === source && x.id === id)
      if (!t) return
      const table = source === 'gacha' ? 'gacha_results' : 'shop_purchases'
      const { error } = await _sb.from(table).update({ cancel_requested: false }).eq('id', id)
      if (error) { showToast('更新失敗', true); return }

      if (t.ownerUserId) {
        notify({
          title: '❌ 取り消し却下',
          body: `${t.emoji || '🎁'} ${t.name} の申請が却下されました`,
          url: '/shop.html',
          kind: source === 'gacha' ? 'gacha' : 'shop',
          recipient: t.ownerUserId,
        })
      }
      showToast('申請を却下しました')
      await loadTickets()
    }

    async function buy(itemId) {
      if (!confirm('この商品を購入しますか？')) return
      const { data, error } = await _sb.functions.invoke('purchase-shop-item', {
        body: { item_id: itemId },
      })
      if (error) {
        let msg = error.message || ''
        try { const j = await error.context?.json?.(); if (j?.error) msg = j.error } catch {}
        showToast('❌ ' + msg, true)
        return
      }
      showToast('✅ 購入しました！')
      await loadPoints()
      await loadBuyList()
      await loadPurchases()
    }

    function toggleForm() {
      const f = document.getElementById('add-form')
      const willOpen = f.style.display === 'none'
      f.style.display = willOpen ? 'block' : 'none'
      if (!willOpen) {
        editingItemId = null
        resetForm()
      }
    }

    async function addItem() {
      if (!partnerId) { showToast('相手情報が取得できません', true); return }
      const name = document.getElementById('new-name').value.trim()
      const emoji = document.getElementById('new-emoji').value.trim() || '🎁'
      const desc = document.getElementById('new-desc').value.trim() || null
      const price = Math.max(1, parseInt(document.getElementById('new-price').value, 10) || 100)
      const stockRaw = document.getElementById('new-stock').value
      const stock = stockRaw ? Math.max(1, parseInt(stockRaw, 10)) : null
      const rarity = document.querySelector('input[name="new-rarity"]:checked').value
      const bonusRaw = document.getElementById('new-bonus').value
      const bonus_points = bonusRaw ? Math.max(0, parseInt(bonusRaw, 10)) : null

      if (!name) { showToast('商品名を入力してください', true); return }

      const { error } = await _sb.from('shop_items').insert({
        seller_id: currentUser.id, buyer_id: partnerId,
        name, emoji, description: desc, price, stock, rarity, bonus_points,
      })
      if (error) { showToast('出品失敗: ' + error.message, true); return }

      addPoints(currentUser.id, 1, 'shop_item_add')

      document.getElementById('new-name').value = ''
      document.getElementById('new-emoji').value = ''
      document.getElementById('new-desc').value = ''
      document.getElementById('new-price').value = '100'
      document.getElementById('new-stock').value = ''
      document.getElementById('new-bonus').value = ''
      toggleForm()
      showToast('✅ 出品しました')
      await loadSellList()
    }

    async function toggleActive(id, newActive) {
      const { error } = await _sb.from('shop_items').update({ active: newActive }).eq('id', id)
      if (error) { showToast('更新失敗', true); return }
      await loadSellList()
    }

    async function deleteItem(id) {
      if (!confirm('この商品を削除しますか？')) return
      const { error } = await _sb.from('shop_items').delete().eq('id', id)
      if (error) { showToast('削除失敗', true); return }
      showToast('削除しました')
      await loadSellList()
    }

    let _hasRequestsTable = null

    async function checkRequestsTable() {
      if (_hasRequestsTable !== null) return _hasRequestsTable
      const { error } = await _sb.from('shop_requests').select('id').limit(1)
      _hasRequestsTable = !error
      return _hasRequestsTable
    }

    function toggleRequestForm() {
      const f = document.getElementById('request-form')
      f.style.display = f.style.display === 'none' ? 'block' : 'none'
    }

    // リクエストの宛先: 'shop' = 販売所に出品してほしい / 'gacha' = ガチャの景品に入れてほしい
    let reqTarget = 'shop'
    function setReqTarget(t) {
      reqTarget = t
      document.querySelectorAll('#req-target-row .req-target')
        .forEach(b => b.classList.toggle('active', b.dataset.target === t))
    }
    function reqTargetBadge(target) {
      return target === 'gacha'
        ? '<span class="req-badge gacha">🎰 ガチャ</span>'
        : '<span class="req-badge shop">🛍 販売所</span>'
    }

    async function loadRequests() {
      const hasTable = await checkRequestsTable()
      if (!hasTable) {
        document.getElementById('partner-requests-list').innerHTML = '<div class="empty">機能準備中です</div>'
        document.getElementById('my-requests-list').innerHTML = ''
        return
      }

      // 相手のリクエスト（pending）
      const { data: partnerReqs } = await _sb.from('shop_requests')
        .select('*')
        .eq('requester_id', partnerId)
        .eq('status', 'pending')
        .order('created_at', { ascending: false })

      const pEl = document.getElementById('partner-requests-list')
      if (!partnerReqs || partnerReqs.length === 0) {
        pEl.innerHTML = '<div class="empty">リクエストはありません</div>'
      } else {
        pEl.innerHTML = ''
        partnerReqs.forEach(r => {
          const card = document.createElement('div')
          card.style.cssText = 'background:rgba(255,255,255,0.06);border:1.5px solid rgba(100,180,255,0.2);border-radius:14px;padding:14px 16px;margin-bottom:10px'
          card.innerHTML = `
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
              ${reqTargetBadge(r.target)}
              <span style="font-size:1rem;color:#ffd97d;font-weight:bold">${escHtml(r.title)}</span>
              <span style="margin-left:auto;color:#ffd700;font-size:0.9rem">💰 ${r.price}pt</span>
            </div>
            ${r.description ? `<div style="font-size:0.82rem;color:#98bedd;margin-bottom:8px">${escHtml(r.description)}</div>` : ''}
            <div style="display:flex;gap:8px">
              <button onclick="respondRequest('${r.id}','accepted')" style="flex:1;padding:8px;background:rgba(100,200,100,0.2);border:1.5px solid rgba(100,200,100,0.4);border-radius:10px;color:#b0f0d5;font-family:inherit;font-size:0.85rem;cursor:pointer">✅ 承諾</button>
              <button onclick="respondRequest('${r.id}','rejected')" style="flex:1;padding:8px;background:rgba(200,80,80,0.15);border:1.5px solid rgba(200,80,80,0.35);border-radius:10px;color:#f0a0a0;font-family:inherit;font-size:0.85rem;cursor:pointer">❌ 断る</button>
            </div>
          `
          pEl.appendChild(card)
        })
      }

      // 自分のリクエスト
      const { data: myReqs } = await _sb.from('shop_requests')
        .select('*')
        .eq('requester_id', currentUser.id)
        .order('created_at', { ascending: false })

      const mEl = document.getElementById('my-requests-list')
      if (!myReqs || myReqs.length === 0) {
        mEl.innerHTML = '<div class="empty">リクエストはありません</div>'
      } else {
        mEl.innerHTML = ''
        myReqs.forEach(r => {
          const statusMap = { pending: '⏳ 待ち中', accepted: '✅ 承諾された', rejected: '❌ 断られた' }
          const statusColor = { pending: '#98bedd', accepted: '#b0f0d5', rejected: '#f0a0a0' }
          const card = document.createElement('div')
          card.style.cssText = 'background:rgba(255,255,255,0.05);border:1.5px solid rgba(100,180,255,0.15);border-radius:14px;padding:14px 16px;margin-bottom:10px'
          card.innerHTML = `
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
              ${reqTargetBadge(r.target)}
              <span style="font-size:1rem;color:#e8f4fd">${escHtml(r.title)}</span>
              <span style="margin-left:auto;color:#ffd700;font-size:0.9rem">💰 ${r.price}pt</span>
            </div>
            ${r.description ? `<div style="font-size:0.82rem;color:#7aadcc;margin-bottom:6px">${escHtml(r.description)}</div>` : ''}
            <div style="display:flex;align-items:center;justify-content:space-between">
              <span style="font-size:0.82rem;color:${statusColor[r.status] || '#98bedd'}">${statusMap[r.status] || r.status}</span>
              ${r.status === 'pending' ? `<button onclick="deleteRequest('${r.id}')" style="padding:4px 10px;background:rgba(200,80,80,0.1);border:1px solid rgba(200,80,80,0.3);border-radius:8px;color:#f0a0a0;font-family:inherit;font-size:0.75rem;cursor:pointer">削除</button>` : ''}
            </div>
          `
          mEl.appendChild(card)
        })
      }
    }

    async function submitRequest() {
      const title = document.getElementById('req-title').value.trim()
      const price = parseInt(document.getElementById('req-price').value) || 100
      const description = document.getElementById('req-desc').value.trim() || null

      if (!title) { showToast('タイトルを入力してください', true); return }
      if (price < 1) { showToast('価格を入力してください', true); return }

      const hasTable = await checkRequestsTable()
      if (!hasTable) { showToast('機能準備中です', true); return }

      const { error } = await _sb.from('shop_requests').insert({
        requester_id: currentUser.id,
        title, price, description,
        target: reqTarget,
        status: 'pending'
      })

      if (error) { showToast('送信失敗: ' + error.message, true); return }

      // 相手に通知
      if (partnerId) {
        const where = reqTarget === 'gacha' ? '🎰 ガチャの景品に' : '🛍 販売所に'
        notify({
          title: '📝 リクエストが届きました',
          body: `${where}「${title}」(${price}pt)`,
          url: '/shop.html',
          kind: 'shop',
          recipient: partnerId,
        })
      }

      document.getElementById('req-title').value = ''
      document.getElementById('req-desc').value = ''
      document.getElementById('req-price').value = '100'
      toggleRequestForm()
      showToast('リクエストを送りました！')
      await loadRequests()
    }

    async function respondRequest(id, status) {
      // まずリクエスト本体を取得（承諾時にshop_itemsへコピーするため）
      const { data: req, error: fetchErr } = await _sb.from('shop_requests')
        .select('*').eq('id', id).single()
      if (fetchErr || !req) { showToast('リクエストが見つかりません', true); return }

      const { error } = await _sb.from('shop_requests').update({ status }).eq('id', id)
      if (error) { showToast('更新失敗', true); return }

      let listed = false
      // 承諾時: shop_items に自動出品（承諾者=売り手 / リクエスト主=買い手）
      if (status === 'accepted') {
        const { error: itemErr } = await _sb.from('shop_items').insert({
          seller_id: currentUser.id,
          buyer_id: req.requester_id,
          name: req.title,
          emoji: '📝',
          description: req.description || `リクエストから出品: ${req.title}`,
          price: req.price,
          stock: 1,
          rarity: 'N',
          bonus_points: null,
        })
        if (itemErr) {
          console.error('[shop] auto-list from request failed:', itemErr)
          showToast('自動出品に失敗しました', true)
        } else {
          listed = true
          // 出品追加 +1pt
          addPoints(currentUser.id, 1, 'shop_item_add')
        }
      }

      const msg = status === 'accepted'
        ? (listed ? '承諾＆出品しました' : '承諾しました')
        : '断りました'
      showToast(msg)

      // リクエスト主（パートナー）に通知
      if (partnerId) {
        const label = status === 'accepted'
          ? (listed ? '承諾されました✅ 買うタブから購入できます' : '承諾されました ✅')
          : '断られました ❌'
        notify({
          title: `📝 リクエストへの返答: ${req.title}`,
          body: label,
          url: '/shop.html',
          kind: 'shop',
          recipient: partnerId,
        })
      }

      await loadRequests()
      await loadBuyList()
      await loadSellList()
    }

    async function deleteRequest(id) {
      const { error } = await _sb.from('shop_requests').delete().eq('id', id)
      if (error) { showToast('削除失敗', true); return }
      showToast('削除しました')
      await loadRequests()
    }

    function showToast(msg, isError = false) {
      const el = document.getElementById('toast')
      el.textContent = msg
      el.className = 'toast' + (isError ? ' error' : '')
      void el.offsetWidth
      el.classList.add('show')
      setTimeout(() => el.classList.remove('show'), 3000)
    }

    init()
  </script>
</body>
</html>
