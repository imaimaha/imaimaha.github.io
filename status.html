<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
  <title>今日の帰宅 | Notre Endroit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const _sb = window.supabase.createClient(
      'https://qivnfiqyjfajlzbdqodd.supabase.co',
      'sb_publishable_PR_chyGmNVRJJ24eVqlqYg_CGAOjfpx'
    )
    _sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) window.location.href = '/login.html'
    })
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #0a1628 0%, #0d2044 40%, #112a5e 100%) fixed; background-attachment: fixed;
      color: #4a3f35;
      min-height: 100vh;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: linear-gradient(180deg, rgba(26,48,96,0.85) 0%, transparent 100%); backdrop-filter: blur(4px);
    }

    .top-bar a { color: #98bedd; text-decoration: none; font-size: 0.9rem; }
    .top-bar h1 { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.4rem; color: #e8f4fd; }

    .logout-btn {
      background: #fff; border: 2px solid #e8ddd5; color: #8d6e63;
      padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem;
    }

    .top-right { display: flex; align-items: center; gap: 8px; }

    .content {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* ステータスカード */
    .status-cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .status-card {
      background: #fff;
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      position: relative;
    }

    .status-card.mine {
      border: 2px solid #a5d6a7;
    }

    .status-card.partner {
      border: 2px solid #e8ddd5;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card-emoji { font-size: 2rem; }

    .card-name {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.1rem;
      color: #5d4037;
    }

    .card-badge {
      font-size: 0.7rem;
      background: #a5d6a7;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 4px;
    }

    .status-time {
      font-size: 2.2rem;
      font-family: 'Zen Kurenaido', sans-serif;
      color: #5d4037;
      margin-bottom: 4px;
    }

    .status-time.unset { font-size: 1.1rem; color: #bcaaa4; }

    .status-note {
      font-size: 0.85rem;
      color: #a1887f;
      margin-bottom: 8px;
      min-height: 20px;
    }

    .status-updated {
      font-size: 0.72rem;
      color: #d7ccc8;
    }

    .edit-btn {
      position: absolute;
      top: 16px; right: 16px;
      background: #f1f8f1;
      border: 1.5px solid #a5d6a7;
      color: #66bb6a;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      transition: background 0.2s;
    }

    .edit-btn:hover { background: #e8f5e9; }

    /* 編集フォーム */
    .edit-form {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #f0ebe3;
    }

    .edit-form.open { display: block; }

    .form-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .form-row label {
      font-size: 0.82rem;
      color: #8d6e63;
      white-space: nowrap;
      min-width: 56px;
    }

    .form-row input {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid #e8ddd5;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      color: #4a3f35;
      outline: none;
    }

    .form-row input:focus { border-color: #a5d6a7; }

    .save-btn {
      width: 100%;
      padding: 10px;
      background: #81c784;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }

    .save-btn:hover { background: #66bb6a; }

    .quick-time-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .quick-btn {
      flex: 1;
      padding: 8px 0;
      background: #f1f8f1;
      border: 1.5px solid #a5d6a7;
      color: #66bb6a;
      border-radius: 8px;
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
    }

    .quick-btn:active { background: #e8f5e9; }

    /* 「行っていい？」ボタン */
    .ask-section {
      text-align: center;
      margin-top: 8px;
    }

    .ask-btn {
      background: #fff;
      border: 2px solid #f48fb1;
      color: #e91e63;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 3px 10px rgba(233,30,99,0.1);
    }

    .ask-btn:hover { background: #fce4ec; transform: scale(1.03); }
    .ask-btn:active { transform: scale(0.97); }

    .ask-result {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #a1887f;
      min-height: 20px;
    }

    @media (max-width: 480px) {
      .status-time { font-size: 1.9rem; }
      .content { padding: 16px 14px 60px; }
    }
  </style>
  <style>.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}</style>
</head>
<body style="visibility:hidden" onload="document.body.style.visibility='visible'">
  <div class="clouds"></div>
  <script src="assets/js/stars.js?v=3"></script>
  <script src="assets/js/push.js"></script>
  <script src="assets/js/header.js"></script>

  <div class="top-bar">
    <a href="/">← もどる</a>
    <h1>今日の帰宅</h1>
  </div>

  <div class="content">
    <div class="status-cards" id="status-cards">
      <div style="text-align:center;color:#bcaaa4;padding:40px 0">読み込み中...</div>
    </div>

    <div class="ask-section">
      <button class="ask-btn" onclick="askOk()">🐾 行っていい？</button>
      <div class="ask-result" id="ask-result"></div>
    </div>

    <div id="line-messages-section" style="margin-top:24px">
      <h3 style="font-family:'Zen Kurenaido',sans-serif;font-size:1.05rem;color:#e8f4fd;text-align:center;margin-bottom:12px">💬 LINE 最新メッセージ</h3>
      <div id="line-messages-list" style="display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto"></div>

      <!-- 画面上から相手のLINEに返信 -->
      <div style="max-width:520px;margin:12px auto 0;display:flex;gap:8px;align-items:flex-end">
        <textarea id="line-reply-input" placeholder="ここから相手のLINEに返信できるよ" rows="1"
          style="flex:1;padding:10px 12px;background:rgba(255,255,255,0.08);border:1.5px solid rgba(100,180,255,0.25);border-radius:12px;color:#e8f4fd;font-size:15px;font-family:inherit;min-height:42px;max-height:120px;resize:vertical"></textarea>
        <button id="line-reply-btn" onclick="sendLineReply()"
          style="padding:10px 16px;background:rgba(80,180,120,0.25);border:1.5px solid rgba(80,220,120,0.5);color:#baffcc;border-radius:12px;font-family:inherit;font-size:0.9rem;cursor:pointer;white-space:nowrap">📤 送る</button>
      </div>
      <div id="line-reply-status" style="text-align:center;font-size:0.8rem;color:#98bedd;margin-top:6px;min-height:1em"></div>
    </div>
  </div>

  <script>
    let myProfile = null
    let partnerProfile = null
    let myStatus = null

    async function load() {
      const { data: { session } } = await _sb.auth.getSession()
      const myId = session.user.id

      const [{ data: profiles }, { data: statuses }] = await Promise.all([
        _sb.from('profiles').select('*'),
        _sb.from('status').select('*')
      ])

      if (!profiles || profiles.length === 0) {
        document.getElementById('status-cards').innerHTML =
          '<div style="text-align:center;color:#bcaaa4;padding:40px 0">プロフィールが設定されていません</div>'
        return
      }

      myProfile      = profiles.find(p => p.id === myId)
      partnerProfile = profiles.find(p => p.id !== myId)
      myStatus       = statuses?.find(s => s.user_id === myId)
      const partnerStatus = statuses?.find(s => s.user_id !== myId)

      const cards = document.getElementById('status-cards')
      cards.innerHTML = ''
      if (myProfile) cards.appendChild(makeCard(myProfile, myStatus, true))
      if (partnerProfile) cards.appendChild(makeCard(partnerProfile, partnerStatus, false))
      if (!myProfile && !partnerProfile) {
        cards.innerHTML = '<div style="text-align:center;color:#bcaaa4;padding:40px 0">プロフィールが設定されていません</div>'
      }
    }

    function makeCard(profile, status, isMine) {
      const card = document.createElement('div')
      card.className = `status-card ${isMine ? 'mine' : 'partner'}`

      const timeText  = status?.finish_time || ''
      const noteText  = status?.note || ''
      const updatedAt = status?.updated_at
        ? new Date(status.updated_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) + ' 更新'
        : ''

      card.innerHTML = `
        <div class="card-header">
          <span class="card-emoji">${profile.emoji}</span>
          <span class="card-name">${escHtml(profile.name)}${isMine ? '<span class="card-badge">自分</span>' : ''}</span>
        </div>
        <div class="status-time ${timeText ? '' : 'unset'}">${timeText ? timeText + ' 退社' : '未設定'}</div>
        <div class="status-note">${escHtml(noteText)}</div>
        <div class="status-updated">${updatedAt}</div>
        ${isMine ? `
          <button class="edit-btn" onclick="toggleEdit(this)">編集</button>
          <div class="edit-form" id="edit-form">
            <div class="form-row">
              <label>退社時間</label>
              <input type="time" id="input-time" value="${escHtml(timeText)}">
            </div>
            <div class="quick-time-row">
              <button type="button" class="quick-btn" onclick="setQuickTime(30)">+30分</button>
              <button type="button" class="quick-btn" onclick="setQuickTime(60)">+1時間</button>
              <button type="button" class="quick-btn" onclick="setQuickTime(90)">+1.5時間</button>
            </div>
            <div class="form-row">
              <label>メモ</label>
              <input type="text" id="input-note" placeholder="例：ちょっと遅れるかも" maxlength="40" value="${escHtml(noteText)}">
            </div>
            <button class="save-btn" onclick="saveStatus()">保存</button>
          </div>
        ` : ''}
      `
      return card
    }

    function toggleEdit(btn) {
      const form = document.getElementById('edit-form')
      form.classList.toggle('open')
      btn.textContent = form.classList.contains('open') ? '閉じる' : '編集'
    }

    function setQuickTime(minutes) {
      const now = new Date()
      now.setMinutes(now.getMinutes() + minutes)
      const hh = String(now.getHours()).padStart(2, '0')
      const mm = String(now.getMinutes()).padStart(2, '0')
      document.getElementById('input-time').value = `${hh}:${mm}`
    }

    async function saveStatus() {
      const finish_time = document.getElementById('input-time').value
      const note        = document.getElementById('input-note').value.trim()
      const { data: { session } } = await _sb.auth.getSession()
      const user_id = session.user.id

      await _sb.from('status').upsert({ user_id, finish_time, note, updated_at: new Date().toISOString() })
      await load()

      const btn = document.querySelector('.save-btn')
      btn.textContent = '✅ 保存しました'
      btn.disabled = true
      setTimeout(() => { btn.textContent = '保存'; btn.disabled = false }, 1500)

      if (myProfile) {
        const timeLabel = finish_time ? `${finish_time} 退社` : '時間未定'
        const msg = `${myProfile.emoji} ${myProfile.name} の今日の帰宅予定: ${timeLabel}${note ? '（' + note + '）' : ''}`
        // Push通知だけ（LINE群通知は廃止）
        _sb.functions.invoke('send-push', {
          body: {
            title: '🕐 帰宅時間',
            body: msg,
            url: '/status.html',
            sender_user_id: user_id,
          },
        }).then(({ error }) => { if (error) console.error('[status] push error:', error) })
      }
    }

    async function askOk() {
      const result = document.getElementById('ask-result')
      if (!partnerProfile) { result.textContent = 'パートナーのプロフィールが見つかりません'; return }

      result.textContent = '送信中...'
      try {
        const { data: { session } } = await _sb.auth.getSession()
        const { data, error } = await _sb.functions.invoke('send-push', {
          body: {
            title: '🐾 行っていい？',
            body: `${myProfile?.emoji ?? ''} ${myProfile?.name ?? 'あなた'} が行っていいか聞いています`,
            url: '/status.html',
            recipient_user_id: partnerProfile.id,
            ask_ok: true,
            replier_id: session.user.id,
          },
        })
        if (!error) {
          result.textContent = `✅ ${partnerProfile.emoji} ${partnerProfile.name} に送りました！`
        } else {
          let errMsg = error?.message || ''
          try { const j = await error.context?.json?.(); if (j?.error) errMsg = j.error } catch {}
          result.textContent = '❌ 送信失敗: ' + errMsg.slice(0, 80)
        }
      } catch (e) {
        result.textContent = '❌ ネットワークエラー: ' + (e?.message ?? String(e)).slice(0, 80)
      }
      setTimeout(() => { result.textContent = '' }, 8000)
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    async function loadLineMessages() {
      const list = document.getElementById('line-messages-list')
      const { data } = await _sb.from('line_messages')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(10)
      if (!data || data.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:#6a8a9c;font-size:0.85rem;padding:20px 0">まだメッセージはありません</div>'
        return
      }
      list.innerHTML = data.map(m => {
        const time = new Date(m.created_at).toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })
        const badge = m.source_type === 'group' ? '👥' : '💬'
        return `
          <div style="background:rgba(255,255,255,0.08);border:1.5px solid rgba(150,200,255,0.2);border-radius:14px;padding:12px 16px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:0.8rem;color:#98bedd">
              <span>${badge} ${escHtml(m.sender_emoji || '')} ${escHtml(m.sender_name || '匿名')}</span>
              <span style="color:#6a8a9c">${time}</span>
            </div>
            <div style="font-size:0.95rem;color:#e8f4fd;white-space:pre-wrap;word-break:break-word">${escHtml(m.message)}</div>
          </div>
        `
      }).join('')
    }

    // 5秒毎に更新（リアルタイムサブスクリプションでもいいがシンプルに）
    let lineMsgTimer = null
    function startLineMsgPolling() {
      loadLineMessages()
      if (lineMsgTimer) clearInterval(lineMsgTimer)
      lineMsgTimer = setInterval(loadLineMessages, 5000)
    }

    // 画面上から相手のLINE(+Push)に返信を送る
    async function sendLineReply() {
      const input = document.getElementById('line-reply-input')
      const status = document.getElementById('line-reply-status')
      const btn = document.getElementById('line-reply-btn')
      const text = input.value.trim()
      if (!text) return
      if (!myProfile) { status.textContent = 'プロフィール未取得'; return }

      btn.disabled = true
      status.textContent = '送信中…'

      try {
        const { data: { session } } = await _sb.auth.getSession()
        const { data, error } = await _sb.functions.invoke('line-notify', {
          body: {
            sender_id: session.user.id,
            target: 'partner',
            message: `${myProfile.emoji} ${myProfile.name}:\n${text}`,
          },
        })
        if (!error) {
          input.value = ''
          status.textContent = '✅ 送信しました'
          // 自分の line_messages にも記録して自画面に表示
          await _sb.from('line_messages').insert({
            sender_id: myProfile.id,
            sender_name: myProfile.name,
            sender_emoji: myProfile.emoji,
            message: text,
            source_type: 'personal',
          })
          await loadLineMessages()
        } else {
          let errMsg = error?.message || ''
          try { const j = await error.context?.json?.(); if (j?.error) errMsg = j.error } catch {}
          status.textContent = '❌ ' + errMsg.slice(0, 60)
        }
      } catch (e) {
        status.textContent = '❌ ' + (e?.message ?? String(e)).slice(0, 60)
      }
      btn.disabled = false
      setTimeout(() => { if (status.textContent.startsWith('✅')) status.textContent = '' }, 4000)
    }

    load().then(() => { startLineMsgPolling() })
  </script>
</body>
</html>
