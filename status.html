<!DOCTYPE html>
<html lang="ja">
<head>

  <script>
    const _sb = window.supabase.createClient(

    )
    _sb.auth.getSession().then(({ data: { session } }) => {

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #0a1628 0%, #0d2044 40%, #112a5e 100%) fixed; background-attachment: fixed;
      color: #e8f4fd;
      min-height: 100vh;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: linear-gradient(180deg, rgba(26,48,96,0.85) 0%, transparent 100%); backdrop-filter: blur(4px);
    }

    .top-bar a { color: #98bedd; text-decoration: none; font-size: 0.9rem; }
    .top-bar h1 { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.4rem; color: #e8f4fd; }

    .logout-btn {
      background: #fff; border: 2px solid #e8ddd5; color: #8d6e63;
      padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem;
    }

    .top-right { display: flex; align-items: center; gap: 8px; }

    .content {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* ステータスカード */
    .status-cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .status-card {
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(150,200,255,0.18);
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.24);
      backdrop-filter: blur(12px) saturate(1.15);
      -webkit-backdrop-filter: blur(12px) saturate(1.15);
      position: relative;
    }

    .status-card.mine {
      border-color: rgba(140,240,180,0.4);
      box-shadow: 0 4px 20px rgba(0,0,0,0.24), inset 0 0 24px rgba(140,240,180,0.08);
    }

    .status-card.partner {
      border-color: rgba(255,180,199,0.35);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card-emoji { font-size: 2rem; }

    .card-name {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.1rem;
      color: #f0f6ff;
    }

    .card-badge {
      font-size: 0.7rem;
      background: linear-gradient(135deg, rgba(140,240,180,0.35), rgba(140,240,180,0.55));
      color: #eafff0;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 4px;
      border: 1px solid rgba(140,240,180,0.5);
    }

    .status-time {
      font-size: 2.2rem;
      font-family: 'Zen Kurenaido', sans-serif;
      color: #f0f6ff;
      margin-bottom: 4px;
      text-shadow: 0 0 12px rgba(150,210,255,0.28);
    }

    .status-time.unset { font-size: 1.1rem; color: #7aadcc; text-shadow: none; }

    .status-note {
      font-size: 0.85rem;
      color: #98bedd;
      margin-bottom: 8px;
      min-height: 20px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .status-updated {
      font-size: 0.72rem;
      color: #5a7fa8;
    }

    .edit-btn {
      position: absolute;
      top: 16px; right: 16px;
      background: rgba(140,240,180,0.14);
      border: 1.5px solid rgba(140,240,180,0.45);
      color: #baffcc;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      transition: background 0.18s, transform 0.14s;
    }

    .edit-btn:hover  { background: rgba(140,240,180,0.24); }
    .edit-btn:active { transform: scale(0.96); }

    /* 編集フォーム */
    .edit-form {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(150,200,255,0.15);
    }

    .edit-form.open { display: block; }

    .form-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .form-row label {
      font-size: 0.82rem;
      color: #98bedd;
      white-space: nowrap;
      min-width: 56px;
    }

    .form-row input {
      flex: 1 1 auto;
      /* min-width:auto だと input の既定幅(size属性由来)を下回れずカードから突き抜ける */
      min-width: 0;
      width: 100%;
      max-width: 100%;
      padding: 8px 12px;
      background: rgba(0,0,0,0.24);
      border: 1.5px solid rgba(150,200,255,0.28);
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      color: #e8f4fd;
      outline: none;
    }

    .form-row input:focus { border-color: rgba(140,240,180,0.6); }

    /* メモ: ラベルを上に置いて横幅いっぱいの textarea */
    .form-row.stack {
      display: block;
      margin-bottom: 10px;
    }
    .form-row.stack label { display: block; margin-bottom: 6px; }

    .note-input {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 72px;
      resize: vertical;
      padding: 10px 12px;
      background: rgba(0,0,0,0.24);
      border: 1.5px solid rgba(150,200,255,0.28);
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.6;
      color: #e8f4fd;
      outline: none;
    }
    .note-input:focus { border-color: rgba(140,240,180,0.6); }

    .note-count {
      margin-top: 4px;
      text-align: right;
      font-size: 0.72rem;
      color: #5a7fa8;
    }
    .note-count.over { color: #ffa0a0; }

    .save-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #58c58f, #6fd8a0);
      color: #04150c;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.14s, box-shadow 0.18s;
      box-shadow: 0 4px 16px rgba(80,200,140,0.28);
    }

    .save-btn:hover  { box-shadow: 0 6px 22px rgba(80,200,140,0.42); }
    .save-btn:active { transform: scale(0.97); }

    .quick-time-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .quick-btn {
      flex: 1;
      padding: 9px 0;
      background: rgba(140,240,180,0.10);
      border: 1.5px solid rgba(140,240,180,0.32);
      color: #baffcc;
      border-radius: 10px;
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, transform 0.14s;
    }

    .quick-btn:hover  { background: rgba(140,240,180,0.20); }
    .quick-btn:active { transform: scale(0.96); }

    /* 「行っていい？」「来ていいよ」ボタン */
    .ask-section {
      text-align: center;
      margin-top: 8px;
    }
    .ask-row {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    }

    .ask-btn {
      background: linear-gradient(135deg, rgba(244,143,177,0.24), rgba(233,30,99,0.28));
      border: 1.5px solid rgba(244,143,177,0.55);
      color: #ffd0e0;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.14s, box-shadow 0.18s, background 0.18s;
      box-shadow: 0 4px 20px rgba(233,30,99,0.28);
      backdrop-filter: blur(6px);
    }

    .ask-btn.invite {
      background: linear-gradient(135deg, rgba(140,200,255,0.24), rgba(80,140,255,0.28));
      border-color: rgba(140,200,255,0.55);
      color: #d0e8ff;
      box-shadow: 0 4px 20px rgba(80,140,255,0.28);
    }

    .ask-btn.ok {
      background: linear-gradient(135deg, rgba(140,240,180,0.24), rgba(80,200,130,0.30));
      border-color: rgba(140,240,180,0.55);
      color: #c4f5da;
      box-shadow: 0 4px 20px rgba(80,200,130,0.28);
      width: 100%;
    }
    .ask-btn:hover { background: linear-gradient(135deg, rgba(244,143,177,0.35), rgba(233,30,99,0.4)); transform: scale(1.03); }
    .ask-btn.invite:hover { background: linear-gradient(135deg, rgba(140,200,255,0.35), rgba(80,140,255,0.4)); }
    .ask-btn.ok:hover { background: linear-gradient(135deg, rgba(140,240,180,0.35), rgba(80,200,130,0.42)); }
    .ask-btn:active { transform: scale(0.97); }

    /* 操作の記録 */
    .status-log-title {
      font-family: 'Zen Kurenaido', sans-serif; font-size: 1.05rem; color: #e8f4fd;
      text-align: center; margin-bottom: 12px;
    }
    .status-log-list { display: flex; flex-direction: column; gap: 8px; max-width: 520px; margin: 0 auto; }
    .status-log-item {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(150,200,255,0.14);
      border-radius: 12px; padding: 10px 14px;
    }
    .status-log-emoji { font-size: 1.15rem; flex-shrink: 0; }
    .status-log-text { flex: 1; font-size: 0.9rem; color: #e8f4fd; }
    .status-log-time { font-size: 0.72rem; color: #7aadcc; flex-shrink: 0; white-space: nowrap; }
    .status-log-empty { text-align: center; color: #6a8a9c; font-size: 0.85rem; padding: 16px 0; }

    .ask-result {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #98bedd;
      min-height: 20px;
    }

    .status-action-row {
      display: flex; gap: 10px; justify-content: center; margin-top: 14px;
    }
    .status-action-btn {
      flex: 1; max-width: 160px;
      padding: 12px 8px; border-radius: 24px;
      font-family: inherit; font-size: 0.95rem; font-weight: bold; cursor: pointer;
      transition: all 0.18s; border: 1.5px solid;
      backdrop-filter: blur(6px);
    }
    .status-action-btn:active { transform: scale(0.96); }
    .btn-late {
      background: linear-gradient(135deg, rgba(255,167,38,0.22), rgba(255,140,50,0.32));
      border-color: rgba(255,180,80,0.6);
      color: #ffd7a3;
      box-shadow: 0 4px 16px rgba(230,120,40,0.28);
    }
    .btn-late:hover { background: linear-gradient(135deg, rgba(255,167,38,0.32), rgba(255,140,50,0.42)); }
    .btn-left {
      background: linear-gradient(135deg, rgba(96,165,250,0.2), rgba(96,165,250,0.32));
      border-color: rgba(144,202,249,0.6);
      color: #cfe6ff;
      box-shadow: 0 4px 16px rgba(21,101,192,0.28);
    }
    .btn-left:hover { background: linear-gradient(135deg, rgba(96,165,250,0.3), rgba(96,165,250,0.42)); }
    .btn-home {
      background: linear-gradient(135deg, rgba(140,240,180,0.18), rgba(140,240,180,0.32));
      border-color: rgba(140,240,180,0.6);
      color: #d6ffe4;
      box-shadow: 0 4px 16px rgba(46,125,50,0.28);
    }
    .btn-home:hover { background: linear-gradient(135deg, rgba(140,240,180,0.28), rgba(140,240,180,0.42)); }

    @media (max-width: 480px) {
      .status-time { font-size: 1.9rem; }
      .content { padding: 16px 14px 60px; }
    }
  </style>
  <style>.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}</style>

<body style="visibility:hidden" onload="document.body.style.visibility='visible'">
  <div class="clouds"></div>
  <script src="assets/js/stars.js?v=3"></script>
  <script src="assets/js/push.js"></script>
  <script src="assets/js/util.js"></script>
  <script src="assets/js/header.js"></script>
  <script src="assets/js/nav.js"></script>

  <div class="top-bar">
    <a href="/">← もどる</a>
    <h1>今日の帰宅</h1>
  </div>

  <div class="content">
    <div class="status-cards" id="status-cards">
      <div style="text-align:center;color:#7aadcc;padding:40px 0">読み込み中...</div>
    </div>

    <div class="ask-section">
      <div class="ask-row">
        <button class="ask-btn" onclick="askOk()">🐾 行きたい</button>
        <button class="ask-btn invite" onclick="inviteCome()">🏠 来てほしい</button>
      </div>
      <div class="ask-row" style="margin-top:10px">
        <button class="ask-btn ok" onclick="sayOk()">👌 いいよ</button>
      </div>
      <div class="ask-result" id="ask-result"></div>
    </div>
    <div class="status-action-row">
      <button class="status-action-btn btn-late" onclick="sendStatusEvent('late')">⏰ 遅れそう</button>
      <button class="status-action-btn btn-left" onclick="sendStatusEvent('left')">🏃 会社出た</button>
      <button class="status-action-btn btn-home" onclick="sendStatusEvent('home')">🏠 帰宅</button>
    </div>
    <div id="status-event-result" style="text-align:center;margin-top:10px;font-size:0.85rem;color:#a1887f;min-height:18px"></div>

    <!-- 操作の記録 -->
    <div id="status-log-section" style="margin-top:24px">
      <div class="status-log-title">🕘 きろく</div>
      <div id="status-log-list" class="status-log-list">
        <div class="status-log-empty">読み込み中...</div>
      </div>
    </div>
  </div>

  <script>
    let myProfile = null
    let partnerProfile = null
    let myStatus = null

    // 操作の記録: 種類ごとの絵文字とラベル
    const EVENT_META = {
      set_time:  { emoji: '🕐', label: '帰宅時間を設定' },
      late:      { emoji: '⏰', label: '遅れそう' },
      left:      { emoji: '🏃', label: '会社を出た' },
      home:      { emoji: '🏠', label: '帰宅した' },
      want_go:   { emoji: '🐾', label: '行きたい' },
      want_come: { emoji: '🏠', label: '来てほしい' },
      ok:        { emoji: '👌', label: 'いいよ' },
    }

    async function logStatusEvent(kind, detail) {
      try {
        const { data: { session } } = await _sb.auth.getSession()
        if (!session) return
        await _sb.from('status_events').insert({ user_id: session.user.id, kind, detail: detail ?? null })
        loadStatusLog()
      } catch (e) { console.error('[status] log failed:', e) }
    }

    async function loadStatusLog() {
      const el = document.getElementById('status-log-list')
      if (!el) return
      const { data, error } = await _sb.from('status_events')
        .select('*').order('created_at', { ascending: false }).limit(30)
      if (error) { el.innerHTML = '<div class="status-log-empty">読み込みに失敗しました</div>'; return }
      if (!data || !data.length) { el.innerHTML = '<div class="status-log-empty">まだ記録はありません</div>'; return }
      const profById = {}
      if (myProfile) profById[myProfile.id] = myProfile
      if (partnerProfile) profById[partnerProfile.id] = partnerProfile
      el.innerHTML = data.map(ev => {
        const m = EVENT_META[ev.kind] || { emoji: '•', label: ev.kind }
        const who = profById[ev.user_id]
        const whoLabel = who ? `${who.emoji} ${escHtml(who.name)}` : ''
        const t = new Date(ev.created_at).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        const detail = ev.detail ? `（${escHtml(ev.detail)}）` : ''
        return `<div class="status-log-item">
          <span class="status-log-emoji">${m.emoji}</span>
          <span class="status-log-text">${whoLabel} が ${m.label}${detail}</span>
          <span class="status-log-time">${t}</span>
        </div>`
      }).join('')
    }

    async function load() {
      const { data: { session } } = await _sb.auth.getSession()
      const myId = session.user.id

      const [{ data: profiles }, { data: statuses }] = await Promise.all([
        _sb.from('profiles').select('*'),
        _sb.from('status').select('*')
      ])

      if (!profiles || profiles.length === 0) {
        document.getElementById('status-cards').innerHTML =
          '<div style="text-align:center;color:#7aadcc;padding:40px 0">プロフィールが設定されていません</div>'
        return
      }

      myProfile      = profiles.find(p => p.id === myId)
      partnerProfile = profiles.find(p => p.id !== myId)
      myStatus       = statuses?.find(s => s.user_id === myId)
      const partnerStatus = statuses?.find(s => s.user_id !== myId)

      const cards = document.getElementById('status-cards')
      cards.innerHTML = ''
      if (myProfile) cards.appendChild(makeCard(myProfile, myStatus, true))
      if (partnerProfile) cards.appendChild(makeCard(partnerProfile, partnerStatus, false))
      if (!myProfile && !partnerProfile) {
        cards.innerHTML = '<div style="text-align:center;color:#7aadcc;padding:40px 0">プロフィールが設定されていません</div>'
      }

      updateNoteCount()
      loadStatusLog()
    }

    function makeCard(profile, status, isMine) {
      const card = document.createElement('div')
      card.className = `status-card ${isMine ? 'mine' : 'partner'}`

      const timeText  = status?.finish_time || ''
      const noteText  = status?.note || ''
      const updatedAt = status?.updated_at
        ? new Date(status.updated_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) + ' 更新'
        : ''

      card.innerHTML = `
        <div class="card-header">
          <span class="card-emoji">${profile.emoji}</span>
          <span class="card-name">${escHtml(profile.name)}${isMine ? '<span class="card-badge">自分</span>' : ''}</span>
        </div>
        <div class="status-time ${timeText ? '' : 'unset'}">${timeText ? timeText + ' 退社' : '未設定'}</div>
        <div class="status-note">${escHtml(noteText)}</div>
        <div class="status-updated">${updatedAt}</div>
        ${isMine ? `
          <button class="edit-btn" onclick="toggleEdit(this)">編集</button>
          <div class="edit-form" id="edit-form">
            <div class="form-row">
              <label>退社時間</label>
              <input type="time" id="input-time" value="${escHtml(timeText)}">
            </div>
            <div class="quick-time-row">
              <button type="button" class="quick-btn" onclick="setTimeExact('19:00')">19:00</button>
              <button type="button" class="quick-btn" onclick="setTimeExact('22:00')">22:00</button>
              <button type="button" class="quick-btn" onclick="adjustTime(-30)">−30分</button>
              <button type="button" class="quick-btn" onclick="adjustTime(30)">+30分</button>
            </div>
            <div class="form-row stack">
              <label>メモ</label>
              <textarea id="input-note" class="note-input" placeholder="例：ちょっと遅れるかも / 途中でスーパー寄るね" maxlength="300" oninput="updateNoteCount()">${escHtml(noteText)}</textarea>
              <div class="note-count" id="note-count"></div>
            </div>
            <button class="save-btn" onclick="saveStatus()">保存</button>
          </div>
        ` : ''}
      `
      return card
    }

    function toggleEdit(btn) {
      const form = document.getElementById('edit-form')
      form.classList.toggle('open')
      btn.textContent = form.classList.contains('open') ? '閉じる' : '編集'
    }

    const NOTE_MAX = 300
    function updateNoteCount() {
      const ta = document.getElementById('input-note')
      const el = document.getElementById('note-count')
      if (!ta || !el) return
      const n = ta.value.length
      el.textContent = `${n} / ${NOTE_MAX}`
      el.classList.toggle('over', n >= NOTE_MAX)
    }

    // 直接指定（例: 19:00 ボタン）
    function setTimeExact(hhmm) {
      document.getElementById('input-time').value = hhmm
    }
    // 入力欄の値を分単位で加減（現在時刻ではなく入力に対して）
    function adjustTime(deltaMin) {
      const inp = document.getElementById('input-time')
      let base = inp.value
      // 未入力なら 20:00 スタート
      if (!base) base = '20:00'
      const [h, m] = base.split(':').map(Number)
      let total = h * 60 + m + deltaMin
      // 0..24*60 にクランプ
      if (total < 0) total = 0
      if (total > 23 * 60 + 59) total = 23 * 60 + 59
      const nh = String(Math.floor(total / 60)).padStart(2, '0')
      const nm = String(total % 60).padStart(2, '0')
      inp.value = `${nh}:${nm}`
    }

    async function saveStatus() {
      const finish_time = document.getElementById('input-time').value
      const note        = document.getElementById('input-note').value.trim()
      const { data: { session } } = await _sb.auth.getSession()
      const user_id = session.user.id

      await _sb.from('status').upsert({ user_id, finish_time, note, updated_at: new Date().toISOString() })
      logStatusEvent('set_time', finish_time ? `${finish_time} 退社` : '時間未定')
      await load()

      const btn = document.querySelector('.save-btn')
      btn.textContent = '✅ 保存しました'
      btn.disabled = true
      setTimeout(() => { btn.textContent = '保存'; btn.disabled = false }, 1500)

      if (myProfile) {
        const timeLabel = finish_time ? `${finish_time} 退社` : '時間未定'
        const msg = `${myProfile.emoji} ${myProfile.name} の今日の帰宅予定: ${timeLabel}${note ? '（' + note + '）' : ''}`
        // LINE + Push（line-notify が両方送る）
        _sb.functions.invoke('line-notify', {
          body: { sender_id: user_id, target: 'partner', message: msg },
        }).then(({ error }) => {
          if (error) {
            // LINE失敗時はpush通知だけ
            _sb.functions.invoke('send-push', {
              body: { title: '🕐 帰宅時間', body: msg, url: '/status.html', sender_user_id: user_id },
            })
          }
        })
      }
    }

    async function sendStatusEvent(type) {
      if (!myProfile) return
      const { data: { session } } = await _sb.auth.getSession()
      const labels = {
        late: `${myProfile.emoji} ${myProfile.name} は予定より遅れそう ⏰`,
        left: `${myProfile.emoji} ${myProfile.name} が会社を出ました 🏃`,
        home: `${myProfile.emoji} ${myProfile.name} が帰宅しました 🏠`,
      }
      const titles = { late: '⏰ 遅れそう', left: '🏃 会社出た', home: '🏠 帰宅' }
      const msg = labels[type]
      const resultEl = document.getElementById('status-event-result')
      resultEl.textContent = '送信中...'

      // 全イベント Push 通知のみ (LINE は月間上限節約のため帰宅時間設定と券使用だけに限定 2026-07)
      await notify({ title: titles[type], body: msg, url: '/status.html', kind: 'status', sender: session.user.id })
      logStatusEvent(type)
      resultEl.textContent = '✅ 送りました！'
      setTimeout(() => { resultEl.textContent = '' }, 4000)
    }

    async function askOk() {
      const result = document.getElementById('ask-result')
      if (!partnerProfile) { result.textContent = 'パートナーのプロフィールが見つかりません'; return }

      result.textContent = '送信中...'
      try {
        const { data: { session } } = await _sb.auth.getSession()
        const { data, error } = await _sb.functions.invoke('send-push', {
          body: {
            title: '🐾 行きたい',
            body: `${myProfile?.emoji ?? ''} ${myProfile?.name ?? 'あなた'} が行きたいって`,
            url: '/status.html',
            recipient_user_id: partnerProfile.id,
            ask_ok: true,
            replier_id: session.user.id,
          },
        })
        if (!error) {
          logStatusEvent('want_go')
          result.textContent = `✅ ${partnerProfile.emoji} ${partnerProfile.name} に送りました！`
        } else {
          let errMsg = error?.message || ''
          try { const j = await error.context?.json?.(); if (j?.error) errMsg = j.error } catch {}
          result.textContent = '❌ 送信失敗: ' + errMsg.slice(0, 80)
        }
      } catch (e) {
        result.textContent = '❌ ネットワークエラー: ' + (e?.message ?? String(e)).slice(0, 80)
      }
      setTimeout(() => { result.textContent = '' }, 8000)
    }

    async function inviteCome() {
      const result = document.getElementById('ask-result')
      if (!partnerProfile) { result.textContent = 'パートナーのプロフィールが見つかりません'; return }

      result.textContent = '送信中...'

          body: {
            title: '🏠 来てほしい',
            body: `${myProfile?.emoji ?? ''} ${myProfile?.name ?? 'あなた'} が来てほしいって`,
            url: '/status.html',
            recipient_user_id: partnerProfile.id,
            sender_user_id: session.user.id,
            kind: 'status',
          },
        })
        if (!error) {
          logStatusEvent('want_come')
          result.textContent = `✅ ${partnerProfile.emoji} ${partnerProfile.name} に送りました！`
        } else {
          let errMsg = error?.message || ''
          try { const j = await error.context?.json?.(); if (j?.error) errMsg = j.error } catch {}
          result.textContent = '❌ 送信失敗: ' + errMsg.slice(0, 80)
        }
      } catch (e) {
        result.textContent = '❌ ネットワークエラー: ' + (e?.message ?? String(e)).slice(0, 80)
      }
      setTimeout(() => { result.textContent = '' }, 8000)
    }

    async function sayOk() {
      const result = document.getElementById('ask-result')
      if (!partnerProfile) { result.textContent = 'パートナーのプロフィールが見つかりません'; return }

      result.textContent = '送信中...'
      try {
        const { data: { session } } = await _sb.auth.getSession()
        const { error } = await _sb.functions.invoke('send-push', {
          body: {
            title: '👌 いいよ',
            body: `${myProfile?.emoji ?? ''} ${myProfile?.name ?? 'あなた'} が いいよ！って`,
            url: '/status.html',
            recipient_user_id: partnerProfile.id,
            sender_user_id: session.user.id,
            kind: 'status',
          },
        })
        if (!error) {
          logStatusEvent('ok')
          result.textContent = `✅ ${partnerProfile.emoji} ${partnerProfile.name} に送りました！`
        } else {
          let errMsg = error?.message || ''
          try { const j = await error.context?.json?.(); if (j?.error) errMsg = j.error } catch {}
          result.textContent = '❌ 送信失敗: ' + errMsg.slice(0, 80)
        }
      } catch (e) {
        result.textContent = '❌ ネットワークエラー: ' + (e?.message ?? String(e)).slice(0, 80)
      }
      setTimeout(() => { result.textContent = '' }, 8000)
    }

    load()
  </script>
