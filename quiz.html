  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #0a1628 0%, #0d2044 40%, #112a5e 100%) fixed;
      background-attachment: fixed;
      color: #e8f0fc;
      min-height: 100vh;
      font-size: 16px;
    }

    /* ---------- top bar ---------- */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: linear-gradient(180deg, rgba(26,48,96,0.85) 0%, transparent 100%);
      backdrop-filter: blur(4px);
      position: relative;
      z-index: 1;
    }

    .top-bar a { color: #98bedd; text-decoration: none; font-size: 0.9rem; }
    .top-bar h1 { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.4rem; color: #e8f4fd; }

    .top-right { display: flex; align-items: center; gap: 8px; }

    .user-badge {
      display: none;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(150,200,255,0.3);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.85rem;
      color: #e8f4fd;
    }

    /* ---------- content ---------- */
    .content {
      max-width: 540px;
      margin: 0 auto;
      padding: 24px 20px 80px;
      position: relative;
      z-index: 1;
    }

    /* ---------- today question card ---------- */
    .today-card {
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(212,175,55,0.55);
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 32px;
      box-shadow: 0 0 28px rgba(212,175,55,0.1), 0 4px 16px rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
    }

    .today-label {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 0.78rem;
      color: rgba(212,175,55,0.8);
      letter-spacing: 0.1em;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    /* ---------- category badge ---------- */
    .cat-badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: bold;
      margin-bottom: 14px;
      letter-spacing: 0.05em;
    }

    .cat-today   { background: rgba(100,200,120,0.25); color: #7de8a0; border: 1px solid rgba(100,200,120,0.4); }
    .cat-partner { background: rgba(200,130,255,0.2);  color: #d4a0ff; border: 1px solid rgba(200,130,255,0.35); }
    .cat-self    { background: rgba(80,180,240,0.2);   color: #80d4f8; border: 1px solid rgba(80,180,240,0.35); }
    .cat-couple  { background: rgba(255,130,160,0.2);  color: #ffaac8; border: 1px solid rgba(255,130,160,0.35); }
    .cat-fun     { background: rgba(255,200,80,0.2);   color: #ffd068; border: 1px solid rgba(255,200,80,0.35); }

    .question-text {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #e8f4fd;
      margin-bottom: 20px;
    }

    /* ---------- answer input ---------- */
    .answer-textarea {
      width: 100%;
      min-height: 80px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(150,200,255,0.3);
      border-radius: 12px;
      color: #e8f4fd;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    .answer-textarea:focus { border-color: rgba(150,200,255,0.7); background: rgba(255,255,255,0.12); }
    .answer-textarea::placeholder { color: #5a7fa8; }

    /* ---------- choice buttons ---------- */
    .choice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 4px;
    }

    .choice-btn {
      flex: 1;
      min-width: 44px;
      min-height: 52px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(150,200,255,0.25);
      border-radius: 12px;
      color: #c8dff8;
      font-size: 1.05rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      text-align: center;
      line-height: 1.3;
      -webkit-tap-highlight-color: transparent;
    }

    .choice-btn:active { transform: scale(0.94); }

    .choice-btn.selected {
      background: rgba(212,175,55,0.28);
      border-color: rgba(212,175,55,0.7);
      color: #ffd764;
    }

    /* ---------- submit button ---------- */
    .submit-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: linear-gradient(135deg, #b8860b, #daa520);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 0.05em;
      transition: opacity 0.2s, transform 0.1s;
      min-height: 52px;
      -webkit-tap-highlight-color: transparent;
    }

    .submit-btn:active { transform: scale(0.97); }
    .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* ---------- answered state ---------- */
    .answered-section { display: none; }

    .answer-reveal {
      background: rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .answer-reveal-label {
      font-size: 0.78rem;
      color: rgba(180,210,255,0.6);
      margin-bottom: 6px;
    }

    .answer-reveal-text {
      font-size: 1rem;
      color: #e8f4fd;
      line-height: 1.5;
    }

    .partner-waiting {
      text-align: center;
      font-size: 0.9rem;
      color: #5a7fa8;
      padding: 10px 0 4px;
    }

    /* ---------- history section ---------- */
    .section-title {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.25rem;
      color: #e8f4fd;
      margin-bottom: 16px;
      padding-left: 12px;
      border-left: 4px solid rgba(212,175,55,0.6);
    }

    .history-list { display: flex; flex-direction: column; gap: 14px; }

    .history-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(100,150,220,0.2);
      border-radius: 16px;
      padding: 16px 18px;
      backdrop-filter: blur(4px);
    }

    .history-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .history-date {
      font-size: 0.78rem;
      color: #5a7fa8;
      margin-left: auto;
    }

    .history-question {
      font-size: 0.92rem;
      color: #98bedd;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .history-answers {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-answer {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .history-answer-who {
      font-size: 0.75rem;
      color: rgba(180,210,255,0.55);
      margin-bottom: 3px;
    }

    .history-answer-text {
      font-size: 0.95rem;
      color: #c8dff8;
    }

    .empty-msg {
      text-align: center;
      color: #5a7fa8;
      padding: 32px 0;
      font-size: 0.95rem;
    }

    /* ---------- toast ---------- */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: linear-gradient(135deg, rgba(30,60,120,0.96), rgba(20,40,90,0.96));
      border: 1.5px solid rgba(212,175,55,0.5);
      color: #ffd764;
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-family: inherit;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ---------- error toast ---------- */
    .toast.error {
      border-color: rgba(255,100,100,0.5);
      color: #ff9a9a;
    }

    /* ---------- loading skeleton ---------- */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
      height: 20px;
      margin-bottom: 8px;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ---------- responsive ---------- */
    @media (max-width: 480px) {
      .top-bar { padding: 12px 14px; }
      .top-bar h1 { font-size: 1.15rem; }
      .content { padding: 16px 14px 80px; }
      .question-text { font-size: 1.05rem; }
      .choice-btn { font-size: 0.95rem; }
    }
  </style>
</head>
<body style="visibility:hidden" onload="document.body.style.visibility='visible'">
  <div class="clouds"></div>
  <script src="assets/js/stars.js?v=3"></script>
  <script src="assets/js/push.js"></script>
  <script src="assets/js/util.js"></script>
  <script src="assets/js/header.js"></script>
  <script src="assets/js/nav.js"></script>

  <div class="top-bar">
    <a href="/index.html">← ホーム</a>
    <h1>💬 今日のクイズ</h1>
  </div>

  <div class="content">
    <!-- 今日の質問 -->
    <div class="today-card" id="today-card">
      <div class="today-label">TODAY'S QUESTION</div>
      <div id="today-loading">
        <div class="skeleton" style="width:60%;height:16px"></div>
        <div class="skeleton" style="width:90%;height:22px;margin-top:12px"></div>
        <div class="skeleton" style="width:100%;height:80px;margin-top:16px"></div>
      </div>

      <!-- 未回答時 -->
      <div id="unanswered-section" style="display:none">
        <span class="cat-badge" id="cat-badge"></span>
        <div class="question-text" id="question-text"></div>

        <!-- テキスト入力 -->
        <div id="text-input-wrap">
          <textarea class="answer-textarea" id="answer-textarea" placeholder="答えを入力..." rows="3"></textarea>
        </div>

        <!-- 選択肢 -->
        <div id="choice-wrap" style="display:none">
          <div class="choice-row" id="choice-row"></div>
          <input type="hidden" id="choice-value">
        </div>

        <button class="submit-btn" id="submit-btn" onclick="submitAnswer()">答える &nbsp;(+10pt)</button>
      </div>

      <!-- 回答済み時 -->
      <div id="answered-section" class="answered-section">
        <span class="cat-badge" id="ans-cat-badge"></span>
        <div class="question-text" id="ans-question-text"></div>

        <div class="answer-reveal">
          <div class="answer-reveal-label" id="ans-my-label">あなたの回答</div>
          <div class="answer-reveal-text" id="ans-my-text"></div>
        </div>

        <div id="partner-answer-wrap">
          <div class="answer-reveal" id="partner-answer-reveal" style="display:none">
            <div class="answer-reveal-label" id="ans-partner-label">相手の回答</div>
            <div class="answer-reveal-text" id="ans-partner-text"></div>
          </div>
          <div class="partner-waiting" id="partner-waiting">⏳ 相手の回答待ち...</div>
        </div>
      </div>
    </div>

    <!-- 過去の回答履歴 -->
    <h2 class="section-title">📖 過去の質問</h2>
    <div id="history-list" class="history-list">
      <div class="empty-msg">読み込み中...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ================================================================
    // 質問プール (30問)
    // ================================================================
    const QUESTIONS = [
      { id:1,  cat:'today',   q:'今日のテンション、5段階で言うと？',           type:'choice', opts:['😭','😔','😐','😊','🥰'] },
      { id:2,  cat:'today',   q:'今日一番嬉しかったことは？',                   type:'text' },
      { id:3,  cat:'today',   q:'今日食べた中で一番おいしかったものは？',        type:'text' },
      { id:4,  cat:'today',   q:'今日の「よく頑張った」度は？',                 type:'choice', opts:['1','2','3','4','5'] },
      { id:5,  cat:'today',   q:'今日何かひとつ発見したことは？',               type:'text' },
      { id:6,  cat:'partner', q:'相手が今一番行きたい場所はどこだと思う？',     type:'text' },
      { id:7,  cat:'partner', q:'相手の好きな食べ物、3つ言える？',              type:'text' },
      { id:8,  cat:'partner', q:'相手が最近ハマっていることは？',               type:'text' },
      { id:9,  cat:'partner', q:'相手がストレスを感じるとどうすると思う？',      type:'text' },
      { id:10, cat:'partner', q:'相手の一番の長所は？',                         type:'text' },
      { id:11, cat:'partner', q:'相手が喜ぶプレゼント、何だと思う？',           type:'text' },
      { id:12, cat:'partner', q:'相手が一番好きな季節は？',                     type:'choice', opts:['春🌸','夏☀️','秋🍂','冬❄️'] },
      { id:13, cat:'self',    q:'最近気になっているお店やカフェは？',            type:'text' },
      { id:14, cat:'self',    q:'今一番やってみたいことは？',                   type:'text' },
      { id:15, cat:'self',    q:'最近の小さな幸せは？',                         type:'text' },
      { id:16, cat:'self',    q:'今の気持ちを天気に例えると？',                 type:'choice', opts:['☀️快晴','🌤うす曇','⛅曇り','🌧雨','🌩嵐'] },
      { id:17, cat:'self',    q:'最近ちょっと後悔したことは？',                 type:'text' },
      { id:18, cat:'couple',  q:'一緒に行きたい旅行先は？',                     type:'text' },
      { id:19, cat:'couple',  q:'2人で挑戦したいことは？',                      type:'text' },
      { id:20, cat:'couple',  q:'ふたりの思い出で一番好きなシーンは？',          type:'text' },
      { id:21, cat:'couple',  q:'今の2人の関係を一言で表すと？',                type:'text' },
      { id:22, cat:'couple',  q:'次のデートでやってみたいことは？',              type:'text' },
      { id:23, cat:'couple',  q:'相手に伝えたいけど言えてないことは？',          type:'text' },
      { id:24, cat:'couple',  q:'2人のあいだの「あるある」は？',                type:'text' },
      { id:25, cat:'fun',     q:'もし今日1日動物だったら何になりたい？',         type:'text' },
      { id:26, cat:'fun',     q:'無人島に1つだけ持っていくとしたら？',           type:'text' },
      { id:27, cat:'fun',     q:'前世は何だったと思う？',                        type:'text' },
      { id:28, cat:'fun',     q:'100万円あったら何する？',                       type:'text' },
      { id:29, cat:'fun',     q:'理想の休日の過ごし方は？',                      type:'text' },
      { id:30, cat:'fun',     q:'最近見た夢で覚えているものは？',                type:'text' },
    ]

    const CAT_LABEL = {
      today:   '今日のこと',
      partner: '相手のこと',
      self:    '自分のこと',
      couple:  'ふたりのこと',
      fun:     '楽しい質問',
    }

    // ================================================================
    // State
    // ================================================================
    let myId        = null
    let partnerId   = null
    let myProfile   = null
    let partnerProfile = null
    let todayQuestion  = null
    let todayDateStr   = null

    // ================================================================
    // Helpers
    // ================================================================
    function escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
    }

    function todayStr() {
      return new Date().toLocaleDateString('sv-SE') // YYYY-MM-DD
    }

    function getDailyQuestion(dateStr) {
      const seed = parseInt(dateStr.replace(/-/g, ''), 10)
      const idx  = seed % QUESTIONS.length
      return QUESTIONS[idx]
    }

    function catBadgeHtml(cat) {
      return `<span class="cat-badge cat-${cat}">${CAT_LABEL[cat] ?? cat}</span>`
    }

    let toastTimer = null
    function showToast(msg, isError = false) {
      const el = document.getElementById('toast')
      el.textContent  = msg
      el.className    = 'toast' + (isError ? ' error' : '')
      void el.offsetWidth
      el.classList.add('show')
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => el.classList.remove('show'), 2800)
    }

    // ================================================================
    // Submit answer
    // ================================================================
    async function submitAnswer() {
      const q = todayQuestion
      if (!q) return

      let answer = ''
      if (q.type === 'choice') {
        answer = document.getElementById('choice-value').value
        if (!answer) { showToast('選択肢を選んでください', true); return }
      } else {
        answer = document.getElementById('answer-textarea').value.trim()
        if (!answer) { showToast('答えを入力してください', true); return }
      }

      const btn = document.getElementById('submit-btn')
      btn.disabled = true
      btn.textContent = '送信中...'

      try {
        const dateStr = todayDateStr

        // quiz_answers insert
        const { error: qaErr } = await _sb.from('quiz_answers').insert({
          user_id:     myId,
          question_id: q.id,
          answer:      answer,
          date_str:    dateStr,
          answered_at: new Date().toISOString(),
        })
        if (qaErr) throw qaErr

        // points insert
        const { error: ptErr } = await _sb.from('points').insert({
          user_id:    myId,
          amount:     10,
          reason:     'quiz',
          created_at: new Date().toISOString(),
        })
        if (ptErr) console.error('points insert error:', ptErr)

        // 相手に push
        _sb.functions.invoke('send-push', {
          body: {
            title: '💬 クイズに回答したよ',
            body: '今日の質問への回答を見てみよう',
            url: '/quiz.html',
            sender_user_id: myId,
          },
        }).then(({ error }) => { if (error) console.error('[quiz] push error:', error) })

        showToast('✨ +10pt 獲得！')
        await renderTodayAnswered(answer)
        loadHistory()
      } catch (err) {
        console.error('submitAnswer error:', err)
        showToast('送信に失敗しました', true)
        btn.disabled    = false
        btn.textContent = '答える　(+10pt)'
      }
    }

    // ================================================================
    // Render today card — answered state
    // ================================================================
    async function renderTodayAnswered(myAnswer) {
      const q = todayQuestion

      document.getElementById('today-loading').style.display     = 'none'
      document.getElementById('unanswered-section').style.display = 'none'
      document.getElementById('answered-section').style.display  = 'block'

      document.getElementById('ans-cat-badge').outerHTML =
        `<span class="cat-badge cat-${q.cat}" id="ans-cat-badge">${CAT_LABEL[q.cat] ?? q.cat}</span>`
      document.getElementById('ans-question-text').textContent = q.q

      const myLabel = myProfile ? `${myProfile.emoji} ${escHtml(myProfile.name)}` : 'あなたの回答'
      document.getElementById('ans-my-label').textContent  = myLabel
      document.getElementById('ans-my-text').textContent   = myAnswer

      // Load partner answer
      const { data: partnerRows } = await _sb
        .from('quiz_answers')
        .select('answer')
        .eq('question_id', q.id)
        .eq('date_str', todayDateStr)
        .eq('user_id', partnerId)
        .limit(1)

      const partnerReveal  = document.getElementById('partner-answer-reveal')
      const partnerWaiting = document.getElementById('partner-waiting')

      if (partnerRows && partnerRows.length > 0) {
        const partnerLabel = partnerProfile ? `${partnerProfile.emoji} ${escHtml(partnerProfile.name)}` : '相手の回答'
        document.getElementById('ans-partner-label').textContent = partnerLabel
        document.getElementById('ans-partner-text').textContent  = partnerRows[0].answer
        partnerReveal.style.display  = 'block'
        partnerWaiting.style.display = 'none'
      } else {
        partnerReveal.style.display  = 'none'
        partnerWaiting.style.display = 'block'
      }
    }

    // ================================================================
    // Load today question
    // ================================================================
    async function loadToday() {
      todayDateStr   = todayStr()
      todayQuestion  = getDailyQuestion(todayDateStr)
      const q        = todayQuestion

      // Check if already answered today
      const { data: myRows, error } = await _sb
        .from('quiz_answers')
        .select('answer')
        .eq('user_id', myId)
        .eq('question_id', q.id)
        .eq('date_str', todayDateStr)
        .limit(1)

      if (error) console.error('loadToday error:', error)

      if (myRows && myRows.length > 0) {
        // Already answered
        await renderTodayAnswered(myRows[0].answer)
        return
      }

      // Show unanswered UI
      document.getElementById('today-loading').style.display      = 'none'
      document.getElementById('unanswered-section').style.display = 'block'

      // Set category badge
      const badgeEl = document.getElementById('cat-badge')
      badgeEl.className   = `cat-badge cat-${q.cat}`
      badgeEl.textContent = CAT_LABEL[q.cat] ?? q.cat

      // Set question text
      document.getElementById('question-text').textContent = q.q

      // Set input type
      if (q.type === 'choice') {
        document.getElementById('text-input-wrap').style.display = 'none'
        document.getElementById('choice-wrap').style.display     = 'block'

        const row = document.getElementById('choice-row')
        row.innerHTML = ''
        q.opts.forEach(opt => {
          const btn = document.createElement('button')
          btn.className   = 'choice-btn'
          btn.textContent = opt
          btn.addEventListener('click', () => {
            document.querySelectorAll('#choice-row .choice-btn').forEach(b => b.classList.remove('selected'))
            btn.classList.add('selected')
            document.getElementById('choice-value').value = opt
          })
          row.appendChild(btn)
        })
      } else {
        document.getElementById('text-input-wrap').style.display = 'block'
        document.getElementById('choice-wrap').style.display     = 'none'
      }
    }

    // ================================================================
    // Load history (past 7 days)
    // ================================================================
    async function loadHistory() {
      const histEl = document.getElementById('history-list')

      // Get past 7 date strings (excluding today)
      const dates = []
      for (let i = 1; i <= 7; i++) {
        const d = new Date()
        d.setDate(d.getDate() - i)
        dates.push(d.toLocaleDateString('sv-SE'))
      }

      // Fetch all answers for those dates for both users
      const { data: rows, error } = await _sb
        .from('quiz_answers')
        .select('user_id, question_id, answer, date_str')
        .in('date_str', dates)
        .order('date_str', { ascending: false })

      if (error) {
        console.error('loadHistory error:', error)
        histEl.innerHTML = '<div class="empty-msg">履歴の読み込みに失敗しました</div>'
        return
      }

      if (!rows || rows.length === 0) {
        histEl.innerHTML = '<div class="empty-msg">まだ過去の回答はありません ✨</div>'
        return
      }

      // Group by date_str + question_id
      const grouped = {}
      rows.forEach(r => {
        const key = `${r.date_str}__${r.question_id}`
        if (!grouped[key]) grouped[key] = { date_str: r.date_str, question_id: r.question_id, answers: [] }
        grouped[key].answers.push(r)
      })

      // Sort keys descending by date
      const keys = Object.keys(grouped).sort((a, b) => {
        const da = a.split('__')[0]
        const db = b.split('__')[0]
        return db.localeCompare(da)
      })

      if (keys.length === 0) {
        histEl.innerHTML = '<div class="empty-msg">まだ過去の回答はありません ✨</div>'
        return
      }

      histEl.innerHTML = ''
      keys.forEach(key => {
        const group = grouped[key]
        const qData = QUESTIONS.find(q => q.id === group.question_id)
        if (!qData) return

        const myAns      = group.answers.find(a => a.user_id === myId)
        const partnerAns = group.answers.find(a => a.user_id === partnerId)

        // Skip if no answer from anyone we track
        if (!myAns && !partnerAns) return

        const dateObj   = new Date(group.date_str + 'T00:00:00')
        const dateLabel = dateObj.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' })

        const card = document.createElement('div')
        card.className = 'history-card'

        let answersHtml = ''
        if (myAns) {
          const who = myProfile ? `${myProfile.emoji} ${escHtml(myProfile.name)}` : 'あなた'
          answersHtml += `
            <div class="history-answer">
              <div class="history-answer-who">${who}</div>
              <div class="history-answer-text">${escHtml(myAns.answer)}</div>
            </div>`
        }
        if (partnerAns) {
          const who = partnerProfile ? `${partnerProfile.emoji} ${escHtml(partnerProfile.name)}` : '相手'
          answersHtml += `
            <div class="history-answer">
              <div class="history-answer-who">${who}</div>
              <div class="history-answer-text">${escHtml(partnerAns.answer)}</div>
            </div>`
        }

        card.innerHTML = `
          <div class="history-meta">
            <span class="cat-badge cat-${qData.cat}">${CAT_LABEL[qData.cat] ?? qData.cat}</span>
            <span class="history-date">${dateLabel}</span>
          </div>
          <div class="history-question">${escHtml(qData.q)}</div>
          <div class="history-answers">${answersHtml}</div>
        `
        histEl.appendChild(card)
      })

      if (histEl.children.length === 0) {
        histEl.innerHTML = '<div class="empty-msg">まだ過去の回答はありません ✨</div>'
      }
    }

    // ================================================================
    // Init
    // ================================================================
    async function init() {
      try {
        const { data: { session } } = await _sb.auth.getSession()
        if (!session) { window.location.href = '/login.html'; return }
        myId = session.user.id

        const { data: profiles } = await _sb.from('profiles').select('*')
        if (profiles) {
          myProfile      = profiles.find(p => p.id === myId)   || null
          partnerProfile = profiles.find(p => p.id !== myId)   || null
          partnerId      = partnerProfile?.id || null
        }

        await loadToday()
        await loadHistory()
      } catch (err) {
        console.error('init error:', err)
        showToast('読み込みに失敗しました', true)
      }
    }

    init()
  </script>
</body>
