  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #0a1628 0%, #0d2044 40%, #112a5e 100%) fixed;
      background-attachment: fixed;
      color: #e8f0fc;
      min-height: 100vh;
    }

    /* ====== TOP BAR ====== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: linear-gradient(180deg, rgba(26,48,96,0.85) 0%, transparent 100%);
      backdrop-filter: blur(4px);
      position: relative;
      z-index: 1;
    }

    .top-bar a { color: #98bedd; text-decoration: none; font-size: 0.9rem; }
    .top-bar h1 { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.4rem; color: #e8f4fd; }
    .top-right { display: flex; align-items: center; gap: 8px; }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(150,200,255,0.3);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.85rem;
      color: #e8f4fd;
    }

    /* ====== POINT BAR ====== */
    .point-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 24px;
      background: rgba(255,215,0,0.08);
      border-bottom: 1px solid rgba(255,215,0,0.15);
      font-size: 1rem;
      color: #ffe066;
      position: relative;
      z-index: 1;
    }

    .point-bar .point-value {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffd700;
    }

    .point-bar .point-history-link {
      margin-left: 14px;
      font-size: 0.82rem;
      color: #ffd97d;
      text-decoration: none;
      padding: 3px 10px;
      border: 1px solid rgba(255,215,100,0.35);
      border-radius: 14px;
      background: rgba(255,215,100,0.06);
      transition: background 0.2s;
    }
    .point-bar .point-history-link:hover { background: rgba(255,215,100,0.16); }

    /* ====== CONTENT ====== */
    .content {
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 20px 80px;
      position: relative;
      z-index: 1;
    }

    /* ====== CAPSULE MACHINE ====== */
    .gacha-machine {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin-bottom: 40px;
    }

    .machine-body {
      position: relative;
      width: 200px;
    }

    /* capsule globe (glass dome) */
    .machine-globe {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(180,220,255,0.35) 0%, rgba(80,140,220,0.18) 40%, rgba(20,50,120,0.5) 100%);
      border: 3px solid rgba(100,180,255,0.5);
      box-shadow:
        0 0 28px rgba(80,160,255,0.3),
        inset 0 4px 16px rgba(255,255,255,0.15),
        inset 0 -4px 12px rgba(0,0,30,0.4);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.3s;
    }

    .machine-globe::before {
      content: '';
      position: absolute;
      top: 18px;
      left: 28px;
      width: 40px;
      height: 22px;
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
      transform: rotate(-20deg);
      filter: blur(3px);
    }

    /* the capsule ball inside */
    .capsule-ball {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff 0%, #b0d8ff 30%, #4a90d9 60%, #1a3d7c 100%);
      box-shadow: 0 4px 16px rgba(0,80,200,0.5), inset 0 -4px 8px rgba(0,0,60,0.3);
      position: relative;
    }

    .capsule-ball::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 16px;
      width: 20px;
      height: 12px;
      background: rgba(255,255,255,0.55);
      border-radius: 50%;
      transform: rotate(-20deg);
      filter: blur(2px);
    }

    /* spin animation */
    @keyframes spinBall {
      0%   { transform: rotate(0deg) scale(1); }
      25%  { transform: rotate(90deg) scale(1.12); }
      50%  { transform: rotate(180deg) scale(1); }
      75%  { transform: rotate(270deg) scale(1.12); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .capsule-ball.spinning {
      animation: spinBall 0.5s linear 0s 2;
    }

    /* machine base */
    .machine-base {
      width: 120px;
      height: 20px;
      background: linear-gradient(180deg, rgba(60,100,180,0.7) 0%, rgba(20,40,100,0.9) 100%);
      border-radius: 0 0 12px 12px;
      margin: -2px auto 0;
      border: 2px solid rgba(100,160,255,0.3);
      border-top: none;
    }

    .machine-stand {
      width: 60px;
      height: 24px;
      background: linear-gradient(180deg, rgba(20,40,100,0.9) 0%, rgba(10,20,60,0.9) 100%);
      border-radius: 0 0 8px 8px;
      margin: 0 auto;
      border: 2px solid rgba(80,130,220,0.25);
      border-top: none;
    }

    /* ====== GACHA BUTTON ====== */
    .gacha-btn {
      padding: 16px 36px;
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.25rem;
      background: linear-gradient(135deg, #3d7ab5 0%, #5b9bd5 50%, #3d7ab5 100%);
      color: #fff;
      border: 2px solid rgba(100,200,255,0.5);
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 20px rgba(60,120,200,0.5), 0 0 0 0 rgba(100,180,255,0);
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
      min-width: 260px;
    }

    .gacha-btn:active { transform: scale(0.96); }
    .gacha-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #4a8ac8 0%, #6aaee8 50%, #4a8ac8 100%);
      box-shadow: 0 6px 28px rgba(60,140,220,0.6), 0 0 20px rgba(100,180,255,0.2);
    }

    .gacha-btn:disabled {
      background: rgba(60,80,120,0.5);
      border-color: rgba(80,100,150,0.3);
      color: #5a7fa8;
      cursor: not-allowed;
      box-shadow: none;
    }

    .gacha-btn-sub {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.65);
      display: block;
      margin-top: 2px;
    }

    .gacha-btn:disabled .gacha-btn-sub { color: #4a6080; }

    /* ====== RESULT OVERLAY ====== */
    .result-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .result-overlay.open { display: flex; }

    .result-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.78);
      backdrop-filter: blur(6px);
    }

    .result-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 340px;
      border-radius: 24px;
      padding: 36px 28px 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      animation: popIn 0.35s cubic-bezier(0.175,0.885,0.32,1.275) both;
    }

    @keyframes popIn {
      0%   { opacity: 0; transform: scale(0.5) rotate(-8deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* rarity backgrounds */
    .result-card.rarity-N {
      background: linear-gradient(145deg, #0e2a4a 0%, #163a60 60%, #1a4a7a 100%);
      border: 2px solid rgba(74,127,168,0.7);
    }

    .result-card.rarity-R {
      background: linear-gradient(145deg, #1a0a30 0%, #2d0f50 60%, #3d1570 100%);
      border: 2px solid rgba(138,43,226,0.8);
    }

    .result-card.rarity-SR {
      background: linear-gradient(145deg, #1a1200 0%, #2d2000 60%, #3d2e00 100%);
      border: 2px solid rgba(255,215,0,0.9);
    }

    /* レア度別演出 */
    @keyframes rarity-shake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-10px) rotate(-1deg); }
      30% { transform: translateX(10px) rotate(1deg); }
      45% { transform: translateX(-8px) rotate(-0.5deg); }
      60% { transform: translateX(8px) rotate(0.5deg); }
      75% { transform: translateX(-4px); }
    }
    @keyframes sparkle-burst {
      0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
    }
    @keyframes gold-rain {
      0%   { transform: translateY(-40px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(120vh) rotate(720deg); opacity: 0; }
    }
    .result-card.rarity-R { animation: popIn 0.35s cubic-bezier(0.175,0.885,0.32,1.275) both; }
    .result-card.rarity-SR {
      animation: popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275) both, rarity-shake 0.8s ease-out 0.5s;
    }
    .result-card.rarity-N .rarity-fx,
    .result-card.rarity-R .rarity-fx,
    .result-card.rarity-SR .rarity-fx {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 24px;
    }
    /* R burst */
    .result-card.rarity-R .rarity-fx::before {
      content: '';
      position: absolute; top: 50%; left: 50%;
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(200,120,255,0.55) 0%, transparent 65%);
      transform: translate(-50%, -50%) scale(0.2);
      animation: sparkle-burst 1s ease-out both;
    }
    /* SR big burst */
    .result-card.rarity-SR .rarity-fx::before {
      content: '';
      position: absolute; top: 50%; left: 50%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,215,0,0.75) 0%, rgba(255,150,50,0.45) 30%, transparent 70%);
      transform: translate(-50%, -50%) scale(0.2);
      animation: sparkle-burst 1.2s ease-out both;
    }

    /* SR: full-screen gold overlay */
    .sr-overlay {
      position: fixed; inset: 0; z-index: 99;
      background: radial-gradient(circle at center, rgba(255,215,0,0.4) 0%, rgba(255,150,50,0.15) 40%, transparent 80%);
      pointer-events: none;
      animation: sparkle-burst 1.6s ease-out both;
    }
    .sr-overlay.hidden { display: none; }
    .gold-particle {
      position: fixed; z-index: 98; font-size: 1.6rem;
      pointer-events: none;
      animation: gold-rain 2.5s linear both;
    }

    /* SR sparkle shimmer */
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    .result-card.rarity-SR::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: linear-gradient(105deg, transparent 30%, rgba(255,215,0,0.15) 50%, transparent 70%);
      background-size: 200% auto;
      animation: shimmer 2s linear infinite;
      pointer-events: none;
    }

    .result-emoji {
      font-size: 4rem;
      line-height: 1;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.35));
    }

    .result-rarity-badge {
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      padding: 3px 14px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .rarity-N .result-rarity-badge  { background: rgba(74,127,168,0.3); color: #7ec8f0; border: 1px solid rgba(74,127,168,0.6); }
    .rarity-R .result-rarity-badge  { background: rgba(138,43,226,0.3); color: #d09aff; border: 1px solid rgba(138,43,226,0.7); }
    .rarity-SR .result-rarity-badge { background: rgba(255,215,0,0.25); color: #ffd700; border: 1px solid rgba(255,215,0,0.8); }

    .result-name {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.6rem;
      color: #e8f4fd;
      line-height: 1.3;
    }

    .rarity-SR .result-name { color: #ffd700; text-shadow: 0 0 16px rgba(255,215,0,0.5); }

    .result-desc {
      font-size: 0.9rem;
      color: #98bedd;
      line-height: 1.5;
    }

    .result-bonus {
      font-size: 0.85rem;
      color: #ffd700;
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 8px;
      padding: 4px 14px;
    }

    .receive-btn {
      margin-top: 6px;
      padding: 13px 40px;
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.1rem;
      background: rgba(255,255,255,0.12);
      color: #e8f4fd;
      border: 1.5px solid rgba(150,200,255,0.4);
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      width: 100%;
    }

    .receive-btn:active { transform: scale(0.96); }
    .receive-btn:hover  { background: rgba(255,255,255,0.2); }
    .receive-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ====== SECTION TITLE ====== */
    .section-title {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.4rem;
      color: #e8f4fd;
      margin-bottom: 16px;
      padding-left: 12px;
      border-left: 4px solid #5ba3d0;
    }

    /* ====== TICKET TABS ====== */
    .ticket-tabs {
      display: flex; gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .ticket-tabs::-webkit-scrollbar { display: none; }
    .ticket-tab {
      flex-shrink: 0;
      padding: 8px 14px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(150,200,255,0.18);
      border-radius: 999px;
      color: #98bedd;
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
    }
    .ticket-tab:active { transform: scale(0.96); }
    .ticket-tab.active {
      background: rgba(100,180,255,0.24);
      border-color: rgba(100,180,255,0.55);
      color: #e8f4fd;
    }

    /* ====== TICKET CARDS ====== */
    .ticket-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ticket-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(100,160,255,0.2);
      border-radius: 14px;
      padding: 14px 16px;
      transition: background 0.2s;
    }

    .ticket-card.used {
      opacity: 0.38;
      filter: grayscale(0.4);
    }

    .ticket-emoji { font-size: 2.2rem; flex-shrink: 0; line-height: 1; }

    .ticket-info { flex: 1; min-width: 0; }

    .ticket-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 3px;
    }

    .ticket-name {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.05rem;
      color: #e8f4fd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ticket-badge {
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      padding: 2px 8px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .badge-N  { background: rgba(74,127,168,0.25);  color: #7ec8f0; border: 1px solid rgba(74,127,168,0.5); }
    .badge-R  { background: rgba(138,43,226,0.25);  color: #d09aff; border: 1px solid rgba(138,43,226,0.6); }
    .badge-SR { background: rgba(255,215,0,0.2);    color: #ffd700; border: 1px solid rgba(255,215,0,0.7); }

    .ticket-owner {
      font-size: 0.75rem;
      color: #5a8fb8;
      margin-bottom: 2px;
    }

    .ticket-desc { font-size: 0.82rem; color: #7a9ec0; }

    .ticket-bonus {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.72rem;
      color: #ffd764;
      background: rgba(255,215,100,0.1);
      border: 1px solid rgba(255,215,100,0.3);
      border-radius: 10px;
      padding: 1px 8px;
    }

    .ticket-date { font-size: 0.72rem; color: #4a6f90; margin-top: 2px; }

    .use-btn {
      flex-shrink: 0;
      padding: 7px 14px;
      background: rgba(100,160,255,0.15);
      border: 1.5px solid rgba(100,160,255,0.35);
      border-radius: 20px;
      color: #98bedd;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .use-btn:hover { background: rgba(100,160,255,0.28); }
    .use-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .used-label {
      flex-shrink: 0;
      font-size: 0.75rem;
      color: #4a6080;
      padding: 6px 10px;
      border: 1px solid rgba(80,100,140,0.3);
      border-radius: 20px;
    }

    .cancel-req-btn {
      flex-shrink: 0; padding: 6px 10px; border-radius: 16px;
      font-family: inherit; font-size: 0.75rem; cursor: pointer;
      background: rgba(255,180,50,0.12); border: 1.5px solid rgba(255,200,80,0.4); color: #ffd080;
      white-space: nowrap;
    }
    .cancel-pending-label {
      flex-shrink: 0; font-size: 0.72rem; color: #a08030;
      padding: 6px 8px; border: 1px solid rgba(160,120,0,0.3); border-radius: 16px;
    }
    .gacha-cancel-alert {
      width: 100%; margin-top: 8px; padding: 8px 10px;
      background: rgba(255,180,50,0.1); border: 1px solid rgba(255,200,80,0.35);
      border-radius: 10px; font-size: 0.78rem; color: #ffd080;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .gacha-approve-btn {
      padding: 5px 12px; border-radius: 12px; font-family: inherit; font-size: 0.78rem; cursor: pointer;
      background: rgba(80,220,120,0.2); border: 1.5px solid rgba(80,220,120,0.5); color: #baffcc;
    }
    .gacha-deny-btn {
      padding: 5px 12px; border-radius: 12px; font-family: inherit; font-size: 0.78rem; cursor: pointer;
      background: rgba(255,100,100,0.12); border: 1.5px solid rgba(255,100,100,0.4); color: #ff9d9d;
    }

    .empty-tickets {
      text-align: center;
      color: #5a7fa8;
      padding: 36px 0;
      font-size: 0.95rem;
    }

    /* ====== TOAST ====== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(20,40,80,0.95);
      border: 1px solid rgba(100,160,255,0.4);
      color: #e8f4fd;
      padding: 12px 24px;
      border-radius: 40px;
      font-size: 0.9rem;
      z-index: 200;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      max-width: calc(100vw - 40px);
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.error {
      border-color: rgba(255,100,100,0.5);
      background: rgba(60,10,10,0.95);
    }

    /* ====== MISC ====== */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(100,160,255,0.2), transparent);
      margin: 36px 0;
    }

    @media (max-width: 480px) {
      .top-bar { padding: 12px 14px; }
      .top-bar h1 { font-size: 1.15rem; }
      .user-badge .user-name { display: none; }
      .content { padding: 20px 14px 80px; }
      .gacha-btn { min-width: 220px; font-size: 1.1rem; padding: 14px 28px; }
      .result-card { padding: 28px 20px 24px; }
    }

    /* =============================================================
       Enhanced gacha reveal — extra effects (layered on top)
       ============================================================= */
    /* Aurora rings around globe during "charging" phase */
    .machine-globe.charging { box-shadow: 0 0 60px rgba(120,180,255,0.55), inset 0 4px 16px rgba(255,255,255,0.15), inset 0 -4px 12px rgba(0,0,30,0.4); }
    .machine-globe .aurora-ring-a,
    .machine-globe .aurora-ring-b {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 2px solid transparent;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .machine-globe.charging .aurora-ring-a {
      opacity: 1;
      border-top-color: rgba(255,215,100,0.75);
      border-right-color: rgba(200,120,255,0.55);
      animation: gacha-ring-spin 1.2s linear infinite;
    }
    .machine-globe.charging .aurora-ring-b {
      opacity: 1;
      inset: -32px;
      border-bottom-color: rgba(100,180,255,0.75);
      border-left-color: rgba(255,150,200,0.55);
      animation: gacha-ring-spin 1.8s linear infinite reverse;
    }
    @keyframes gacha-ring-spin { to { transform: rotate(360deg); } }

    /* Charging particles pulling toward globe */
    .charge-particle {
      position: fixed; z-index: 30;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, rgba(150,200,255,0.7) 60%, transparent 100%);
      pointer-events: none;
      animation: charge-in 0.9s ease-in both;
    }
    @keyframes charge-in {
      0%   { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.4); }
      20%  { opacity: 1; }
      100% { opacity: 0; transform: translate(0, 0) scale(1.6); }
    }

    /* Full-screen reveal flash */
    .reveal-flash {
      position: fixed; inset: 0; z-index: 96;
      pointer-events: none;
      background: radial-gradient(circle at center, var(--flash-color, rgba(255,255,255,0.85)) 0%, transparent 60%);
      opacity: 0;
      animation: reveal-flash-anim 0.7s ease-out both;
    }
    @keyframes reveal-flash-anim {
      0%   { opacity: 0; transform: scale(0.3); }
      25%  { opacity: 0.95; }
      100% { opacity: 0; transform: scale(2.4); }
    }

    /* Aurora expanding rings (SR only) */
    .aurora-ring-expand {
      position: fixed; z-index: 97;
      top: 50%; left: 50%;
      width: 120px; height: 120px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      border: 3px solid;
      pointer-events: none;
      animation: aurora-expand 1.6s ease-out both;
    }
    @keyframes aurora-expand {
      0%   { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(7); opacity: 0; }
    }

    /* Screen shake */
    body.gacha-shake { animation: gacha-body-shake 0.55s ease-out; }
    @keyframes gacha-body-shake {
      0%,100% { transform: translate(0,0); }
      15% { transform: translate(-4px,-3px); }
      30% { transform: translate(5px,2px); }
      45% { transform: translate(-3px,4px); }
      60% { transform: translate(3px,-2px); }
      75% { transform: translate(-2px,1px); }
    }

    /* Rarity-tinted card glow */
    .result-card.rarity-R  { box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 40px rgba(200,120,255,0.35), inset 0 0 20px rgba(200,120,255,0.12); }
    .result-card.rarity-SR { box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 50px rgba(255,215,0,0.45),  inset 0 0 22px rgba(255,215,0,0.18); }

    /* Result "もう1回" button */
    .replay-btn {
      margin-top: 6px;
      padding: 12px 30px;
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1rem;
      background: rgba(255,215,100,0.12);
      color: #ffd764;
      border: 1.5px solid rgba(255,215,100,0.4);
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      width: 100%;
    }
    .replay-btn:active { transform: scale(0.96); }
    .replay-btn:hover:not(:disabled) { background: rgba(255,215,100,0.22); }
    .replay-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .result-card-actions { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 4px; }

    /* Name reveal - subtle scale-up */
    .result-name { animation: name-in 0.55s var(--ease-spring, cubic-bezier(0.175,0.885,0.32,1.275)) both; animation-delay: 0.2s; }
    @keyframes name-in {
      from { opacity: 0; transform: scale(0.7); letter-spacing: 0.3em; }
      to   { opacity: 1; transform: scale(1);   letter-spacing: normal; }
    }
  </style>

  <script>
    // ===================== PRIZES =====================
    const PRIZES = [
      { id:1,  name:'ハグ券',          emoji:'🤗', rarity:'N',  desc:'好きなときに使える' },
      { id:2,  name:'おやすみ電話券',   emoji:'🌙', rarity:'N',  desc:'今夜おやすみ電話ができる' },
      { id:3,  name:'ごはん選択権',     emoji:'🍽️', rarity:'N',  desc:'次のごはんのお店を決められる' },
      { id:4,  name:'写真撮影券',       emoji:'📸', rarity:'N',  desc:'2人の写真を撮ってもらえる' },
      { id:5,  name:'ポイント+50',      emoji:'⭐', rarity:'N',  desc:'ポイントが50増える', bonus_points:50 },
      { id:6,  name:'スタンプ送信権',   emoji:'💬', rarity:'N',  desc:'好きなスタンプを送ってもらえる' },
      { id:7,  name:'デート行き先選択権',emoji:'💑', rarity:'R',  desc:'次のデートの行き先を決められる' },
      { id:8,  name:'手料理券',         emoji:'🍳', rarity:'R',  desc:'手料理を1品作ってもらえる' },
      { id:9,  name:'ポイント+200',     emoji:'💫', rarity:'R',  desc:'ポイントが200増える', bonus_points:200 },
      { id:10, name:'サプライズ計画権', emoji:'🎁', rarity:'R',  desc:'ミニサプライズを計画してもらえる' },
      { id:11, name:'一日デート券',     emoji:'💖', rarity:'SR', desc:'丸一日好きなプランで過ごせる' },
      { id:12, name:'ポイント+500',     emoji:'🌟', rarity:'SR', desc:'ポイントが500増える', bonus_points:500 },
      { id:13, name:'願いごと券',       emoji:'🌠', rarity:'SR', desc:'なんでも1つお願いできる' },
    ]

    // ===================== DRAW LOGIC =====================
    // ビルトイン + 相手が私のガチャに追加したカスタム景品を混ぜて抽選
    // R以上確定の抽選（おまけ用）
    function drawPrizeROrBetter() {
      const pool = []
      PRIZES.filter(p => p.rarity !== 'N').forEach(p => {
        const w = p.rarity === 'SR' ? 0.5 : 2
        const count = Math.round(w * 10)
        for (let i = 0; i < count; i++) pool.push({ ...p, isCustom: false })
      })
      if (customPrizes.length > 0) {
        customPrizes.filter(p => p.rarity !== 'N').forEach(p => {
          const w = Number(p.weight || 1)
          for (let i = 0; i < Math.max(1, Math.round(w * 5)); i++) {
            pool.push({ ...p, isCustom: true, desc: p.description })
          }
        })
      }
      if (pool.length === 0) return drawPrize() // fallback
      return { ...pool[Math.floor(Math.random() * pool.length)] }
    }

    function drawPrize() {
      const useCustom = customPrizes.length > 0 && Math.random() < currentShare
      if (useCustom) {
        const totalW = customPrizes.reduce((s, p) => s + Number(p.weight || 1), 0)
        let r = Math.random() * totalW
        for (const p of customPrizes) {
          r -= Number(p.weight || 1)
          if (r <= 0) return { ...p, isCustom: true, desc: p.description }
        }
        const last = customPrizes[customPrizes.length - 1]
        return { ...last, isCustom: true, desc: last.description }
      }
      const weighted = []
      PRIZES.forEach(p => {
        const w = p.rarity === 'N' ? 5 : p.rarity === 'R' ? 2 : 0.5
        const count = Math.round(w * 10)
        for (let i = 0; i < count; i++) weighted.push(p)
      })
      return { ...weighted[Math.floor(Math.random() * weighted.length)], isCustom: false }
    }

    // ===================== LINEUP =====================
    function calcRates() {
      // ビルトインの重み計算
      const builtinTotal = PRIZES.reduce((s, p) => {
        const w = p.rarity === 'N' ? 5 : p.rarity === 'R' ? 2 : 0.5
        return s + Math.round(w * 10)
      }, 0)

      const hasCustom = customPrizes.length > 0
      const customTotal = hasCustom
        ? customPrizes.reduce((s, p) => s + Number(p.weight || 1), 0)
        : 0
      const pCustom = (hasCustom && currentShare > 0) ? currentShare : 0
      const pBuiltin = 1 - pCustom

      const rows = []

      // ビルトイン
      PRIZES.forEach(p => {
        const w = p.rarity === 'N' ? 5 : p.rarity === 'R' ? 2 : 0.5
        const entryCount = Math.round(w * 10)
        const rate = pBuiltin * (entryCount / builtinTotal) * 100
        rows.push({ emoji: p.emoji, name: p.name, rarity: p.rarity, rate, isCustom: false })
      })

      // カスタム
      if (hasCustom && pCustom > 0) {
        customPrizes.forEach(p => {
          const w = Number(p.weight || 1)
          const rate = pCustom * (w / customTotal) * 100
          rows.push({ emoji: p.emoji, name: p.name, rarity: p.rarity, rate, isCustom: true })
        })
      }

      return { rows, pCustom, pBuiltin }
    }

    function renderLineup() {
      const panel = document.getElementById('lineup-list')
      const note = document.getElementById('lineup-note')
      const { rows, pCustom, pBuiltin } = calcRates()

      if (pCustom > 0) {
        note.textContent = `ビルトイン ${Math.round(pBuiltin * 100)}% / カスタム ${Math.round(pCustom * 100)}% の確率で各プールから抽選`
      } else {
        note.textContent = 'カスタム景品なし（ビルトインのみ）'
      }

      const colors = { N: '#7ec8f0', R: '#d09aff', SR: '#ffd700' }
      const sorted = [...rows].sort((a, b) => b.rate - a.rate)
      panel.innerHTML = sorted.map(r => `
        <div style="display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid rgba(150,200,255,0.1)">
          <span style="font-size:1.3rem;width:28px;text-align:center">${r.emoji}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:0.9rem;color:#e8f4fd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              ${r.name}${r.isCustom ? ' <span style="font-size:0.65rem;color:#98bedd;background:rgba(150,200,255,0.15);padding:1px 5px;border-radius:6px">カスタム</span>' : ''}
            </div>
            <div style="height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:4px;overflow:hidden">
              <div style="height:100%;width:${Math.min(r.rate * 3, 100)}%;background:${colors[r.rarity] || '#7ec8f0'};border-radius:2px;transition:width 0.4s"></div>
            </div>
          </div>
          <div style="text-align:right;min-width:44px">
            <div style="font-size:0.85rem;font-weight:bold;color:${colors[r.rarity] || '#7ec8f0'}">${r.rate.toFixed(1)}%</div>
            <div style="font-size:0.65rem;color:#5a8fb8">${r.rarity}</div>
          </div>
        </div>
      `).join('')
    }

    let lineupOpen = false
    function toggleLineup() {
      lineupOpen = !lineupOpen
      const panel = document.getElementById('lineup-panel')
      const btn = document.getElementById('lineup-toggle-btn')
      if (lineupOpen) {
        renderLineup()
        panel.style.display = 'block'
        btn.textContent = '📋 ラインナップを閉じる'
      } else {
        panel.style.display = 'none'
        btn.textContent = '📋 排出ラインナップを見る'
      }
    }

    // ===================== STATE =====================
    let currentUser = null
    let currentPoints = 0
    let pendingPrize = null
    let profiles = []
    let currentShare = 0.5     // 自分のガチャで custom を引く確率
    let customPrizes = []      // 相手が私に追加した景品
    let myAddedPrizes = []     // 私が相手に追加した景品
    let partnerId = null

    // ===================== INIT =====================
    async function init() {
      const { data: { session } } = await _sb.auth.getSession()
      if (!session) return
      currentUser = session.user

      const { data: profilesData } = await _sb.from('profiles').select('*')
      if (profilesData) {
        profiles = profilesData
        const me = profiles.find(p => p.id === currentUser.id)
        const partner = profiles.find(p => p.id !== currentUser.id)
        partnerId = partner?.id || null
        currentShare = Number(me?.gacha_custom_share ?? 0.5)
        document.getElementById('share-slider').value = Math.round(currentShare * 100)
        document.getElementById('share-display').textContent = Math.round(currentShare * 100) + '%'
      }

      // スライダー変更
      document.getElementById('share-slider').addEventListener('input', (e) => {
        const v = Number(e.target.value) / 100
        document.getElementById('share-display').textContent = e.target.value + '%'
        currentShare = v
        if (lineupOpen) renderLineup()
      })
      document.getElementById('share-slider').addEventListener('change', async (e) => {
        const v = Number(e.target.value) / 100
        const { error } = await _sb.from('profiles').update({ gacha_custom_share: v }).eq('id', currentUser.id)
        if (error) console.error('share update error:', error)
      })

      await loadPoints()
      await loadCustomPrizes()
      await loadTickets()
    }

    // 相手が私のガチャに追加した景品 + 私が相手に追加した景品を読み込み
    async function loadCustomPrizes() {
      const { data: forMe } = await _sb.from('gacha_custom_prizes')
        .select('*').eq('target_user_id', currentUser.id).eq('active', true)
      customPrizes = forMe || []

      const { data: byMe } = await _sb.from('gacha_custom_prizes')
        .select('*').eq('added_by', currentUser.id).order('created_at', { ascending: false })
      myAddedPrizes = byMe || []
      renderMyAddedList()
      if (lineupOpen) renderLineup()
    }

    function renderMyAddedList() {
      const list = document.getElementById('my-added-list')
      if (myAddedPrizes.length === 0) {
        list.innerHTML = '<div class="empty-tickets" style="padding:16px 0;font-size:0.85rem">まだ追加した景品はありません</div>'
        return
      }
      list.innerHTML = ''
      myAddedPrizes.forEach(p => {
        const card = document.createElement('div')
        card.className = 'ticket-card' + (p.active ? '' : ' used')
        card.innerHTML = `
          <div class="ticket-emoji">${escHtml(p.emoji)}</div>
          <div class="ticket-info">
            <div class="ticket-top">
              <span class="ticket-name">${escHtml(p.name)}</span>
              <span class="ticket-badge badge-${escHtml(p.rarity)}">${escHtml(p.rarity)}</span>
            </div>
            <div class="ticket-desc">${escHtml(p.description || '')}</div>
            <div class="ticket-date">出やすさ ${p.weight}${p.bonus_points ? ` · +${p.bonus_points}pt` : ''}${p.active ? '' : ' · 停止中'}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <button class="use-btn" onclick="editPartnerPrize('${p.id}')">✏️</button>
            <button class="use-btn" onclick="toggleActive('${p.id}', ${!p.active})">${p.active ? '停止' : '再開'}</button>
            <button class="use-btn" style="background:rgba(255,100,100,0.15);border-color:rgba(255,100,100,0.35);color:#ff9d9d" onclick="deletePartnerPrize('${p.id}')">🗑</button>
          </div>
        `
        list.appendChild(card)
      })
    }

    let editingPrizeId = null

    function editPartnerPrize(id) {
      const p = myAddedPrizes.find(x => x.id === id)
      if (!p) return
      editingPrizeId = id
      document.getElementById('new-name').value = p.name
      document.getElementById('new-emoji').value = p.emoji
      document.getElementById('new-desc').value = p.description || ''
      document.getElementById('new-weight').value = p.weight
      document.getElementById('new-bonus').value = p.bonus_points || ''
      document.querySelector(`input[name="new-rarity"][value="${p.rarity}"]`).checked = true
      // 追加フォームを開いて、ボタンラベル変更
      const f = document.getElementById('add-prize-form')
      f.style.display = 'block'
      // ボタンを保存モードに
      const btns = f.querySelectorAll('button')
      btns.forEach(b => {
        if (b.textContent.trim() === '追加する') { b.textContent = '保存する'; b.onclick = savePartnerPrize }
      })
      // スクロール
      f.scrollIntoView({ behavior: 'smooth', block: 'center' })
    }

    async function savePartnerPrize() {
      if (!editingPrizeId) return
      const name = document.getElementById('new-name').value.trim()
      const emoji = document.getElementById('new-emoji').value.trim() || '🎁'
      const rarity = document.querySelector('input[name="new-rarity"]:checked').value
      const description = document.getElementById('new-desc').value.trim()
      const weight = Math.max(0.1, Number(document.getElementById('new-weight').value) || 1)
      const bonus = document.getElementById('new-bonus').value
      const bonus_points = bonus ? Math.max(0, parseInt(bonus, 10)) : null
      if (!name) { showToast('景品名を入力してください', true); return }

      const { error } = await _sb.from('gacha_custom_prizes').update({
        name, emoji, rarity, description, weight, bonus_points,
        updated_at: new Date().toISOString(),
      }).eq('id', editingPrizeId)
      if (error) { showToast('保存失敗: ' + error.message, true); return }

      editingPrizeId = null
      resetPrizeForm()
      toggleAddPrizeForm()
      showToast('✅ 保存しました')
      await loadCustomPrizes()
    }

    function resetPrizeForm() {
      document.getElementById('new-name').value = ''
      document.getElementById('new-emoji').value = ''
      document.getElementById('new-desc').value = ''
      document.getElementById('new-weight').value = '1'
      document.getElementById('new-bonus').value = ''
      const f = document.getElementById('add-prize-form')
      // ボタンを追加モードに戻す
      const btns = f.querySelectorAll('button')
      btns.forEach(b => {
        if (b.textContent.trim() === '保存する') { b.textContent = '追加する'; b.onclick = addPartnerPrize }
      })
    }

    function toggleAddPrizeForm() {
      const f = document.getElementById('add-prize-form')
      const willOpen = f.style.display === 'none'
      f.style.display = willOpen ? 'block' : 'none'
      if (!willOpen) {
        editingPrizeId = null
        resetPrizeForm()
      }
    }

    async function addPartnerPrize() {
      if (!partnerId) { showToast('相手が見つかりません', true); return }
      const name = document.getElementById('new-name').value.trim()
      const emoji = document.getElementById('new-emoji').value.trim() || '🎁'
      const rarity = document.querySelector('input[name="new-rarity"]:checked').value
      const description = document.getElementById('new-desc').value.trim()
      const weight = Math.max(0.1, Number(document.getElementById('new-weight').value) || 1)
      const bonus = document.getElementById('new-bonus').value
      const bonus_points = bonus ? Math.max(0, parseInt(bonus, 10)) : null

      if (!name) { showToast('景品名を入力してください', true); return }

      const { error } = await _sb.from('gacha_custom_prizes').insert({
        added_by: currentUser.id,
        target_user_id: partnerId,
        name, emoji, rarity, description, weight, bonus_points,
      })
      if (error) { showToast('追加失敗: ' + error.message, true); return }

      _sb.from('points').insert({ user_id: currentUser.id, amount: 1, reason: 'gacha_prize_add' }).then(() => {})

      document.getElementById('new-name').value = ''
      document.getElementById('new-emoji').value = ''
      document.getElementById('new-desc').value = ''
      document.getElementById('new-weight').value = '1'
      document.getElementById('new-bonus').value = ''
      toggleAddPrizeForm()
      showToast('✅ 追加しました')
      await loadCustomPrizes()
    }

    async function toggleActive(id, newActive) {
      const { error } = await _sb.from('gacha_custom_prizes').update({ active: newActive }).eq('id', id)
      if (error) { showToast('更新失敗', true); return }
      await loadCustomPrizes()
    }

    async function deletePartnerPrize(id) {
      if (!confirm('この景品を削除しますか？（相手のガチャから消えます）')) return
      const { error } = await _sb.from('gacha_custom_prizes').delete().eq('id', id)
      if (error) { showToast('削除失敗', true); return }
      showToast('削除しました')
      await loadCustomPrizes()
    }

    // ===================== POINTS =====================
    async function loadPoints() {
      const { data, error } = await _sb.from('points').select('amount').eq('user_id', currentUser.id)
      if (error) {
        console.error('points load error:', error)
        showToast('ポイントの読み込みに失敗しました', true)
        return
      }
      currentPoints = data ? data.reduce((sum, r) => sum + (r.amount || 0), 0) : 0
      updatePointDisplay()
    }

    function updatePointDisplay() {
      document.getElementById('point-display').textContent = currentPoints + 'pt'
      const btn = document.getElementById('gacha-btn')
      const sub = document.getElementById('gacha-btn-sub')
      if (currentPoints >= 100) {
        btn.disabled = false
        sub.textContent = '消費: 100pt'
      } else {
        btn.disabled = true
        sub.textContent = `ポイントが足りない (${currentPoints}pt / 100pt必要)`
      }
      const btn10 = document.getElementById('gacha10-btn')
      const sub10 = document.getElementById('gacha10-btn-sub')
      if (currentPoints >= 1000) {
        btn10.disabled = false
        sub10.textContent = '消費: 1000pt / 10連'
      } else {
        btn10.disabled = true
        sub10.textContent = `ポイントが足りない (${currentPoints}pt / 1000pt必要)`
      }
    }

    // ===================== 10連ガチャ =====================
    async function startGacha10() {
      if (currentPoints < 1000) { showToast('ポイントが足りません (1000pt必要)', true); return }
      const b1 = document.getElementById('gacha-btn')
      const b10 = document.getElementById('gacha10-btn')
      b1.disabled = true; b10.disabled = true

      const globe = document.getElementById('machine-globe')
      const ball = document.getElementById('capsule-ball')
      ball.classList.remove('spinning')
      void ball.offsetWidth
      ball.classList.add('spinning')
      globe.classList.add('charging')
      if (navigator.vibrate) navigator.vibrate(25)
      // Extra intense charge for 10連
      spawnChargeParticles()
      setTimeout(() => spawnChargeParticles(), 400)

      const prizes = []
      for (let i = 0; i < 10; i++) prizes.push(drawPrize())
      // おまけ: R以上確定の+1
      const bonusPrize = drawPrizeROrBetter()
      bonusPrize._isBonus = true
      prizes.push(bonusPrize)

      // 1000pt deduct + 10件insert
      const inserts = prizes.map(prize => ({
        user_id:       currentUser.id,
        reward_name:   prize.name,
        reward_emoji:  prize.emoji,
        reward_desc:   prize.desc || prize.description || null,
        rarity:        prize.rarity,
        used:          false,
        bonus_points:  prize.bonus_points || null,
        reward_id:     prize.isCustom ? null : prize.id,
        custom_prize_id: prize.isCustom ? prize.id : null,
      }))

      const { error: pointErr } = await _sb.from('points').insert({ user_id: currentUser.id, amount: -1000, reason: 'gacha10' })
      if (pointErr) { showToast('エラー: ' + pointErr.message, true); b1.disabled = false; b10.disabled = false; return }

      const { error: insErr } = await _sb.from('gacha_results').insert(inserts)
      if (insErr) { showToast('エラー: ' + insErr.message, true) }

      // Peek at the best rarity for flash color
      const bestRarity = prizes.some(p => p.rarity === 'SR') ? 'SR' : prizes.some(p => p.rarity === 'R') ? 'R' : 'N'

      setTimeout(() => {
        ball.classList.remove('spinning')
        globe.classList.remove('charging')
        flashReveal(bestRarity)
        setTimeout(() => show10Results(prizes), 240)
      }, 1100)

      await loadPoints()
      await loadTickets()
    }

    function show10Results(prizes) {
      const grid = document.getElementById('result10-grid')
      const summary = document.getElementById('result10-summary')
      grid.innerHTML = ''
      const counts = { N: 0, R: 0, SR: 0 }
      prizes.forEach((p, idx) => {
        counts[p.rarity]++
        const isBonus = !!p._isBonus
        const cell = document.createElement('div')
        const borderColor = isBonus ? 'rgba(255,215,0,0.9)' : p.rarity==='SR' ? 'rgba(255,215,0,0.8)' : p.rarity==='R' ? 'rgba(180,120,255,0.7)' : 'rgba(120,180,220,0.4)'
        const bg = isBonus
          ? `linear-gradient(145deg,#3d2e00,#1a1200)`
          : p.rarity==='SR' ? 'linear-gradient(145deg,#3d2e00,#1a1200)' : p.rarity==='R' ? 'linear-gradient(145deg,#2d0f50,#1a0a30)' : 'linear-gradient(145deg,#163a60,#0e2a4a)'
        // おまけは2カラム全幅
        if (isBonus) cell.style.gridColumn = '1 / -1'
        cell.style.cssText += `border:2px solid ${borderColor};background:${bg};border-radius:12px;padding:12px 8px;text-align:center;opacity:0;transform:scale(0.5);transition:all 0.3s`
        const rarityColor = p.rarity==='SR' ? '#ffd700' : p.rarity==='R' ? '#d09aff' : '#7ec8f0'
        cell.innerHTML = `
          ${isBonus ? `<div style="font-size:0.65rem;color:#ffd700;letter-spacing:0.08em;margin-bottom:4px">⭐ おまけ</div>` : ''}
          <div style="font-size:${isBonus ? '2.4' : '2'}rem;line-height:1">${escHtml(p.emoji)}</div>
          <div style="font-size:0.72rem;font-weight:bold;color:${rarityColor};margin:4px 0">${p.rarity}</div>
          <div style="font-size:0.78rem;color:#e8f4fd;line-height:1.2">${escHtml(p.name)}</div>
        `
        grid.appendChild(cell)
        setTimeout(() => { cell.style.opacity = '1'; cell.style.transform = 'scale(1)' }, 100 + idx * 90)
      })
      summary.textContent = `SR ${counts.SR} · R ${counts.R} · N ${counts.N}`
      document.getElementById('result10-overlay').classList.add('open')

      // SR があれば派手演出
      if (counts.SR > 0) triggerSREffect()
    }

    function closeResult10() {
      document.getElementById('result10-overlay').classList.remove('open')
    }

    // SR演出: 金色オーバーレイ + パーティクル降り + オーロラリング + 画面シェイク
    function triggerSREffect() {
      const overlay = document.createElement('div')
      overlay.className = 'sr-overlay'
      document.body.appendChild(overlay)
      setTimeout(() => overlay.remove(), 1700)

      // Expanding aurora rings
      const ringColors = ['#ffd700', '#ffb347', '#ffcc33']
      ringColors.forEach((c, i) => {
        setTimeout(() => {
          const r = document.createElement('div')
          r.className = 'aurora-ring-expand'
          r.style.borderColor = c
          r.style.boxShadow = `0 0 20px ${c}`
          document.body.appendChild(r)
          setTimeout(() => r.remove(), 1700)
        }, i * 220)
      })

      // Screen shake
      document.body.classList.remove('gacha-shake')
      void document.body.offsetWidth
      document.body.classList.add('gacha-shake')
      setTimeout(() => document.body.classList.remove('gacha-shake'), 650)

      // Haptic
      if (navigator.vibrate) navigator.vibrate([40, 60, 100])

      const emojis = ['✨','🌟','💫','⭐','🎉','🎊']
      for (let i = 0; i < 42; i++) {
        const p = document.createElement('div')
        p.className = 'gold-particle'
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)]
        p.style.left = (Math.random() * 100) + 'vw'
        p.style.top = '-40px'
        p.style.animationDelay = (Math.random() * 0.8) + 's'
        p.style.animationDuration = (2 + Math.random() * 1.5) + 's'
        p.style.fontSize = (1.2 + Math.random() * 0.8) + 'rem'
        document.body.appendChild(p)
        setTimeout(() => p.remove(), 4800)
      }
    }

    // R演出: 紫のフラッシュ + 軽いリング
    function triggerREffect() {
      const r = document.createElement('div')
      r.className = 'aurora-ring-expand'
      r.style.borderColor = '#c084fc'
      r.style.boxShadow = '0 0 16px #c084fc'
      document.body.appendChild(r)
      setTimeout(() => r.remove(), 1500)
      if (navigator.vibrate) navigator.vibrate([20, 30, 40])
    }

    // Reveal flash: レア度に応じた色でフルスクリーンフラッシュ
    function flashReveal(rarity) {
      const el = document.createElement('div')
      el.className = 'reveal-flash'
      const color = rarity === 'SR' ? 'rgba(255,215,0,0.95)'
                  : rarity === 'R'  ? 'rgba(200,120,255,0.85)'
                  :                   'rgba(180,220,255,0.75)'
      el.style.setProperty('--flash-color', color)
      document.body.appendChild(el)
      setTimeout(() => el.remove(), 700)
    }

    // Charging particles converging toward the globe during spin
    function spawnChargeParticles() {
      const globe = document.getElementById('machine-globe')
      if (!globe) return
      const rect = globe.getBoundingClientRect()
      const cx = rect.left + rect.width / 2
      const cy = rect.top + rect.height / 2
      const N = 14
      for (let i = 0; i < N; i++) {
        setTimeout(() => {
          const p = document.createElement('div')
          p.className = 'charge-particle'
          const angle = Math.random() * Math.PI * 2
          const dist = 80 + Math.random() * 90
          const tx = Math.cos(angle) * dist
          const ty = Math.sin(angle) * dist
          p.style.left = (cx - 3) + 'px'
          p.style.top  = (cy - 3) + 'px'
          p.style.setProperty('--tx', tx + 'px')
          p.style.setProperty('--ty', ty + 'px')
          document.body.appendChild(p)
          setTimeout(() => p.remove(), 950)
        }, i * 55)
      }
    }

    // ===================== GACHA START =====================
    function startGacha() {
      if (currentPoints < 100) {
        showToast('ポイントが足りません (100pt必要)', true)
        return
      }

      const btn = document.getElementById('gacha-btn')
      btn.disabled = true

      const globe = document.getElementById('machine-globe')
      const ball = document.getElementById('capsule-ball')
      ball.classList.remove('spinning')
      void ball.offsetWidth
      ball.classList.add('spinning')
      globe.classList.add('charging')
      if (navigator.vibrate) navigator.vibrate(15)

      pendingPrize = drawPrize()

      // Charging particles
      spawnChargeParticles()

      setTimeout(() => {
        ball.classList.remove('spinning')
        globe.classList.remove('charging')
        // Rarity-tinted flash before card appears
        flashReveal(pendingPrize.rarity)
        setTimeout(() => showResult(pendingPrize), 240)
      }, 950)
    }

    // ===================== SHOW RESULT =====================
    function showResult(prize) {
      const card = document.getElementById('result-card')
      card.className = 'result-card rarity-' + prize.rarity

      document.getElementById('result-emoji').textContent = prize.emoji
      document.getElementById('result-rarity-badge').textContent = prize.rarity
      document.getElementById('result-name').textContent = prize.name
      document.getElementById('result-desc').textContent = prize.desc

      const bonusEl = document.getElementById('result-bonus')
      if (prize.bonus_points) {
        bonusEl.textContent = '✨ 使うと +' + prize.bonus_points + 'pt もらえる'
        bonusEl.style.display = 'block'
      } else {
        bonusEl.style.display = 'none'
      }

      const receiveBtn = document.getElementById('receive-btn')
      receiveBtn.disabled = false
      const replayBtn = document.getElementById('replay-btn')
      if (replayBtn) replayBtn.disabled = (currentPoints < 200)  // need 100 more after this draw

      document.getElementById('result-overlay').classList.add('open')

      // Force name animation restart
      const nameEl = document.getElementById('result-name')
      if (nameEl) {
        nameEl.style.animation = 'none'
        void nameEl.offsetWidth
        nameEl.style.animation = ''
      }

      // Rarity-specific effects
      if (prize.rarity === 'SR') triggerSREffect()
      else if (prize.rarity === 'R') triggerREffect()
    }

    // ===================== RECEIVE AND REPLAY =====================
    async function receiveAndReplay() {
      const replayBtn = document.getElementById('replay-btn')
      if (replayBtn) replayBtn.disabled = true
      await receivePrize()
      // small delay so overlay close animation is not jarring
      setTimeout(() => {
        if (currentPoints >= 100) startGacha()
        else showToast('ポイントが足りません (100pt必要)', true)
      }, 260)
    }

    // ===================== RECEIVE PRIZE =====================
    async function receivePrize() {
      if (!pendingPrize || !currentUser) return
      const prize = pendingPrize
      pendingPrize = null

      const receiveBtn = document.getElementById('receive-btn')
      receiveBtn.disabled = true

      try {
        // Insert gacha result (bonus_points は使用時に付与するのでここでは記録のみ)
        const insertData = {
          user_id:       currentUser.id,
          reward_name:   prize.name,
          reward_emoji:  prize.emoji,
          reward_desc:   prize.desc || prize.description || null,
          rarity:        prize.rarity,
          used:          false,
          bonus_points:  prize.bonus_points || null,
        }
        if (prize.isCustom) {
          insertData.custom_prize_id = prize.id
          insertData.reward_id = null
        } else {
          insertData.reward_id = prize.id
        }
        const { error: resErr } = await _sb.from('gacha_results').insert(insertData)
        if (resErr) throw resErr

        // Deduct 100pt
        const { error: ptErr } = await _sb.from('points').insert({
          user_id: currentUser.id,
          amount:  -100,
          reason:  'gacha',
        })
        if (ptErr) throw ptErr

        // Update UI
        await loadPoints()
        await loadTickets()

        document.getElementById('result-overlay').classList.remove('open')
        showToast(prize.emoji + ' ' + prize.name + ' を獲得！')

      } catch (err) {
        console.error('receive error:', err)
        showToast('エラーが発生しました。もう一度お試しください。', true)
        receiveBtn.disabled = false
        pendingPrize = prize
      }
    }

    // ===================== TICKETS =====================
    let allTickets = []
    let ticketTab = 'usable'  // 'usable' | 'partner' | 'used'

    function setTicketTab(tab) {
      ticketTab = tab
      document.querySelectorAll('.ticket-tab').forEach(el =>
        el.classList.toggle('active', el.dataset.tab === tab)
      )
      renderTickets()
    }

    async function loadTickets() {
      const list = document.getElementById('ticket-list')
      // インベントリは shop.html に移動済み。ticket-list 要素がないページでは no-op
      if (!list) { allTickets = []; return }

      const { data, error } = await _sb
        .from('gacha_results')
        .select('*')
        .order('created_at', { ascending: false })

      if (error) {
        console.error('tickets load error:', error)
        list.innerHTML = '<div class="empty-tickets">券の読み込みに失敗しました</div>'
        return
      }

      allTickets = data || []
      renderTickets()
    }

    function ticketMatchesTab(ticket, tab) {
      const isMine = ticket.user_id === currentUser.id
      const isUsed = ticket.used
      if (tab === 'usable')  return isMine && !isUsed
      if (tab === 'partner') return !isMine && !isUsed
      if (tab === 'used')    return isUsed
      return true
    }

    function renderTickets() {
      const list = document.getElementById('ticket-list')
      if (!list) return  // shop.html に移動済み

      // タブ別カウント更新
      const counts = { usable: 0, partner: 0, used: 0 }
      allTickets.forEach(t => {
        if (ticketMatchesTab(t, 'usable'))  counts.usable++
        if (ticketMatchesTab(t, 'partner')) counts.partner++
        if (ticketMatchesTab(t, 'used'))    counts.used++
      })
      const usableEl  = document.getElementById('tab-count-usable')
      const partnerEl = document.getElementById('tab-count-partner')
      const usedEl    = document.getElementById('tab-count-used')
      if (usableEl)  usableEl.textContent  = counts.usable
      if (partnerEl) partnerEl.textContent = counts.partner
      if (usedEl)    usedEl.textContent    = counts.used

      if (allTickets.length === 0) {
        list.innerHTML = '<div class="empty-tickets">まだ券がありません 🎰</div>'
        return
      }

      const data = allTickets.filter(t => ticketMatchesTab(t, ticketTab))
      if (data.length === 0) {
        const msg = ticketTab === 'usable'
          ? '使える券はありません。ガチャを回そう 🎰'
          : ticketTab === 'partner'
          ? '相手が持ってる券はまだありません'
          : 'まだ使用済みの券はありません'
        list.innerHTML = `<div class="empty-tickets">${msg}</div>`
        return
      }

      list.innerHTML = ''
      data.forEach(ticket => {
        const owner = profiles.find(p => p.id === ticket.user_id)
        const ownerLabel = owner ? `${owner.emoji} ${escHtml(owner.name)}` : ''
        const date = new Date(ticket.created_at).toLocaleDateString('ja-JP')
        const isUsed = ticket.used
        const isMine = ticket.user_id === currentUser.id
        const bonus = ticket.bonus_points

        const card = document.createElement('div')
        const hasCancelAlert = !isMine && ticket.cancel_requested
        card.className = 'ticket-card' + (isUsed && !hasCancelAlert ? ' used' : '')
        if (hasCancelAlert) card.style.borderColor = 'rgba(255,200,80,0.55)'

        let actionHtml
        if (isMine) {
          if (!isUsed) {
            actionHtml = `<button class="use-btn" data-id="${ticket.id}" onclick="markUsed(this,'${ticket.id}')">使用済みにする</button>`
          } else if (ticket.cancel_requested) {
            actionHtml = `<span class="cancel-pending-label">申請中...</span>`
          } else if (!ticket.bonus_points) {
            actionHtml = `<button class="cancel-req-btn" onclick="gachaCancelReq('${ticket.id}')">取り消し申請</button>`
          } else {
            actionHtml = `<span class="used-label">使用済み</span>`
          }
        } else {
          if (ticket.cancel_requested) {
            actionHtml = '' // cancel alert は下に表示
          } else if (isUsed) {
            actionHtml = `<span class="used-label">使用済み</span>`
          } else {
            actionHtml = `<span class="used-label">相手の券</span>`
          }
        }

        const cancelAlertHtml = hasCancelAlert ? `
          <div class="gacha-cancel-alert">
            <span>↩️ 取り消し申請あり</span>
            <button class="gacha-approve-btn" onclick="gachaCancelApprove('${ticket.id}')">承認</button>
            <button class="gacha-deny-btn" onclick="gachaCancelDeny('${ticket.id}')">却下</button>
          </div>` : ''

        card.innerHTML = `
          <div class="ticket-emoji">${escHtml(ticket.reward_emoji)}</div>
          <div class="ticket-info" style="flex:1">
            <div class="ticket-top">
              <span class="ticket-name">${escHtml(ticket.reward_name)}</span>
              <span class="ticket-badge badge-${escHtml(ticket.rarity)}">${escHtml(ticket.rarity)}</span>
            </div>
            ${ownerLabel ? `<div class="ticket-owner">${ownerLabel}</div>` : ''}
            <div class="ticket-desc">${escHtml(ticket.reward_desc || getPrizeDesc(ticket.reward_id, ticket.reward_name))}</div>
            ${bonus && !isUsed ? `<div class="ticket-bonus">使うと +${bonus}pt</div>` : ''}
            <div class="ticket-date">${date}</div>
            ${cancelAlertHtml}
          </div>
          ${actionHtml}
        `
        list.appendChild(card)
      })
    }

    function getPrizeDesc(id, fallbackName) {
      const found = PRIZES.find(p => p.id === id)
      return found ? found.desc : fallbackName
    }

    async function markUsed(btn, ticketId) {
      if (!confirm('この券を使用済みにしますか？')) return
      btn.disabled = true

      // 更新前に bonus_points を取得（自分の券のみ）
      const { data: ticket, error: fetchErr } = await _sb
        .from('gacha_results')
        .select('bonus_points, used, user_id')
        .eq('id', ticketId)
        .single()

      if (fetchErr || !ticket) {
        console.error('markUsed fetch error:', fetchErr)
        showToast('更新に失敗しました', true)
        btn.disabled = false
        return
      }

      if (ticket.user_id !== currentUser.id) {
        showToast('相手の券は使用済みにできません', true)
        btn.disabled = false
        return
      }

      if (ticket.used) {
        showToast('すでに使用済みです', true)
        await loadTickets()
        return
      }

      const { error } = await _sb
        .from('gacha_results')
        .update({ used: true })
        .eq('id', ticketId)

      if (error) {
        console.error('markUsed error:', error)
        showToast('更新に失敗しました', true)
        btn.disabled = false
        return
      }

      // ボーナスポイント付与
      if (ticket.bonus_points && ticket.bonus_points > 0) {
        const { error: bonusErr } = await _sb.from('points').insert({
          user_id: currentUser.id,
          amount:  ticket.bonus_points,
          reason:  'gacha_bonus',
        })
        if (bonusErr) {
          console.error('bonus insert error:', bonusErr)
          showToast('ボーナス付与に失敗しました', true)
          await loadTickets()
          await loadPoints()
          return
        }
        showToast(`使用済み ✅ +${ticket.bonus_points}pt もらった！`)
      } else {
        showToast('使用済みにしました ✅')
      }

      // 相手（partner）に通知 (Push + LINE)
      if (partnerId) {
        const bodyMsg = `${ticket.reward_emoji || '🎁'} ${ticket.reward_name}${ticket.reward_desc ? ' — ' + ticket.reward_desc : ''}`
        _sb.functions.invoke('send-push', { body: {
          title: '🎰 ガチャ券が使われました',
          body: bodyMsg,
          url: '/gacha.html',
          recipient_user_id: partnerId,
          kind: 'gacha',
        }}).catch(() => {})
        _sb.functions.invoke('line-notify', { body: {
          sender_id: currentUser.id,
          target: 'partner',
          message: `🎰 ガチャ券が使われました\n${bodyMsg}`,
        }}).catch(() => {})
      }

      await loadTickets()
      await loadPoints()
    }

    async function gachaCancelReq(ticketId) {
      // 自分（使った側）が取り消し申請 → パートナーに通知
      const { error } = await _sb.from('gacha_results')
        .update({ cancel_requested: true })
        .eq('id', ticketId)
      if (error) { showToast('申請失敗', true); return }
      if (partnerId) {
        // ticket 情報を含めて具体的にする
        const ticket = allTickets ? allTickets.find(t => t.id === ticketId) : null
        const targetName = ticket ? `${ticket.reward_emoji || '🎁'} ${ticket.reward_name}` : '使用済みの券'
        _sb.functions.invoke('send-push', { body: {
          title: '↩️ ガチャ券 取り消し申請',
          body: `${targetName} の取り消しを申請されました`,
          url: '/gacha.html',
          recipient_user_id: partnerId,
          kind: 'gacha',
        }}).catch(() => {})
      }
      showToast('取り消しを申請しました')
      await loadTickets()
    }

    async function gachaCancelApprove(ticketId) {
      // パートナーが承認 → 取り消し＋自分（申請者）に通知
      const { data: ticket } = await _sb.from('gacha_results')
        .select('bonus_points, user_id, reward_name')
        .eq('id', ticketId).single()
      const { error } = await _sb.from('gacha_results')
        .update({ used: false, cancel_requested: false })
        .eq('id', ticketId)
      if (error) { showToast('承認失敗', true); return }
      if (ticket?.bonus_points > 0 && ticket?.user_id) {
        await _sb.from('points').insert({ user_id: ticket.user_id, amount: -ticket.bonus_points, reason: 'gacha_cancel' })
      }
      if (ticket?.user_id) {
        _sb.functions.invoke('send-push', { body: {
          title: '✅ 取り消し承認',
          body: `「${ticket.reward_name}」の取り消しが承認されました`,
          url: '/gacha.html',
          recipient_user_id: ticket.user_id,
        }}).catch(() => {})
      }
      showToast('取り消しを承認しました')
      await loadTickets()
      await loadPoints()
    }

    async function gachaCancelDeny(ticketId) {
      // パートナーが却下 → 申請者に通知
      const { data: ticket } = await _sb.from('gacha_results')
        .select('user_id, reward_name')
        .eq('id', ticketId).single()
      const { error } = await _sb.from('gacha_results')
        .update({ cancel_requested: false })
        .eq('id', ticketId)
      if (error) { showToast('更新失敗', true); return }
      if (ticket?.user_id) {
        _sb.functions.invoke('send-push', { body: {
          title: '❌ 取り消し却下',
          body: `「${ticket?.reward_name}」の申請が却下されました`,
          url: '/gacha.html',
          recipient_user_id: ticket.user_id,
        }}).catch(() => {})
      }
      showToast('申請を却下しました')
      await loadTickets()
    }

    // ===================== TOAST =====================
    let toastTimer = null
    function showToast(msg, isError = false) {
      const el = document.getElementById('toast')
      el.textContent = msg
      el.className = 'toast' + (isError ? ' error' : '')
      void el.offsetWidth
      el.classList.add('show')
      if (toastTimer) clearTimeout(toastTimer)
      toastTimer = setTimeout(() => {
        el.classList.remove('show')
      }, 3000)
    }

    // ===================== UTILS =====================
    function escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
    }

    // ===================== START =====================
    init()
  </script>
</body>
</html>
