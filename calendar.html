<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
  <title>ふたりの予定 | Notre Endroit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const _sb = window.supabase.createClient(
      'https://qivnfiqyjfajlzbdqodd.supabase.co',
      'sb_publishable_PR_chyGmNVRJJ24eVqlqYg_CGAOjfpx'
    )
    _sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) window.location.href = '/login.html'
    })
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #0a1628 0%, #0d2044 40%, #112a5e 100%) fixed; background-attachment: fixed;
      color: #e8f4fd;
      min-height: 100vh;
    }
    .clouds { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: linear-gradient(180deg, rgba(26,48,96,0.85) 0%, transparent 100%); backdrop-filter: blur(4px);
    }

    .top-bar a { color: #98bedd; text-decoration: none; font-size: 0.9rem; }
    .top-bar h1 { font-family: 'Zen Kurenaido', sans-serif; font-size: 1.4rem; color: #e8f4fd; }

    .logout-btn {
      background: #fff; border: 2px solid #e8ddd5; color: #8d6e63;
      padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem;
    }

    .top-right { display: flex; align-items: center; gap: 8px; }

    .user-badge {
      display: none;
      align-items: center;
      gap: 4px;
      background: #fff;
      border: 2px solid #e8ddd5;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.85rem;
      color: #5d4037;
    }

    .content {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* カレンダーナビ */
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .cal-nav button {
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(150,200,255,0.25);
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 1.1rem;
      cursor: pointer;
      color: #e8f4fd;
      transition: background 0.18s, transform 0.14s;
      backdrop-filter: blur(6px);
    }

    .cal-nav button:hover  { background: rgba(255,255,255,0.14); }
    .cal-nav button:active { transform: scale(0.94); }

    .cal-month {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.4rem;
      color: #f0f6ff;
      letter-spacing: 0.06em;
    }

    /* カレンダーグリッド */
    .cal-grid {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(150,200,255,0.18);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.28);
      overflow: hidden;
      margin-bottom: 32px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: rgba(140,240,180,0.10);
      border-bottom: 1px solid rgba(150,200,255,0.14);
    }

    .cal-weekday {
      text-align: center;
      padding: 10px 0;
      font-size: 0.8rem;
      color: #98bedd;
      font-weight: bold;
    }

    .cal-weekday:first-child { color: #ffb3c7; }
    .cal-weekday:last-child  { color: #90caf9; }

    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .cal-day {
      min-height: 64px;
      min-width: 0;
      overflow: hidden;
      border-top: 1px solid rgba(150,200,255,0.08);
      border-right: 1px solid rgba(150,200,255,0.08);
      padding: 6px;
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }

    .cal-day:nth-child(7n) { border-right: none; }

    .cal-day:hover { background: rgba(140,240,180,0.10); }

    .cal-day.other-month { opacity: 0.3; pointer-events: none; }

    .cal-day.today .day-num {
      background: linear-gradient(135deg, #58c58f, #6fd8a0);
      color: #04150c;
      border-radius: 50%;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 12px rgba(140,240,180,0.55);
    }

    .cal-day.has-anniversary .day-num::after {
      content: '💕';
      position: absolute;
      font-size: 0.6rem;
      top: 2px; right: 2px;
    }

    .day-num {
      font-size: 0.85rem;
      color: #e8f4fd;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
    }

    .cal-day:nth-child(7n+1) .day-num { color: #ffb3c7; }
    .cal-day:nth-child(7n) .day-num   { color: #90caf9; }

    .day-events {
      margin-top: 2px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .day-event-dot {
      font-size: 0.7rem;
      background: rgba(140,240,180,0.22);
      border: 1px solid rgba(140,240,180,0.35);
      color: #d6ffe4;
      border-radius: 6px;
      padding: 1px 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* イベントリスト */
    .events-title {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.3rem;
      color: #f0f6ff;
      margin-bottom: 16px;
      padding-left: 12px;
      border-left: 4px solid #58c58f;
    }

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .event-item {
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(150,200,255,0.15);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .event-date-badge {
      background: linear-gradient(135deg, rgba(140,240,180,0.16), rgba(140,240,180,0.28));
      border: 1px solid rgba(140,240,180,0.4);
      border-radius: 10px;
      padding: 8px 12px;
      text-align: center;
      min-width: 52px;
      flex-shrink: 0;
    }

    .event-date-month { font-size: 0.7rem; color: #baffcc; }
    .event-date-day   { font-size: 1.3rem; font-weight: bold; color: #f0f6ff; line-height: 1; }

    .event-info { flex: 1; }
    .event-title { font-size: 0.95rem; color: #e8f4fd; }
    .event-memo  { font-size: 0.8rem; color: #98bedd; margin-top: 2px; }

    .event-past { opacity: 0.45; }

    .delete-event-btn {
      background: none; border: none; color: #5a7fa8;
      cursor: pointer; font-size: 1rem; padding: 4px;
      transition: color 0.18s;
    }
    .delete-event-btn:hover { color: #ff9d9d; }

    .empty { text-align: center; color: #7aadcc; padding: 32px 0; }

    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(5,15,40,0.72);
      backdrop-filter: blur(6px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: linear-gradient(180deg, #0f1f48 0%, #060e24 100%);
      border: 1.5px solid rgba(100,180,255,0.28);
      border-radius: 20px;
      padding: 28px;
      width: min(400px, 90vw);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      color: #e8f4fd;
    }

    .modal h3 {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 1.2rem;
      color: #f0f6ff;
      margin-bottom: 20px;
    }

    .modal label {
      display: block;
      font-size: 0.85rem;
      color: #98bedd;
      margin-bottom: 6px;
    }

    .modal input, .modal textarea {
      width: 100%;
      padding: 10px 14px;
      background: rgba(0,0,0,0.24);
      border: 1.5px solid rgba(150,200,255,0.28);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #e8f4fd;
      outline: none;
      margin-bottom: 14px;
    }
    .modal input::placeholder, .modal textarea::placeholder { color: rgba(200,220,255,0.35); }
    .modal input:focus, .modal textarea:focus { border-color: rgba(140,240,180,0.55); }
    .modal textarea { resize: none; height: 72px; }

    .modal-btns {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .btn-cancel {
      padding: 10px 20px;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(150,200,255,0.28);
      border-radius: 10px;
      color: #98bedd;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      transition: background 0.18s;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.13); }

    .btn-save {
      padding: 10px 24px;
      background: linear-gradient(135deg, #58c58f, #6fd8a0);
      color: #04150c;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: box-shadow 0.18s, transform 0.14s;
      box-shadow: 0 4px 16px rgba(80,200,140,0.32);
    }

    .btn-save:hover  { box-shadow: 0 6px 22px rgba(80,200,140,0.46); }
    .btn-save:active { transform: scale(0.97); }

    /* スマホ対応 */
    @media (max-width: 480px) {
      .top-bar { padding: 12px 16px; }
      .top-bar h1 { font-size: 1.2rem; }
      .content { padding: 16px 12px 80px; }

      .cal-nav button { width: 44px; height: 44px; font-size: 1.2rem; }
      .cal-day { min-height: 56px; padding: 4px 3px; }
      .cal-weekday { padding: 8px 0; font-size: 0.75rem; }
      .day-num { font-size: 0.8rem; }

      /* イベントドットはモバイルで1件のみ表示 */
      .day-event-dot ~ .day-event-dot { display: none; }

      /* モーダルをボトムシートに */
      .modal-overlay { align-items: flex-end; }
      .modal {
        border-radius: 20px 20px 0 0;
        width: 100%;
        padding: 24px 20px 32px;
      }
      .modal input, .modal textarea { font-size: 16px; }
      .btn-save, .btn-cancel { padding: 12px 20px; font-size: 1rem; }
      .btn-save { flex: 1; }

      .event-item, .anniversary-row { padding: 12px; }
      .delete-event-btn { padding: 8px; font-size: 1.1rem; }
    }

    /* 記念日マーク */
    .anniversary-row {
      background: linear-gradient(135deg, rgba(255,215,100,0.12), rgba(255,180,50,0.18));
      border: 1.5px solid rgba(255,215,100,0.4);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
      backdrop-filter: blur(10px);
    }

    /* コンテンツを星背景の上に */
    .top-bar, .content { position: relative; z-index: 1; }
  </style>
</head>
<body style="visibility:hidden" onload="document.body.style.visibility='visible'">
  <div class="clouds"></div>
  <script src="assets/js/stars.js?v=3"></script>
  <script src="assets/js/header.js"></script>
  <script src="assets/js/nav.js"></script>
  <div class="top-bar">
    <a href="/">← もどる</a>
    <h1>ふたりの予定</h1>
  </div>

  <div class="content">
    <div class="cal-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="cal-month" id="cal-month"></div>
      <button onclick="changeMonth(1)">›</button>
    </div>

    <div class="cal-grid">
      <div class="cal-weekdays">
        <div class="cal-weekday">日</div>
        <div class="cal-weekday">月</div>
        <div class="cal-weekday">火</div>
        <div class="cal-weekday">水</div>
        <div class="cal-weekday">木</div>
        <div class="cal-weekday">金</div>
        <div class="cal-weekday">土</div>
      </div>
      <div class="cal-days" id="cal-days"></div>
    </div>

    <h2 class="events-title">⭐ 予定リスト</h2>
    <div class="event-list" id="event-list"></div>
  </div>

  <!-- 追加モーダル -->
  <div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3 id="modal-title">予定を追加</h3>
      <label>タイトル</label>
      <input type="text" id="ev-title" placeholder="どこ行く？なにする？" maxlength="60">
      <label>開始日</label>
      <input type="date" id="ev-date">
      <label>終了日（任意・複数日の場合）</label>
      <input type="date" id="ev-date-end">
      <label>メモ（任意）</label>
      <textarea id="ev-memo" placeholder="集合場所・時間など"></textarea>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
        <button class="btn-save" onclick="saveEvent()">追加</button>
      </div>
    </div>
  </div>

  <script>
    const ANNIVERSARY = new Date('2025-11-22')
    let currentYear  = new Date().getFullYear()
    let currentMonth = new Date().getMonth()
    let events = []

    async function loadEvents() {
      const { data } = await _sb
        .from('events')
        .select('*')
        .order('date', { ascending: true })
      events = data || []
      renderCalendar()
      renderEventList()
    }

    function renderCalendar() {
      const monthEl = document.getElementById('cal-month')
      monthEl.textContent = `${currentYear}年 ${currentMonth + 1}月`

      const daysEl = document.getElementById('cal-days')
      daysEl.innerHTML = ''

      const today = new Date()
      const firstDay = new Date(currentYear, currentMonth, 1)
      const lastDay  = new Date(currentYear, currentMonth + 1, 0)
      const startDow = firstDay.getDay()

      // 前月の日を埋める
      for (let i = 0; i < startDow; i++) {
        const d = new Date(currentYear, currentMonth, -startDow + i + 1)
        daysEl.appendChild(makeDay(d, true))
      }
      // 今月の日
      for (let d = 1; d <= lastDay.getDate(); d++) {
        const date = new Date(currentYear, currentMonth, d)
        daysEl.appendChild(makeDay(date, false))
      }
      // 次月の日を埋める（6行になるよう）
      const total = startDow + lastDay.getDate()
      const remaining = total % 7 === 0 ? 0 : 7 - (total % 7)
      for (let i = 1; i <= remaining; i++) {
        const d = new Date(currentYear, currentMonth + 1, i)
        daysEl.appendChild(makeDay(d, true))
      }
    }

    function makeDay(date, otherMonth) {
      const cell = document.createElement('div')
      cell.className = 'cal-day' + (otherMonth ? ' other-month' : '')

      const today = new Date()
      if (!otherMonth &&
          date.getFullYear() === today.getFullYear() &&
          date.getMonth() === today.getMonth() &&
          date.getDate() === today.getDate()) {
        cell.classList.add('today')
      }

      // 記念日チェック（月/日が11/22）
      if (date.getMonth() === 10 && date.getDate() === 22) {
        cell.classList.add('has-anniversary')
      }

      const dateStr = toDateStr(date)
      const dayEvents = events.filter(e => e.date <= dateStr && (e.date_end || e.date) >= dateStr)

      const numEl = document.createElement('div')
      numEl.className = 'day-num'
      numEl.textContent = date.getDate()
      cell.appendChild(numEl)

      if (dayEvents.length > 0) {
        const dotsEl = document.createElement('div')
        dotsEl.className = 'day-events'
        dayEvents.slice(0, 2).forEach(ev => {
          const dot = document.createElement('div')
          dot.className = 'day-event-dot'
          dot.textContent = ev.title
          dotsEl.appendChild(dot)
        })
        cell.appendChild(dotsEl)
      }

      if (!otherMonth) {
        cell.onclick = () => openModal(dateStr)
      }

      return cell
    }

    function renderEventList() {
      const list = document.getElementById('event-list')
      list.innerHTML = ''

      const today = toDateStr(new Date())

      // 記念日を今年/来年分挿入
      const anniversaries = []
      for (let y = currentYear - 1; y <= currentYear + 1; y++) {
        anniversaries.push({ date: `${y}-11-22`, title: '💕 記念日', memo: '11/22', anniversary: true })
      }

      const allEvents = [...anniversaries, ...events]
        .filter(e => e.date >= today)
        .sort((a, b) => a.date.localeCompare(b.date))
        .slice(0, 20)

      if (allEvents.length === 0) {
        list.innerHTML = '<div class="empty">まだ予定がありません 🌿</div>'
        return
      }

      allEvents.forEach(ev => {
        const d = new Date(ev.date + 'T00:00:00')
        const month = d.getMonth() + 1
        const day   = d.getDate()

        let dateLabel = `${month}月`
        let dayLabel  = `${day}`
        if (ev.date_end && ev.date_end !== ev.date) {
          const de = new Date(ev.date_end + 'T00:00:00')
          dayLabel = `${day}〜${de.getDate()}`
          if (de.getMonth() + 1 !== month) dateLabel = `${month}/${day}〜${de.getMonth()+1}/${de.getDate()}`
        }

        const item = document.createElement('div')
        item.className = ev.anniversary ? 'anniversary-row' : 'event-item' + (ev.date < today ? ' event-past' : '')

        item.innerHTML = `
          <div class="event-date-badge">
            <div class="event-date-month">${dateLabel}</div>
            <div class="event-date-day" style="font-size:${dayLabel.length > 3 ? '0.9rem' : '1.3rem'}">${dayLabel}</div>
          </div>
          <div class="event-info">
            <div class="event-title">${escHtml(ev.title)}</div>
            ${ev.memo ? `<div class="event-memo">${escHtml(ev.memo)}</div>` : ''}
          </div>
          ${ev.id ? `<button class="delete-event-btn" data-id="${ev.id}">✕</button>` : ''}
        `
        list.appendChild(item)
      })
    }

    document.getElementById('event-list').addEventListener('click', async e => {
      const btn = e.target.closest('.delete-event-btn')
      if (!btn) return
      if (!confirm('この予定を削除しますか？')) return
      const id = btn.dataset.id
      events = events.filter(ev => String(ev.id) !== id)
      renderCalendar()
      renderEventList()
      await _sb.from('events').delete().eq('id', id)
    })

    function changeMonth(delta) {
      currentMonth += delta
      if (currentMonth < 0)  { currentMonth = 11; currentYear-- }
      if (currentMonth > 11) { currentMonth = 0;  currentYear++ }
      renderCalendar()
      renderEventList()
    }

    let pendingDate = ''

    function openModal(dateStr) {
      pendingDate = dateStr
      document.getElementById('ev-date').value = dateStr
      document.getElementById('ev-date-end').value = ''
      document.getElementById('ev-title').value = ''
      document.getElementById('ev-memo').value = ''
      document.getElementById('modal').classList.add('open')
      setTimeout(() => document.getElementById('ev-title').focus(), 50)
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open')
    }

    async function saveEvent() {
      const title   = document.getElementById('ev-title').value.trim()
      const date    = document.getElementById('ev-date').value
      const dateEnd = document.getElementById('ev-date-end').value
      const memo    = document.getElementById('ev-memo').value.trim()
      if (!title || !date) return

      const payload = { title, date, memo: memo || null, date_end: dateEnd || null }
      const { data } = await _sb.from('events').insert(payload).select().single()
      if (data) {
        events.push(data)
        events.sort((a, b) => a.date.localeCompare(b.date))
        renderCalendar()
        renderEventList()

        const { data: { session } } = await _sb.auth.getSession()
        const dateLabel = data.date_end && data.date_end !== data.date
          ? `${data.date}〜${data.date_end}` : data.date
        // Push通知だけ（LINE群通知は廃止）
        _sb.functions.invoke('send-push', {
          body: {
            title: '📅 予定を追加したよ',
            body: `${data.title}（${dateLabel}）`,
            url: '/calendar.html',
            sender_user_id: session.user.id,
          },
        }).then(({ error }) => { if (error) console.error('[calendar] push error:', error) })
      }
      closeModal()
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal()
    })

    document.getElementById('ev-title').addEventListener('keydown', e => {
      if (e.key === 'Enter') saveEvent()
    })

    function toDateStr(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    loadEvents()

    // ユーザーバッジ
  </script>
</body>
</html>
