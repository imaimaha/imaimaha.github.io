<!DOCTYPE html>
<html lang="ja">
<head>

  <title>ふたりの場所</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const _sb = window.supabase.createClient(
      'https://qivnfiqyjfajlzbdqodd.supabase.co',
      'sb_publishable_PR_chyGmNVRJJ24eVqlqYg_CGAOjfpx'
    )
    _sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) window.location.href = '/login.html'
    })
  </script>
</head>
<body style="visibility:hidden" onload="document.body.style.visibility='visible'">

  <div style="position:fixed;top:16px;right:16px;z-index:100">
    <button onclick="_sb.auth.signOut().then(()=>location.href='/login.html')" style="background:#fff;border:2px solid #e8ddd5;color:#8d6e63;padding:6px 16px;border-radius:20px;cursor:pointer;font-size:0.85rem">ログアウト</button>

  <div class="clouds">
    <div class="cloud cloud-1"></div>

  <header class="hero">

      <h1 class="title">ふたりの場所</h1>
      <p class="subtitle">思い出と、これからの話</p>
      <div class="hero-photo-frame">
        <img src="assets/images/memories/ginza_01.jpg" alt="銀座の思い出" class="hero-photo">
        <div class="photo-label">📍 銀座エリザベート</div>
      </div>
    </div>
  </header>

  <nav class="menu">
    <a href="#memories" class="menu-item">🌸 思い出</a>

    <a href="#wishlist" class="menu-item">✨ 行きたい場所</a>

        </div>
        <div class="gallery-item empty">
          <div class="empty-slot">＋<br><span>思い出を追加</span></div>
        </div>
        <div class="gallery-item empty">
          <div class="empty-slot">＋<br><span>思い出を追加</span></div>
        </div>
      </div>
    </section>

    <section id="schedule" class="section">
      <h2 class="section-title">つぎの予定</h2>
      <div class="schedule-card">
        <div class="schedule-date">📅 予定を入れよう</div>
        <p class="schedule-desc">まだ予定がありません</p>
      </div>
    </section>

    <section id="wishlist" class="section">
      <h2 class="section-title">やりたいことリスト</h2>
      <a href="/wishlist.html" style="display:block;background:#fff;border-radius:16px;padding:24px;box-shadow:0 3px 12px rgba(0,0,0,0.08);text-decoration:none;color:#5d4037;transition:transform 0.2s;" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform=''">
        <div style="font-size:1.5rem;margin-bottom:8px">📍 🍽️ 🎬 🎁</div>
        <div style="font-size:0.95rem;color:#8d6e63">4つのジャンルで2人のやりたいことを管理 →</div>
