<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
  <title>Notre Endroit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #0a1628 0%, #0d2044 40%, #112a5e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    h1 {
      font-family: 'Zen Kurenaido', sans-serif;
      font-size: 2rem;
      color: #5d4037;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #a1887f;
      font-size: 0.85rem;
      margin-bottom: 32px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e8ddd5;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #4a3f35;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #a5d6a7; }

    button {
      width: 100%;
      padding: 13px;
      background: #81c784;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    button:hover { background: #66bb6a; transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .error {
      color: #e57373;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
    }

    .leaf { font-size: 2rem; margin-bottom: 16px; }

    .clouds { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .card { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div class="clouds"></div>
  <script src="assets/js/stars.js?v=202608061558"></script>
  <div class="card">
    <div class="leaf">🌿</div>
    <h1>Notre Endroit</h1>
    <p class="subtitle">ログインしてください</p>

    <input type="email" id="email" placeholder="メールアドレス">
    <input type="password" id="password" placeholder="パスワード">
    <button onclick="login()">ログイン</button>
    <p class="error" id="error-msg">メールアドレスまたはパスワードが違います</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://qivnfiqyjfajlzbdqodd.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_PR_chyGmNVRJJ24eVqlqYg_CGAOjfpx'
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    // すでにログイン済みならトップへ
    client.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = '/'
    })

    async function login() {
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const { error } = await client.auth.signInWithPassword({ email, password })
      if (error) {
        document.getElementById('error-msg').style.display = 'block'
      } else {
        window.location.href = '/'
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') login()
    })
  </script>
</body>
</html>
